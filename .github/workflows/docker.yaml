name: Imatge Docker

# `docs/12` §1 demana una imatge **multi-arquitectura**: qui s'autoallotja Fem-ho ho fa
# tant en un servidor x86 com en una Raspberry Pi, i publicar-ne només una vol dir que
# la meitat de la gent no la pot fer servir.
#
# Es publica a GHCR i no a Docker Hub: va amb el repositori, no necessita cap compte ni
# cap secret afegit, i les credencials són les que GitHub ja dona a cada execució.

on:
  push:
    branches: [main]
    tags: ['v*']
  # A les propostes es CONSTRUEIX però no es publica: que una branca qualsevol pugui
  # escriure al registre és com es publiquen imatges que ningú ha revisat.
  pull_request:
  # A mà: reconstruir la imatge o l'APK sense esperar cap canvi de codi és el que
  # calen el dia que una dependència base es corregeix i el que hi ha publicat encara
  # porta la versió vella.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # `arm64` es construeix per emulació. És lent —uns quants minuts— i és el preu de
      # no tenir un runner ARM; l'alternativa és no publicar-la, que no és alternativa.
      - name: QEMU
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar al registre
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` només a `main`, i una etiqueta per versió a cada `v*`. Sense la segona,
      # tornar enrere vol dir reconstruir, i no hi ha manera de dir "la de dijous".
      - name: Etiquetes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir i publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # La imatge ha d'arrencar, no només construir-se. Un `healthz` que respon és el
      # mínim que distingeix una imatge publicada d'una que no serveix de res.
      #
      # I des de l'agost del 2026, també **el comandament de còpia que documentem**. El de
      # `docs/BACKUP.md` no havia funcionat mai a la imatge publicada —`better-sqlite3` viu
      # al `node_modules` del servidor i no al de l'arrel, i faltava el directori de
      # treball—, i es va descobrir el dia que va caldre fer una còpia de veritat abans
      # d'una migració. Un procediment de còpia trencat només es nota el pitjor dia.
      - name: Comprovar que arrenca
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load --platform linux/amd64 -t femho:ci .
          docker run -d --name femho-ci -p 8080:8080 \
            -e FEMHO_DATABASE_URL=sqlite:///data/femho.db femho:ci

          arrencat=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then echo; arrencat=1; break; fi
            sleep 2
          done
          if [ "$arrencat" != "1" ]; then
            echo "La imatge no ha arrencat:"
            docker logs femho-ci
            exit 1
          fi

          # Literalment la línia de `docs/BACKUP.md`. Si algú la canvia i deixa d'anar,
          # això falla aquí i no a casa de ningú. El `-w` és la meitat del que es comprova.
          docker exec -w /app/apps/server femho-ci \
            node -e "new (require('better-sqlite3'))('/data/femho.db').backup('/data/backups/ci.db')"
          docker exec femho-ci sh -c 'test -s /data/backups/ci.db' \
            || { echo "El comandament de còpia de docs/BACKUP.md no ha deixat cap fitxer"; exit 1; }
          echo "Còpia de seguretat · el comandament documentat funciona"
