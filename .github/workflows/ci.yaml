name: CI

# La comprovació de la fita M1 és `build + lint + typecheck + openapi-diff`
# (docs/13). Les vuit comprovacions permanents van a cada canvi proposat, no només
# a la seva fita.

on:
  push:
    branches: ['**']
  pull_request:
  # A mà. Cal el dia que Actions s'ha recuperat d'una avaria i s'han de tornar a
  # executar les feines que no va agafar cap runner, sense inventar-se un commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # D11: CI prova els DOS motors. No és cosmètic — decideix FTS5 contra tsvector per
    # a la cerca en català, i és on es veu el parany de visibilitat fora d'ordre del
    # cursor de sync, que a SQLite pràcticament no existeix i a Postgres sí.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: femho
          POSTGRES_DB: femho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FEMHO_TEST_POSTGRES_URL: postgres://postgres:femho@localhost:5432/femho_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` i no `npm install`: instal·la exactament el que diu el lockfile i
      # falla si el manifest i el lockfile no quadren. Les versions es van congelar a
      # M1 i no han de derivar (regla 2).
      - name: Instal·lar
        run: npm ci

      - name: Formatació
        run: npm run format:check

      - name: Linter
        run: npm run lint

      - name: Tipus
        run: npm run typecheck

      - name: Construcció
        run: npm run build

      - name: Proves
        run: npm test

      # Inclou openapi-diff, que és el que fa fallar CI si algú toca un handler sense
      # actualitzar el contracte (regla 5).
      - name: Comprovacions permanents
        run: npm run check
