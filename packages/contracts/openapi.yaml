openapi: 3.1.0

info:
  title: Fem-ho
  version: 0.3.0
  description: |
    Contracte de l'API de Fem-ho. Aquest fitxer és la font de veritat (regla 5
    d'instruccions.md): els tipus de TypeScript i el client de Kotlin es generen des
    d'aquí i cap client escriu tipus a mà. Un endpoint que no hi és no existeix.

    A M1 només hi ha les dues rutes públiques de vida i identitat. La resta arriba a
    la seva fita, seguint docs/05-api-rest.md.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /api/v1
    description: Base de l'API. GET /info i GET /healthz pengen de l'arrel, no d'aquí.

tags:
  - name: instance
    description: Identitat i salut de la instància. Públic i sense autenticar.
  - name: scopes
    description: Àmbits i projectes. Una tasca sempre té àmbit; el projecte és opcional.
  - name: sync
    description: |
      El contracte de sincronització. L'implementen DOS clients —la web i Android— i han
      de fer-ho igual (docs/06).
  - name: checklists
    description: |
      Llistes senzilles. Un ítem només té text i fet/no fet (P1); la riquesa va al
      contenidor, que es pot pinejar i compartir.
  - name: events
    description: |
      Esdeveniments i calendaris. Un esdeveniment NO és una tasca amb hores (D8) i no
      surt mai al kanban.
  - name: tasks
    description: |
      Tasques i el tauler. La columna es diu `status` amb valors anglesos (D2), i
      l'ordre dins d'ella és `position`, un índex fraccional calculat al client (D3).
  - name: mail
    description: |
      El correu com a font d'entrada. **Un compte és d'una persona, no d'un àmbit**: la
      contrasenya del teu correu no és de la casa. Una regla diu què es fa amb el que
      arriba a una carpeta, i **una carpeta sense regla no es llegeix mai**.
  - name: ai
    description: |
      El terreny d'IA. **Fem-ho no té motor d'IA propi** (`docs/09`): la intel·ligència és
      sempre externa i entra per MCP o per l'API. El que hi ha aquí diu si la instància té
      credencials d'un model, i **res les fa servir encara** (P10).
  - name: auth
    description: |
      Sessions i compte. docs/05 §1. Els tokens de refresc roten: cada refresc n'emet un
      de nou i invalida l'anterior, i reutilitzar-ne un de gastat revoca la família.

paths:
  /info:
    servers:
      - url: /
    get:
      tags: [instance]
      operationId: getInfo
      summary: Identitat de la instància
      description: |
        Públic i sense autenticar. És el que fa servir Android per validar la URL del
        servidor abans de demanar credencials (docs/05 §4), i el que li permet avisar
        si el servidor és més nou que l'app.
      security: []
      responses:
        '200':
          description: La instància respon i s'identifica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'

  /healthz:
    servers:
      - url: /
    get:
      tags: [instance]
      operationId: getHealthz
      summary: El procés és viu
      description: |
        Comprova només que el procés respon. No toca la base de dades: per a això hi ha
        /readyz (docs/12 §8). És el healthcheck del contenidor.
      security: []
      responses:
        '200':
          description: El procés és viu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    servers:
      - url: /
    get:
      tags: [instance]
      operationId: getReadyz
      summary: Base de dades accessible i migracions aplicades
      description: |
        docs/12 §8. A diferència de /healthz, aquesta SÍ que toca la base: diu si la
        instància pot servir peticions de veritat.

        Van separades a propòsit. Si el healthcheck del contenidor depengués de la base,
        una base lenta reiniciaria el contenidor en bucle, que és el pitjor que pot
        passar amb SQLite a mig escriure.
      security: []
      responses:
        '200':
          description: La base respon i l'esquema és al dia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: La base no respon o les migracions no s'han aplicat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /users/{id}/avatar:
    get:
      tags: [auth]
      operationId: userAvatar
      summary: La foto d'una persona
      description: |
        **Passa pel servidor a posta.** Un `<img>` directe a gravatar.com seria una línia
        menys, però llavors cada navegador de casa parlaria amb Automattic i els arribaria
        la IP de cadascú a cada càrrega de pàgina. Així en veuen una, i la còpia es guarda
        al volum —o sigui que la cara segueix sortint sense connexió.

        Demana sessió com la resta de l'API: qui són les persones d'aquesta instància no és
        públic.

        Un **404 no és un error**: vol dir que la instància no té Gravatar encès, que la
        persona ha dit que no, o que no en té. La interfície es queda amb les inicials.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: La imatge. El tipus s'infereix del contingut.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: No en té, o no toca.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/gravatar:
    get:
      tags: [auth]
      operationId: myGravatarProfile
      summary: Què sap Gravatar del meu correu
      description: |
        **Per proposar, no per aplicar.** Ajustos ofereix omplir el que tinc buit; fer-ho
        sol seria canviar-me el nom que he escrit aquí pel que vaig posar fa cinc anys en
        un altre lloc. Només del propi perfil.

        Va contra `api.gravatar.com/v3`, i **no** contra el `gravatar.com/<hash>.json` que
        surt a mig internet: aquell ja no funciona i respon `404 "User not found"` fins i
        tot per a un correu que sí que té perfil i foto.
      responses:
        '200':
          description: El que hi ha, o `null` si no hi ha res o la instància ho té apagat.
          content:
            application/json:
              schema:
                type: [object, 'null']
                properties:
                  display_name: { type: [string, 'null'] }
                  location: { type: [string, 'null'] }
                  description: { type: [string, 'null'] }
                  pronouns: { type: [string, 'null'] }
                  job_title: { type: [string, 'null'] }
                  company: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Fer-se un compte
      description: |
        Només quan la instància ho permet: `FEMHO_ALLOW_REGISTRATION=true`, o el seu
        equivalent llarg `FEMHO_REGISTRATION=open`. Si no, respon 403 i diu que cal
        demanar un convit a qui la porta.

        **El primer que es registra és administrador** i es troba els àmbits inicials: amb
        la base buida, registrar-se *és* el primer arrencament, i no un camí paral·lel.
        Del segon endavant, `member` amb un àmbit propi.

        **Mai es diu si el correu ja existeix** (docs/02 §2): un correu repetit respon
        exactament igual que un de nou i triga el mateix, perquè si no el formulari seria
        una manera d'esbrinar qui té compte en aquesta casa. Amb el mateix bloqueig
        progressiu que el login: sense ell, una instància oberta és un formulari per crear
        comptes en massa.

        Deixa la sessió oberta: torna els mateixos tokens que el login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email }
                name:
                  type: string
                  description: >-
                    El nom amb què es veu la persona. És `users.name`, el mateix que demana
                    el primer arrencament; no hi ha un identificador d'usuari a part.
                password: { type: string, minLength: 12 }
                locale:
                  type: string
                  description: L'idioma del navegador, per al perfil i els àmbits inicials.
      responses:
        '201':
          description: Compte creat, i la sessió ja oberta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '403':
          description: La instància no accepta comptes nous.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Correu que no ho sembla, nom buit o contrasenya massa curta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Massa intents. Porta `Retry-After`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Entrar amb correu i contrasenya
      description: |
        Retorna un token d'accés de vida curta i un de refresc de vida llarga.

        **Mai es diu si el correu existeix o no** (docs/02 §2): un correu desconegut i
        una contrasenya errònia donen exactament la mateixa resposta i triguen el
        mateix. Amb 10 intents fallits en 15 minuts comença un bloqueig progressiu
        comptat per correu, no per IP — darrere d'un proxy casolà totes les peticions
        comparteixen IP (docs/05 §7).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credencials correctes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Correu o contrasenya incorrectes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Massa intents. Porta `Retry-After`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotar el token de refresc
      description: |
        Emet un token nou i invalida l'anterior. Si arriba un token ja gastat es revoca
        tota la família de sessions: és senyal de robatori i no se sap quina de les dues
        bandes és la legítima (docs/05 §1).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token rotat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Token no vàlid, caducat, revocat o ja gastat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Tancar la sessió
      responses:
        '204':
          description: Sessió revocada.
        '401':
          description: Cal estar autenticat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuari, capacitats efectives i àmbits
      description: |
        Diu QUÈ pot fer aquesta credencial i A QUINS àmbits arriba. És l'equivalent REST
        de la tool `whoami` d'MCP, i existeix pel mateix motiu: que qui la fa servir
        sàpiga els seus límits abans de trobar-se un 403.
      responses:
        '200':
          description: Qui pregunta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Cal estar autenticat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    # CONVENCIÓ DE LLISTES
    #
    # Les llistes **paginades** tornen `{ data, next_cursor, has_more }` (docs/05 §3). Les
    # que no es paginen —àmbits, projectes, calendaris— tornen l'array pelat: un envoltori
    # amb un sol camp que no porta cap cursor només afegeix una indirecció a cada client.
    #
    # `/tokens`, `/shares` i `/activity` fan servir l'envoltori sense paginar. És una
    # inconsistència coneguda i es deixa estar a posta: canviar-los ara trencaria els
    # clients per un guany estètic.
    patch:
      tags: [auth]
      operationId: updateProfile
      summary: Modificar el propi perfil
      description: |
        Aquí es toca NOMÉS el compte propi. El brief és explícit (línia 42): al Perfil no
        s'editen els altres; això és a `/admin/users`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                timezone: { type: string, description: 'Nom IANA. Es valida amb `Intl`.' }
                locale:
                  type: string
                  enum: [ca, en, es]
                theme: { type: string, enum: [system, light, dark] }
                accent: { type: string, enum: [default, soft, mono-warm, mono-cool] }
                avatar_color: { type: [string, 'null'] }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Un valor d'enum o un fus que no existeixen.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /scopes:
    get:
      tags: [scopes]
      operationId: listScopes
      summary: Els àmbits que veu qui pregunta
      responses:
        '200':
          description: Àmbits accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [scopes]
      operationId: createScope
      summary: Crear un àmbit
      description: |
        Individual o col·lectiu (brief línia 44). L'`id` el pot posar el client: és un
        UUIDv7 nu (D4) i crear offline no ha de necessitar cap resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeInput'
      responses:
        '201':
          description: Creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scope'
        '200':
          description: Ja existia amb aquest `id`. Idempotència (docs/05 §3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects:
    get:
      tags: [scopes]
      operationId: listProjects
      summary: Projectes, filtrables per àmbit
      parameters:
        - name: scope_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Projectes accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [scopes]
      operationId: createProject
      summary: Crear un projecte dins d'un àmbit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Tasques amb filtres
      parameters:
        - name: scope_id
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Valors múltiples separats per comes.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          description: Cursor opac. El client no l'ha d'interpretar mai.
          schema:
            type: string
      responses:
        '200':
          description: Pàgina de tasques.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [tasks]
      operationId: createTask
      summary: Crear una tasca
      description: |
        **`scope_id` és obligatori.** És la invariant central del producte: pot ser que
        un àmbit tingui una tasca sense projecte, però mai una tasca sense àmbit
        (docs/01 §4). L'`id` i la `position` els pot posar el client (D3, D4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '200':
          description: Ja existia amb aquest `id`. Idempotència.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Falta l'àmbit, o no és vàlid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /tasks/{id}/move:
    post:
      tags: [tasks]
      operationId: moveTask
      summary: Moure una tasca de columna o de posició
      description: |
        Existeix a part de `PATCH` perquè moure és l'operació més freqüent del producte,
        la que més s'ha de fusionar offline, i la que necessita la seva pròpia semàntica
        de conflicte (docs/05 §4).

        S'accepta `position` directament —el camí normal, calculada al client (D3)— o
        `{before_id, after_id}` perquè el servidor la calculi, per a clients simples.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveInput'
      responses:
        '200':
          description: Moguda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/complete:
    post:
      tags: [tasks]
      operationId: completeTask
      summary: Completar una tasca
      description: |
        Aplica la cascada i genera la següent instància si es repeteix (docs/05 §4).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /board:
    get:
      tags: [tasks]
      operationId: getBoard
      summary: Les quatre columnes en una crida
      description: |
        Existeix perquè pintar el tauler amb quatre peticions paral·lelitzades dona
        quatre estats de càrrega i quatre punts de fallada per a una sola pantalla
        (docs/05 §4).
      parameters:
        - name: scope_ids
          in: query
          description: Àmbits actius, separats per comes. Sense això, tots els visibles.
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: El tauler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Esdeveniments en una finestra
      description: |
        **Requereix `from` i `to`**: sense finestra no es poden expandir repeticions
        (docs/05 §4). Una RRULE sense COUNT ni UNTIL és infinita.

        Torna OCURRÈNCIES, no files: una sèrie setmanal dins d'un mes surt quatre
        vegades, cadascuna amb el seu `recurrence_id`.

        **Els esdeveniments no surten mai al kanban** (D8). Aquesta és l'única manera
        de demanar-los.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: scope_ids
          in: query
          description: Àmbits actius, separats per comes.
          schema: { type: string }
      responses:
        '200':
          description: Ocurrències dins de la finestra, ordenades per inici.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOccurrence'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Falta la finestra, o no és vàlida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [events]
      operationId: createEvent
      summary: Crear un esdeveniment
      description: |
        Un esdeveniment **no és una tasca amb hores** (D8): té els seus propis `status`
        —TENTATIVE, CONFIRMED, CANCELLED—, té `transparency`, i un calendari extern
        subscrit només en pot produir d'aquests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '200':
          description: Ja existia amb aquest `id`. Idempotència.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events/{id}:
    patch:
      tags: [events]
      operationId: updateEvent
      summary: Modificar un esdeveniment o una sèrie
      description: |
        `series_mode` resol "aquest esdeveniment, aquest i els següents, o tota la
        sèrie" (docs/05 §4):

        - `single` crea una instància modificada, una fila germana amb el seu
          `RECURRENCE-ID` (D8).
        - `future` **parteix la sèrie**: posa `UNTIL` al mestre i en crea un de nou.
          **No emet mai `RANGE=THISANDFUTURE`.**
        - `all` toca el mestre.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: series_mode
          in: query
          schema:
            type: string
            enum: [single, future, all]
            default: single
        - name: occurrence
          in: query
          description: L'ocurrència afectada, per als modes `single` i `future`.
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Modificat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Falta l'ocurrència per al mode demanat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    get:
      tags: [events]
      operationId: getEvent
      summary: Un esdeveniment
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: L'esdeveniment.
          content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [events]
      operationId: deleteEvent
      summary: Esborrar un esdeveniment o part d'una sèrie
      description: |
        `single` posa un EXDATE al mestre —esborrar la fila no serviria, el mestre la
        tornaria a generar—; `future` parteix la sèrie amb `UNTIL`; `all` se l'endú
        sencera. Mai s'emet `RANGE=THISANDFUTURE` (D8).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - {
            name: series_mode,
            in: query,
            required: false,
            schema: { type: string, enum: [single, future, all] },
          }
        - {
            name: occurrence,
            in: query,
            required: false,
            schema: { type: string, format: date-time },
          }
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: El calendari és una subscripció.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /calendars:
    get:
      tags: [events]
      operationId: listCalendars
      summary: Els calendaris que veu qui pregunta
      description: |
        Cada àmbit i cada projecte que es publiqui genera **DUES** col·leccions (D9):
        una `events` i una `todos`. RFC 4791 §5.2 prohibeix recursos de components
        mixtos, DAVx⁵ classifica una col·lecció només per
        `supported-calendar-component-set`, i el CalDAV de Google no accepta VTODO.
      responses:
        '200':
          description: Calendaris accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Calendar'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    post:
      tags: [events]
      operationId: createCalendar
      summary: Crear un calendari
      description: |
        `origin: subscription` necessita `source_url`. Una subscripció és de només
        lectura a la capa de repositori, no només a la interfície (docs/01 §5).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarInput' } } }
      responses:
        '201':
          description: Creat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } }
        '200':
          description: Ja existia amb aquest `id`.
          content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Falta l'àmbit, el nom o la URL d'origen.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /tasks/{id}/checklists:
    get:
      tags: [checklists]
      operationId: listChecklists
      summary: Les llistes senzilles d'una tasca
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Llistes amb els seus ítems.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Checklist'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [checklists]
      operationId: createChecklist
      summary: Crear una llista dins d'una tasca
      description: |
        Una llista pertany **sempre** a una tasca, i opcionalment s'ancora a una subtasca
        concreta (P1). No és un subprojecte ni una subtasca: són dues taules i un flag de
        presentació.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistInput'
      responses:
        '201':
          description: Creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /checklists/{id}/items:
    post:
      tags: [checklists]
      operationId: createChecklistItem
      summary: Afegir un ítem
      description: |
        Un ítem **només té text i fet/no fet** (P1). Cap data, cap assignat, cap
        niuament. La contenció és deliberada i ve de Things 3: és el que fa que la llista
        no es converteixi en un segon gestor de tasques dins del gestor de tasques.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemInput'
      responses:
        '201':
          description: Afegit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      tags: [checklists]
      operationId: listChecklistItems
      summary: Els ítems d'una llista
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Els ítems.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /checklists/{id}:
    get:
      tags: [checklists]
      operationId: getChecklist
      summary: Una llista, amb els seus ítems
      description: |
        Porta `task_title` perquè la vista de llista senzilla el pinta com a molla de pa
        clicable (docs/02 §6), i una segona crida per a un sol camp és una segona fallada.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: La llista.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Checklist' }
                  - type: object
                    required: [task_title]
                    properties:
                      task_title: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [checklists]
      operationId: updateChecklist
      summary: Modificar una llista
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                show_completed_inline:
                  type: boolean
                  description: Completats en línia (ratllats al seu lloc) o en una secció al final.
                subtask_id: { type: [string, 'null'] }
                position: { type: string }
      responses:
        '200':
          description: Modificada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Checklist' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [checklists]
      operationId: deleteChecklist
      summary: Esborrar una llista
      description: "Els ítems cauen amb ella: no existeixen fora d'una llista (P1)."
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /checklist-items/{id}:
    patch:
      tags: [checklists]
      operationId: updateChecklistItem
      summary: Marcar o desmarcar un ítem
      description: |
        **Marcar-lo pot disparar la cascada amunt** (docs/01 §4): quan l'últim ítem d'una
        llista passa a fet, en la mateixa transacció es marca la subtasca ancorada; i si
        totes les llistes i subtasques d'una tasca estan fetes, la tasca passa a `done`.

        Es registra amb `verb='cascade_complete'` perquè es distingeixi d'un gest directe.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemInput'
      responses:
        '200':
          description: Modificat, amb el que la cascada hagi tocat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItemResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [checklists]
      operationId: deleteChecklistItem
      summary: Esborrar un ítem
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /checklists/{id}/pin:
    post:
      tags: [checklists]
      operationId: pinChecklist
      summary: Pinejar una llista
      description: |
        El pinejat és **per usuari** (docs/01 §4): el rail de llistes pinejades és de
        cada persona, no de la casa.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Pinejada.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [checklists]
      operationId: unpinChecklist
      summary: Despinejar una llista
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Despinejada.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /tokens:
    get:
      tags: [tokens]
      operationId: listApiTokens
      summary: Els tokens d'API de qui pregunta
      description: |
        Es llisten amb el **prefix** i l'últim ús, mai el token sencer: només se'n guarda
        el hash (docs/05 §2). Si l'usuari el perd, ha de crear-ne un de nou.
      responses:
        '200':
          description: Els tokens.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ApiTokenSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [tokens]
      operationId: createApiToken
      summary: Crear un token d'API
      description: |
        **El token sencer es retorna UN SOL COP.** No es pot recuperar del hash, i cal
        dir-ho clarament a qui el crea.

        Les capacitats i els àmbits van al registre del token, **no** a scopes d'OAuth
        (regla 9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, capabilities]
              properties:
                name: { type: string }
                capabilities:
                  type: array
                  items: { type: string }
                scope_ids:
                  type: array
                  items: { type: string }
                  description: Buit vol dir tots els àmbits del propietari.
                expires_at: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Creat. Porta el token en clar, i és l'única vegada.
          content:
            application/json:
              schema:
                type: object
                required: [token, summary]
                properties:
                  token:
                    type: string
                    description: El token sencer. No es torna a poder llegir mai més.
                  summary: { $ref: '#/components/schemas/ApiTokenSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tokens/{id}:
    delete:
      tags: [tokens]
      operationId: revokeApiToken
      summary: Revocar un token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Revocat.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /shares:
    get:
      tags: [shares]
      operationId: listShares
      summary: Els enllaços públics de qui pregunta
      description: |
        Es llisten amb la configuració i les visites, **mai amb el token**: només se'n
        guarda l'HMAC (docs/10 §3). Si l'usuari el perd, ha de crear-ne un de nou.
      responses:
        '200':
          description: Els enllaços.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ShareSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [shares]
      operationId: createShare
      summary: Crear un enllaç públic
      description: |
        Una **tasca amb les seves llistes**, o una **llista sola**. No es comparteixen
        projectes ni àmbits sencers (docs/10 §1).

        **No hi ha permís d'edició** (D10): un convidat marca ítems i comenta.

        L'URL sencer es retorna **un sol cop**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id: { type: string }
                checklist_id: { type: string }
                permission:
                  type: string
                  enum: [view, check, comment]
                  default: view
                password: { type: [string, 'null'] }
                require_name: { type: boolean, default: false }
                expires_at: { type: [string, 'null'], format: date-time }
                max_views: { type: [integer, 'null'] }
      responses:
        '201':
          description: Creat. Porta l'URL, i és l'única vegada.
          content:
            application/json:
              schema:
                type: object
                required: [url, token, share]
                properties:
                  url: { type: string }
                  token: { type: string }
                  share: { $ref: '#/components/schemas/ShareSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /shares/{id}:
    delete:
      tags: [shares]
      operationId: revokeShare
      summary: Revocar un enllaç
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Revocat.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags: [scopes]
      operationId: getShare
      summary: Un enllaç compartit
      description: 'El token NO hi surt: no es pot recuperar del seu HMAC (docs/10 §6).'
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: L'enllaç.
          content: { application/json: { schema: { $ref: '#/components/schemas/ShareSummary' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [scopes]
      operationId: updateShare
      summary: Reconfigurar un enllaç
      description: |
        El token NO es regenera mai des d'aquí: si canviar el permís canviés l'enllaç, tot
        el que ja s'hagi enviat deixaria de funcionar sense que ningú ho hagi demanat.

        Canviar la contrasenya desbloqueja l'enllaç: els cinc intents fallits eren contra
        l'antiga.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permission: { type: string, enum: [view, check, comment] }
                expires_at: { type: [string, 'null'], format: date-time }
                max_views: { type: [integer, 'null'] }
                require_name: { type: boolean }
                password:
                  type: [string, 'null']
                  description: '`null` la treu; una cadena la canvia; absent no la toca.'
      responses:
        '200':
          description: Reconfigurat.
          content: { application/json: { schema: { $ref: '#/components/schemas/ShareSummary' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Està revocat i no es pot tornar a obrir.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /push/subscriptions:
    post:
      tags: [notifications]
      operationId: subscribePush
      summary: Registrar una subscripció de push
      description: |
        **La mateixa ruta per a Web Push i per a UnifiedPush**: comparteixen RFC i
        xifratge (docs/11 §1). El mateix `endpoint` actualitza la fila en comptes de
        crear-ne una de nova.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, p256dh, auth, platform]
              properties:
                endpoint: { type: string }
                p256dh: { type: string }
                auth: { type: string }
                platform: { type: string, enum: [web, android] }
      responses:
        '201':
          description: Registrada.
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags: [notifications]
      operationId: unsubscribePush
      summary: Treure una subscripció
      parameters:
        - name: endpoint
          in: query
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Treta.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /push/public-key:
    get:
      tags: [notifications]
      operationId: getVapidPublicKey
      summary: La clau pública VAPID de la instància
      description: |
        És estable per sempre: es genera un sol cop i **no hi ha rotació** (docs/11 §2).
      responses:
        '200':
          description: La clau.
          content:
            application/json:
              schema:
                type: object
                required: [public_key]
                properties:
                  public_key: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /tasks/{id}/ai-mode:
    post:
      tags: [tasks]
      operationId: setAiMode
      summary: Canviar el mode d'IA d'una tasca
      description: |
        Els tres modes de docs/09 §2. `manual` és el per defecte i no es pinta res a la
        targeta; `assisted` pot llegir, comentar i preparar però **no completar**;
        `delegated` la pot executar sencera.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ai_mode]
              properties:
                ai_mode:
                  type: string
                  enum: [manual, assisted, delegated]
      responses:
        '200':
          description: El mode nou.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/activity:
    get:
      tags: [tasks]
      operationId: listActivity
      summary: L'historial d'una tasca
      description: |
        Els actors barrejats —humans, IA i externs— amb el valor anterior i el nou de
        cada camp (docs/09 §7).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: actor
          in: query
          required: false
          schema: { type: string, enum: [all, ai, human] }
      responses:
        '200':
          description: L'historial.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityEntry' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /pinned-checklists:
    get:
      tags: [checklists]
      operationId: listPinnedChecklists
      summary: Les llistes pinejades de qui pregunta
      responses:
        '200':
          description: |
            Llistes pinejades, amb el seu progrés i **el títol de la tasca que les conté**.

            El menú de la xinxeta ensenya "Tasca · Llista": dues llistes que es diguin
            "Encàrrecs" en tasques diferents són indistingibles pel nom, i el menú existeix
            precisament per saltar a la que toca.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Checklist'
                    - type: object
                      required: [task_title]
                      properties:
                        task_title: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /sync:
    get:
      tags: [sync]
      operationId: pullSync
      summary: Delta des d'un cursor
      description: |
        Ordenat per `seq` ascendent, sempre. Filtrat pel principal: només arriba el dels
        àmbits que el token pot veure.

        Un `upsert` porta l'entitat SENCERA, no un diff: és més trànsit i molta menys
        complexitat, i les entitats de Fem-ho són petites. Un `delete` només porta
        l'identificador.

        **Sense cursor és una sincronització completa.**
      parameters:
        - name: cursor
          in: query
          description: Cadena OPACA. El client no l'ha d'interpretar mai.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 500 }
      responses:
        '200':
          description: El delta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            El cursor és més vell que la retenció de tombstones i el delta seria
            incomplet. El client buida la base local i torna a començar sense cursor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /sync/batch:
    post:
      tags: [sync]
      operationId: pushSync
      summary: Buidat de la cua de sortida
      description: |
        **Cada operació es resol per separat**: una que falli no ha de tombar el lot.

        `op_id` és la clau d'idempotència. Reenviar un lot després d'una caiguda no
        duplica res.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatch'
      responses:
        '200':
          description: Un resultat per operació, en el mateix ordre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResults'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /scopes/{id}:
    get:
      tags: [scopes]
      operationId: getScope
      summary: Un àmbit
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: L'àmbit.
          content: { application/json: { schema: { $ref: '#/components/schemas/Scope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [scopes]
      operationId: updateScope
      summary: Modificar un àmbit
      description: |
        `kind` NO es pot canviar. Passar d'individual a col·lectiu deixaria totes les
        tasques assignades al propietari per la regla d'assignació automàtica (docs/01
        §4) sense que ningú ho hagi demanat.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScopePatch' } } }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Scope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [scopes]
      operationId: deleteScope
      summary: Esborrar un àmbit
      description: |
        Es nega amb `409` si encara té tasques o projectes, i diu quants: la cascada
        aquí seria irreversible des de la interfície.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Encara té coses a dins.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /scopes/{id}/members:
    get:
      tags: [scopes]
      operationId: listMembers
      summary: Els membres d'un àmbit
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Els membres.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Member' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [scopes]
      operationId: addMember
      summary: Afegir un membre
      description: |
        P3: un membre és **o bé** un usuari **o bé** una subscripció de calendari de
        només lectura. Mai totes dues coses ni cap.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemberInput' } } }
      responses:
        '201':
          description: Afegit.
          content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Forma de membre invàlida, o l'àmbit no és col·lectiu.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /scopes/{id}/invites:
    get:
      operationId: listScopeInvites
      summary: Els convits oberts d'un àmbit
      tags: [Àmbits]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Convits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScopeInvite' }
    post:
      operationId: createScopeInvite
      summary: Convidar algú a un àmbit
      description: >-
        Demana la capacitat `scopes:share`, separada de `scopes:write`: regalar un àmbit
        a un desconegut no és el mateix poder que reanomenar-lo. **El token sencer surt
        una sola vegada** i no es pot recuperar del hash.
      tags: [Àmbits]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [collaborator, viewer] }
                max_uses: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Convit emès
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeInviteCreated' }

  /scopes/{id}/invites/{grantId}:
    delete:
      operationId: revokeScopeInvite
      summary: Revocar un convit
      tags: [Àmbits]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: grantId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revocat }

  /join/{token}:
    get:
      operationId: peekScopeInvite
      summary: Mirar un convit sense acceptar-lo
      description: >-
        Perquè la pantalla pugui dir de qui és i a quin àmbit convida abans d'acceptar.
        Un token inventat, un de caducat i un de revocat responen **igual** (docs/10 §4).
      tags: [Àmbits]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: El convit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeInvitePreview' }
        '404':
          description: No és vàlid
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      operationId: redeemScopeInvite
      summary: Acceptar un convit
      description: >-
        Demana sessió: un convit d'àmbit no és un enllaç anònim —això són els `shares`—
        sinó una relació entre dues persones amb compte. És idempotent per a qui ja hi és.
      tags: [Àmbits]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Dins
          content:
            application/json:
              schema:
                type: object
                required: [scope_id, scope_name, role]
                properties:
                  scope_id: { type: string }
                  scope_name: { type: string }
                  role: { type: string }

  /scopes/{id}/members/me:
    delete:
      operationId: leaveScope
      summary: Sortir d'un àmbit un mateix
      description: >-
        Un membre es pot treure a si mateix. El propietari no: deixaria l'àmbit orfe i
        ha d'esborrar-lo o traspassar-lo. El que ha creat es conserva; les seves
        assignacions marxen.
      tags: [Àmbits]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Fora }
        '403':
          description: El propietari no pot sortir del seu propi àmbit
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /scopes/{id}/members/{memberId}:
    patch:
      tags: [scopes]
      operationId: updateMember
      summary: Canviar el rol d'un membre
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, collaborator, viewer] }
      responses:
        '200':
          description: Canviat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Es quedaria sense cap propietari.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    delete:
      tags: [scopes]
      operationId: removeMember
      summary: Treure un membre
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Tret. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Es quedaria sense cap propietari.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /projects/{id}:
    get:
      tags: [scopes]
      operationId: getProject
      summary: Un projecte
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: El projecte.
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [scopes]
      operationId: updateProject
      summary: Modificar o arxivar un projecte
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPatch' } } }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [scopes]
      operationId: deleteProject
      summary: Esborrar un projecte
      description: |
        Les tasques NO cauen amb ell: tornen a l'espai general de l'àmbit, que és el
        filtre `project_id IS NULL` i no una fila (docs/01 §4).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Esborrat, amb quantes tasques han passat a l'espai general.
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /labels:
    get:
      tags: [tasks]
      operationId: listLabels
      summary: Les etiquetes visibles
      parameters:
        - { name: scope_id, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Les etiquetes.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Label' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [tasks]
      operationId: createLabel
      summary: Crear una etiqueta
      description: |
        Una etiqueta pertany a un àmbit: "Urgent" a Feina i "Urgent" a Casa són coses
        diferents, i la clau única `(scope_id, name)` ho imposa.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LabelInput' } } }
      responses:
        '201':
          description: Creada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Label' } } }
        '200':
          description: Ja existia amb aquest nom en aquest àmbit.
          content: { application/json: { schema: { $ref: '#/components/schemas/Label' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Falta l'àmbit o el nom.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /labels/{id}:
    delete:
      tags: [tasks]
      operationId: deleteLabel
      summary: Esborrar una etiqueta
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: Una tasca
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: La tasca.
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Modificar una tasca
      description: |
        Només els camps que es donin. `null` vol dir "buida'l" i absent vol dir "no el
        toquis": sense la distinció, buidar una data seria impossible des d'un client
        que envia només el que ha canviat.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskPatch' } } }
      responses:
        '200':
          description: Modificada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Esborrar una tasca
      description: |
        Esborrat suau. Les subtasques i les llistes cauen amb ella —no existeixen fora
        d'una tasca—, a diferència del que passa en esborrar un projecte.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/assignees/{userId}:
    post:
      tags: [tasks]
      operationId: addAssignee
      summary: Assignar una persona
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Assignada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: No és membre de l'àmbit col·lectiu.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    delete:
      tags: [tasks]
      operationId: removeAssignee
      summary: Desassignar una persona
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Desassignada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/{id}/labels/{labelId}:
    post:
      tags: [tasks]
      operationId: addTaskLabel
      summary: Posar una etiqueta a una tasca
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: labelId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Posada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: L'etiqueta és d'un altre àmbit.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    delete:
      tags: [tasks]
      operationId: removeTaskLabel
      summary: Treure una etiqueta d'una tasca
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: labelId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Treta. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /tasks/{id}/subtasks:
    get:
      tags: [tasks]
      operationId: listSubtasks
      summary: Les subtasques d'una tasca
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Les subtasques.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Subtask' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tasks]
      operationId: createSubtask
      summary: Crear una subtasca
      description: |
        Una subtasca NO és una tasca: no té àmbit propi, ni estat de kanban, ni data, ni
        assignat. Té títol i fet/no fet, i pot ancorar una llista senzilla.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubtaskInput' } } }
      responses:
        '201':
          description: Creada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Subtask' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Falta el títol.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /subtasks/{id}:
    patch:
      tags: [tasks]
      operationId: updateSubtask
      summary: Modificar una subtasca
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubtaskPatch' } } }
      responses:
        '200':
          description: Modificada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Subtask' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      operationId: deleteSubtask
      summary: Esborrar una subtasca
      description: |
        Les llistes ancorades es desancoren, no cauen: una llista de la compra segueix
        sent la llista de la compra quan la subtasca desapareix.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/comments:
    get:
      tags: [tasks]
      operationId: listComments
      summary: Els comentaris d'una tasca
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Els comentaris.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [tasks]
      operationId: addComment
      summary: Comentar una tasca
      description: |
        És la via principal perquè un agent reporti (docs/09 §6), i per això surt a
        l'historial com qualsevol altre gest.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        '201':
          description: Comentat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /inbox:
    get:
      tags: [tasks]
      operationId: getInbox
      summary: L'Inbox d'un dia
      description: |
        La MATEIXA font de dades per a la columna del kanban i per al rail del calendari
        (P4). Sense `date`, el dia és avui al fus de qui pregunta, no al del servidor.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: include_overdue, in: query, required: false, schema: { type: boolean } }
        - { name: scope_ids, in: query, required: false, schema: { type: string } }
        - name: include_hidden
          in: query
          required: false
          schema: { type: boolean }
          description: |
            Amb `true`, la bústia porta **també el que no és visible**, cada ítem amb el seu
            `in_inbox`.

            És el que fa que la columna del kanban i el rail del calendari segueixin sent el
            mateix component amb la mateixa font de dades (P4): el que canvia és la lent. El
            tauler ensenya el que has decidit que és feina; el calendari ho ensenya tot,
            difuminat, perquè és des d'allà que decideixes.
        - name: mailbox
          in: query
          required: false
          schema: { type: string, enum: [own, shared, all] }
          description: |
            De quin calaix. **Es composa amb `scope_ids`, no el substitueix**: és un
            commutador de calaix, no un filtre, i els xips d'àmbit de dalt segueixen
            valent.

            «Propi» són els àmbits individuals i «compartit» els col·lectius. Surt del
            tipus de l'àmbit i no de qui té la tasca assignada: a un àmbit individual tot
            està assignat al propietari per la regla d'autoassignació, i a un de compartit
            una tasca sense assignar no cauria a cap dels dos calaixos.

            Sense el paràmetre mana `user_settings.inbox_origin`.
      responses:
        '200':
          description: L'Inbox.
          content: { application/json: { schema: { $ref: '#/components/schemas/Inbox' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /updates:
    get:
      tags: [instance]
      operationId: getUpdateStatus
      summary: Si hi ha una versió més nova
      description: |
        **La consulta la fa el servidor, no el navegador.** És el mateix criteri que
        governa Gravatar: si ho fes cada pestanya, GitHub veuria la IP de cada persona de
        la casa cada vegada que algú obre Ajustos. La resposta es recorda sis hores.

        **Encesa per defecte**, a diferència de Gravatar, i la diferència importa: allà
        s'envia el hash del correu de cadascú i aquí una petició anònima a un llistat
        públic, sense cap dada de ningú. `FEMHO_UPDATE_CHECK=false` l'apaga.

        **Va autenticada i `/info` segueix sense dir-ho.** `/info` és públic i ja diu quina
        versió corre, que no es pot evitar; el que no cal és que qualsevol que hi passi
        sàpiga a més que aquesta instància va endarrerida.
      responses:
        '200':
          description: L'estat de la versió.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /inbox/events:
    post:
      tags: [tasks]
      operationId: setEventInboxVisibility
      summary: Treure o tornar a posar un esdeveniment a la teva bústia
      description: |
        **La marca és teva i de ningú més.** L'interruptor per font és del calendari i
        val per a tot l'àmbit —"aquest RSS inunda" és un judici sobre la font—, però
        "aquesta cita concreta no és feina meva" és personal.

        `visible: null` **treu la marca** i torna al defecte, que no és el mateix que
        `false`. Amb `false` dius "aquest no, encara que el calendari digui que sí"; amb
        `null` dius "oblida que en vaig dir res". Sense les dues coses no hi hauria manera
        de desdir-se'n.

        Amb `recurrence_id` es marca **una ocurrència**; sense, **tota la sèrie**. La
        d'ocurrència mana sobre la de sèrie, que és el que deixa amagar totes les reunions
        i recuperar-ne una.

        **L'uid va al cos i no al camí** perquè el d'un ítem d'RSS és
        `"<calendar_id>-<item_id>"` i l'`item_id` pot ser una URL sencera.

        Demana `events:read` i no `events:write`: no toca l'esdeveniment, escriu una
        preferència sobre una cosa que ja pots llegir. Amb `events:write`, un calendari
        subscrit de només lectura no es podria silenciar mai — i és el cas que més ho
        necessita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calendar_id, uid]
              properties:
                calendar_id: { type: string, format: uuid }
                uid: { type: string }
                recurrence_id: { type: [string, 'null'] }
                visible:
                  type: [boolean, 'null']
                  description: '`null` treu la marca i torna al defecte.'
      responses:
        '200':
          description: La marca, i si amb ella l'esdeveniment queda a la bústia.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [visible, in_inbox]
                properties:
                  visible: { type: [boolean, 'null'] }
                  in_inbox:
                    type: boolean
                    description: |
                      El resultat de la resolució **sencera**, no només el que s'ha desat:
                      hi entren també l'ajust del calendari, el defecte de la mena de font
                      i si ja n'hi ha una tasca viva. El client no ho ha de recalcular mai,
                      o hi hauria dues implementacions de la mateixa regla.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: |
            El calendari no s'ha compartit amb tu. **403 i no 404**: un 404 diria si
            aquell `uid` existeix, que és informació d'un calendari que no et pertoca.
        '404': { description: No hi ha cap esdeveniment amb aquell uid en aquell calendari. }

  /dashboard:
    get:
      tags: [tasks]
      operationId: getDashboard
      summary: El dashboard global
      description: |
        Ignora la selecció d'àmbits i de projecte: ho ensenya tot (docs/02 §8). Per això
        no accepta cap filtre d'àmbit.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: El dashboard.
          content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /search:
    get:
      tags: [tasks]
      operationId: search
      summary: Cercar tasques
      description: |
        La consulta es normalitza amb la MATEIXA funció que va generar `search_text`
        (docs/01 §11). Dues implementacions divergirien justament en les paraules per a
        les quals la normalització existeix: "col·legi", "Barça", "l'aigua".
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: scope_id, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Els resultats.
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskPage' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /parse:
    post:
      tags: [tasks]
      operationId: parseQuickAdd
      summary: Analitzar una cadena d'afegida ràpida
      description: |
        Per a clients que no poden portar el parser. Els que sí, el porten: el camp
        d'afegida ha de pintar els xips mentre s'escriu i una petició per tecla no és
        una opció (D12).

        A la v1, només sigils. El parseig de dates en català arriba a la v1.1 sense
        canviar la forma d'aquest endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                active_scope_ids: { type: string }
      responses:
        '200':
          description: El resultat del parseig.
          content: { application/json: { schema: { $ref: '#/components/schemas/QuickAddResult' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /calendars/{id}:
    patch:
      tags: [events]
      operationId: updateCalendar
      summary: Modificar un calendari
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarPatch' } } }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [events]
      operationId: deleteCalendar
      summary: Esborrar un calendari
      description: |
        Es nega amb `409` si és local i encara té esdeveniments. Una subscripció sí que
        se'n va amb el que hagi portat: el que hi ha a dins no l'ha escrit ningú d'aquí.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Encara té esdeveniments.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Canviar la contrasenya
      description: |
        Demana l'actual encara que hi hagi sessió: una sessió oberta en un ordinador
        compartit no és prova d'identitat per canviar la credencial que obre totes les
        altres. I revoca la resta de sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        '200':
          description: Canviada, amb quantes sessions s'han revocat.
          content:
            application/json:
              schema:
                type: object
                required: [revoked_sessions]
                properties:
                  revoked_sessions: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: La contrasenya actual no és correcta.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /auth/settings:
    get:
      tags: [auth]
      operationId: getSettings
      summary: Perfil i preferències
      responses:
        '200':
          description: El perfil i les preferències.
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingsBundle' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [auth]
      operationId: updateSettings
      summary: Canviar les preferències
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } }
      responses:
        '200':
          description: Canviades.
          content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /ai/agents:
    get:
      tags: [tasks]
      operationId: listAgents
      summary: Els agents que actuen en nom de qui pregunta
      responses:
        '200':
          description: Els agents.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Agent' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [tasks]
      operationId: createAgent
      summary: Crear un agent
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentInput' } } }
      responses:
        '201':
          description: Creat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /ai/agents/{id}:
    get:
      tags: [tasks]
      operationId: getAgent
      summary: Un agent
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: L'agent.
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      operationId: updateAgent
      summary: Modificar un agent
      description: Desactivar-lo allibera les seves reserves.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentPatch' } } }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      operationId: deleteAgent
      summary: Esborrar un agent
      description: |
        Les tasques que hi tenien delegació es queden, amb `delegate_agent_id` a null i
        el mode d'IA a `manual`: la feina és de la persona, no de l'agent (D5).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Esborrat, amb quantes tasques s'han desdelegat.
          content:
            application/json:
              schema:
                type: object
                required: [released]
                properties:
                  released: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ai/next-task:
    get:
      tags: [tasks]
      operationId: nextTask
      summary: La següent tasca disponible, ja reservada
      description: |
        `task` a null vol dir "ara no hi ha res a fer", que és una resposta correcta: un
        404 faria que un agent que consulta cada minut ho llegís com un error de
        configuració.
      parameters:
        - { name: scope_id, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: La tasca reservada, o null.
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    oneOf:
                      - { $ref: '#/components/schemas/ClaimedTask' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /ai/tasks/{id}/claim:
    post:
      tags: [tasks]
      operationId: claimTask
      summary: Reservar una tasca
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Reservada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Lease' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Ja la té algú altre.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /ai/tasks/{id}/release:
    post:
      tags: [tasks]
      operationId: releaseTask
      summary: Alliberar una reserva
      description: |
        El motiu és obligatori: una reserva alliberada sense dir per què deixa
        l'historial amb un forat que ningú sabrà interpretar (docs/09 §5).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '204': { description: Alliberada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Falta el motiu.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /ai/tasks/{id}/lease:
    get:
      tags: [tasks]
      operationId: getLease
      summary: La reserva d'una tasca, si en té
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: La reserva, o null.
          content:
            application/json:
              schema:
                type: object
                required: [lease]
                properties:
                  lease:
                    oneOf:
                      - { $ref: '#/components/schemas/Lease' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /shares/{id}/accesses:
    get:
      tags: [scopes]
      operationId: listShareAccesses
      summary: Qui ha entrat per un enllaç
      description: |
        L'etiqueta és pseudònima: "Extern · Marta" o "Extern · a4f2". No hi ha cap
        columna d'IP enlloc, i és una decisió de privadesa explícita (D10).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Els accessos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ShareAccess' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    get:
      tags: [instance]
      operationId: listUsers
      summary: Els membres de la llar
      responses:
        '200':
          description: Els usuaris.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/invite:
    post:
      tags: [instance]
      operationId: inviteUser
      summary: Convidar un membre
      description: |
        Crea l'usuari SENSE contrasenya i genera un enllaç d'un sol ús perquè la posi
        ell. L'administrador no arriba a saber-la mai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                role: { type: string, enum: [admin, member] }
      responses:
        '201':
          description: Convidat. `invite_url` es mostra un sol cop.
          content: { application/json: { schema: { $ref: '#/components/schemas/InviteResult' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ja hi ha un compte amb aquest correu.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /admin/users/{id}:
    patch:
      tags: [instance]
      operationId: updateUser
      summary: Modificar un usuari
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string, enum: [admin, member] }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [instance]
      operationId: deleteUser
      summary: Esborrar un usuari
      description: |
        Un administrador NO es pot esborrar a si mateix, ni es pot esborrar l'últim: la
        instància es quedaria sense ningú que la pogués administrar.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: És l'últim administrador, o ets tu mateix.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /admin/wipe:
    post:
      tags: [instance]
      operationId: wipeInstance
      summary: Netejar la instància
      description: |
        La confirmació escrivint el nom exacte de la instància es comprova TAMBÉ aquí:
        una crida directa a l'API no ha de poder-ho fer sense el mateix gest deliberat
        que la interfície demana.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string }
      responses:
        '200':
          description: Netejada, amb el recompte per taula.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: object, additionalProperties: { type: integer } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: La confirmació no coincideix.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /admin/diagnostics:
    get:
      tags: [instance]
      operationId: getDiagnostics
      summary: Paquet de diagnòstic
      description: |
        Amb tots els secrets ocultats (docs/12 §8). El punt és poder-lo enganxar a un
        informe d'error: no hi surt cap valor de variable d'entorn, cap cadena de
        connexió i cap clau, només si hi són.
      responses:
        '200':
          description: El diagnòstic.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /export:
    get:
      tags: [instance]
      operationId: exportAll
      summary: Exportar les dades pròpies
      description: |
        No demana permís a ningú: són les seves dades (docs/10 §9). El que surt és el
        que qui pregunta pot veure, i les entitats esborrades no hi són.
      responses:
        '200':
          description: L'exportació.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /tasks/{id}/attachments:
    get:
      tags: [Tasques]
      operationId: listTaskAttachments
      summary: Els adjunts d'una tasca
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Les metadades. El contingut es demana a part.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tasques]
      operationId: uploadTaskAttachment
      summary: Adjuntar un fitxer a una tasca
      description: >-
        **El cos va cru**, no en multipart: el nom a la consulta i els bytes al cos. Així
        el navegador pot enviar un `File` tal qual, i s'estalvia una dependència per
        analitzar un format que aquí no aporta res —només hi ha un fitxer per petició.
        El tipus s'infereix **del contingut** i no de l'extensió (docs/10 §8).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: filename, in: query, required: true, schema: { type: string } }
        - { name: ai_context, in: query, schema: { type: string, enum: ['true', 'false'] } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Adjuntat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Per damunt de `FEMHO_MAX_UPLOAD_MB`.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /events/{id}/attachments:
    get:
      tags: [Calendari]
      operationId: listEventAttachments
      summary: Els adjunts d'un esdeveniment
      description: >-
        Un esdeveniment no té àmbit propi: el treu del calendari. Si el calendari **no
        s'ha compartit**, respon 404 encara que l'àmbit sí que ho estigui — i el mateix
        val per al nom del fitxer, que ja diu massa.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Les metadades.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No existeix, o el calendari no s'ha compartit.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    post:
      tags: [Calendari]
      operationId: uploadEventAttachment
      summary: Adjuntar un fitxer a un esdeveniment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: filename, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Adjuntat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Per damunt de `FEMHO_MAX_UPLOAD_MB`.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /attachments/{id}/content:
    get:
      tags: [Tasques]
      operationId: downloadAttachment
      summary: Baixar el contingut d'un adjunt
      description: >-
        `docs/10` §8: el fitxer viu **fora de l'arrel web** i només surt d'aquest handler,
        que comprova permisos; no hi ha cap ruta endevinable. Sempre amb
        `Content-Disposition: attachment`, `X-Content-Type-Options: nosniff` i
        `Cache-Control: private, no-store`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Els bytes.
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No existeix, s'ha esborrat, o el calendari no s'ha compartit.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /attachments/{id}:
    delete:
      tags: [Tasques]
      operationId: deleteAttachment
      summary: Esborrar un adjunt
      description: >-
        Esborrat **en suau**: la fila es marca i el fitxer es queda al disc, perquè la
        tombstone encara ha de viatjar pel sync fins als clients.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /federation/redeem:
    post:
      tags: [instance]
      operationId: redeemFederationGrant
      summary: Bescanviar un convit federat
      description: >-
        **No demana sessió, i és l'única ruta d'escriptura que no en demana**: qui la
        crida és un servidor, no una persona, i no té compte aquí. El que la protegeix és
        el token opac —amb el mateix silenci per a un d'inventat, un de caducat i un de
        revocat (`docs/10` §4)— i que el que en surt només val per a un àmbit i per a les
        capacitats de contingut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                instance_name: { type: [string, 'null'] }
                user_name: { type: [string, 'null'] }
      responses:
        '200':
          description: La credencial amb què l'altra instància ens parlarà.
          content:
            application/json:
              schema:
                type: object
                required: [token, scope_id, scope_name, role]
                properties:
                  token:
                    type: string
                    description: Es dona **una sola vegada** i no es pot recuperar.
                  scope_id: { type: string }
                  scope_name: { type: string }
                  role: { type: string }
        '404':
          description: El convit no val. La resposta és idèntica sigui quin sigui el motiu.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /federation/links:
    get:
      tags: [instance]
      operationId: listInstanceLinks
      summary: Els enllaços amb altres instàncies
      responses:
        '200':
          description: Els enllaços. `token_enc` no hi surt mai.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstanceLink' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [instance]
      operationId: createInstanceLink
      summary: Enllaçar-se amb un àmbit d'una altra instància
      description: >-
        Demana `scopes:share`. **Només HTTPS pública**: `http:` es rebutja aquí perquè el
        token viatjaria en clar, i `safeFetch` segueix blocant els rangs privats, o sigui
        que dues cases de la mateixa xarxa local no es poden federar sense exposar-ne una.
        Crea un àmbit espill local on viurà el que arribi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url, token]
              properties:
                base_url: { type: string, format: uri }
                token: { type: string }
                name: { type: string }
      responses:
        '201':
          description: Enllaçat.
          content:
            application/json:
              schema:
                type: object
                required: [link, scope_id]
                properties:
                  link: { $ref: '#/components/schemas/InstanceLink' }
                  scope_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: L'adreça no val, no és HTTPS, o l'altra banda no és Fem-ho.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /federation/links/{id}:
    delete:
      tags: [instance]
      operationId: deleteInstanceLink
      summary: Desenllaçar-se d'una altra instància
      description: >-
        **L'àmbit espill es queda**, com un àmbit local qualsevol: esborrar-lo s'enduria
        tot el que hi hagi passat sense avisar. El que es perd és el token remot, que és
        el que sí que ha de passar.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Desenllaçat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /mail/accounts:
    get:
      tags: [mail]
      operationId: listMailAccounts
      summary: Els comptes de correu de qui pregunta
      description: |
        **Només els seus.** Un compte de correu no es comparteix ni amb l'àmbit ni amb
        l'administrador: `calendars` és per àmbit i això no, i barrejar-ho posaria una
        contrasenya personal en una taula que veu tota la casa.
      responses:
        '200':
          description: Els comptes.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MailAccount' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [mail]
      operationId: createMailAccount
      summary: Donar d'alta un compte
      description: |
        No es connecta a res: desa. Per saber si les credencials van bé hi ha
        `POST /mail/accounts/{id}/test`, que **no desa res**.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MailAccountInput' } } }
      responses:
        '201':
          description: Creat.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailAccount' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Falta el nom, l'amfitrió o l'usuari, o el port no s'admet.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /mail/accounts/{id}:
    patch:
      tags: [mail]
      operationId: updateMailAccount
      summary: Editar un compte
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MailAccountPatch' } } }
      responses:
        '200':
          description: Desat.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailAccount' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [mail]
      operationId: deleteMailAccount
      summary: Treure un compte
      description: |
        Se n'endú les regles. **El que ja va entrar a la bústia es queda**: una tasca feta
        a partir d'un correu és teva, i esborrar el compte no ha de buidar-te el tauler.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Tret. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mail/accounts/{id}/test:
    post:
      tags: [mail]
      operationId: testMailAccount
      summary: Provar la connexió, sense desar res
      description: |
        Es connecta, autentica, llista les carpetes i tanca. **No desa res i no marca cap
        correu**: `docs/11` ja reclama aquest botó per a l'SMTP pel mateix motiu —les
        hores que s'hi perden quan l'única manera de saber si va bé és esperar el següent
        cicle i mirar els registres.

        La contrasenya es pot passar al cos per provar-la **abans** de desar-la. Si no
        s'envia, es fa servir la que hi ha guardada.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/MailTestInput' } } }
      responses:
        '200':
          description: |
            El resultat. **Un `200` no vol dir que hagi anat bé**: vol dir que la prova
            s'ha fet. El que va passar ho diu `ok`, i un error de credencials no és un
            error de l'API.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailTestResult' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mail/rules:
    get:
      tags: [mail]
      operationId: listMailRules
      summary: Les regles dels comptes de qui pregunta
      responses:
        '200':
          description: Les regles.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MailRule' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [mail]
      operationId: createMailRule
      summary: Mapar una carpeta
      description: |
        **La primera vegada que s'activa una regla no s'ingereix res**: el cursor comença
        al final de la carpeta. Sense això, mapar una etiqueta amb dotze anys de correu
        crearia desenes de milers de tasques, i no hi ha desfer massiu.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MailRuleInput' } } }
      responses:
        '201':
          description: Creada.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailRule' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Aquesta carpeta ja té regla en aquest compte.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: Falta la carpeta o l'àmbit, o la plantilla no és vàlida.
          content:
            { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /mail/rules/{id}:
    patch:
      tags: [mail]
      operationId: updateMailRule
      summary: Editar una regla
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MailRulePatch' } } }
      responses:
        '200':
          description: Desada.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailRule' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [mail]
      operationId: deleteMailRule
      summary: Deixar de llegir una carpeta
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Treta. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mail/messages/{id}/convert:
    post:
      tags: [mail]
      operationId: convertMailMessage
      summary: Fer una tasca d'un correu de la bústia
      description: |
        **Idempotent per correu.** Dos clics, un reintent o un rescaneig donen la mateixa
        tasca i no dues: la identitat és la del `Message-ID` (P11), i qui la té ja té la
        tasca.

        Si el fil ja té una tasca viva, això **hi deixa un comentari** en comptes d'obrir-ne
        una segona: si no, respondre un correu partiria el fil en dues coses a fer amb el
        mateix assumpte.

        L'àmbit i el projecte els posa **la regla**, mai el correu. Un remitent pot escriure
        el que vulgui a l'assumpte; el que no pot és triar on va a parar.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: La tasca.
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mail/messages/{id}/dismiss:
    post:
      tags: [mail]
      operationId: dismissMailMessage
      summary: Treure un correu de la bústia
      description: |
        **No l'esborra: deixa de sortir.** La fila es queda al llibre de comptes perquè el
        pròxim rescaneig no el torni a ingerir —esborrar-la el faria tornar la primera
        vegada que el servidor reindexés—, i el correu segueix sencer a la teva bústia de
        veritat: aquí no s'hi ha tocat mai res.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Tret de la bústia. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ai/status:
    get:
      tags: [ai]
      operationId: getAiStatus
      summary: Si aquesta instància té credencials d'un model
      description: |
        **«Configurada» vol dir que hi ha credencials, no que res les faci servir encara.**
        És la frase honesta i va tal qual a la pantalla: `docs/09` diu que Fem-ho no té
        motor d'IA propi, i el que hi ha avui és el terreny (P10 a `docs/14`).

        **La clau no surt mai, ni emmascarada** —una màscara filtra la longitud i el
        prefix—, i de l'URL només l'amfitrió: una URL pot portar un testimoni a la cadena
        de consulta.
      responses:
        '200':
          description: L'estat.
          content: { application/json: { schema: { $ref: '#/components/schemas/AiStatus' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /inbox/mail:
    post:
      tags: [mail]
      operationId: setMailInboxVisibility
      summary: Fer visible o invisible un correu a l'inbox de Tasques
      description: |
        **Bessona de `POST /inbox/events`.** Un correu i una cita són coses diferents, i la
        pregunta «vull veure això a la meva llista?» és exactament la mateixa.

        Amagar-lo **no l'esborra i no el treu del calendari**: hi segueix, difuminat, i és
        des d'allà que el pots tornar a pujar. Al servidor de correu no s'hi toca mai res.

        `visible: null` treu l'excepció i torna a manar la carpeta. Els botons envien `true`
        o `false` explícits: amb `null`, tornar a fer visible un correu d'una carpeta que per
        defecte no ho és no faria res i el botó semblaria espatllat.

        Demana **`mail:read`** i no `mail:write`: el que s'escriu és una preferència teva
        sobre com vols veure la teva bústia, no el correu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id: { type: string }
                visible: { type: [boolean, 'null'] }
      responses:
        '200':
          description: L'estat resultant.
          content:
            application/json:
              schema:
                type: object
                required: [visible, in_inbox]
                properties:
                  visible:
                    type: [boolean, 'null']
                    description: L'excepció desada, o `null` si no n'hi ha cap.
                  in_inbox:
                    type: boolean
                    description: >-
                      El resultat de la cascada sencera, ja recalculat: l'excepció, l'ajust
                      de la carpeta i el defecte de la mena.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mail/messages:
    get:
      tags: [mail]
      operationId: listMailMessages
      summary: Els correus d'un interval, per al calendari
      description: |
        El calendari els pinta **al dia que van arribar**, i per això demana un interval i no
        un dia: la vista mensual en necessita trenta-un de cop.

        **Porta també els que no són visibles**, cadascun amb el seu `in_inbox`: el calendari
        és l'organitzador i hi ha de sortir tot.
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: scope_ids, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Els correus.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InboxMail' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /mail/accounts/{id}/folders:
    get:
      tags: [mail]
      operationId: listMailFolders
      summary: Les carpetes del servidor
      description: |
        Per poder-les **triar** en comptes d'escriure-les. Es connecta amb les credencials
        desades, llista i tanca; **no desa res i no marca cap correu**.

        Va a part de `/test` perquè la pregunta és una altra: allà preguntes si les
        credencials van bé, i aquí quines carpetes hi ha.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: |
            Les carpetes. **Una llista buida amb `error` no és un error de l'API**: vol dir
            que el servidor de correu no ha contestat el que esperàvem.
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders: { type: array, items: { type: string } }
                  delimiter: { type: [string, 'null'] }
                  error: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    AiStatus:
      type: object
      additionalProperties: false
      required: [configured, provider, warnings]
      properties:
        configured:
          type: boolean
          description: >-
            Hi ha credencials. **No vol dir que res les faci servir**: avui no hi ha cap
            camí de codi que truqui a cap model.
        provider: { type: string, description: "`none` si no s'ha configurat res." }
        model: { type: [string, 'null'] }
        base_url_host:
          type: [string, 'null']
          description: >-
            **Només l'amfitrió**, mai l'URL sencera: una URL pot portar un testimoni a la
            cadena de consulta i acabaria a la pantalla i als registres.
        max_input_tokens: { type: integer }
        warnings:
          type: array
          items: { type: string }
          description: Coses que no impedeixen arrencar i val la pena dir.

    MailAccount:
      type: object
      description: >-
        Un compte IMAP. **`secret_enc` no hi és i `password` tampoc**: la contrasenya es
        xifra en repòs i no torna a sortir del servidor en cap forma, ni emmascarada —una
        màscara filtra la longitud i el prefix—.
      required: [id, name, host, port, security, username, enabled, has_secret]
      properties:
        id: { type: string }
        name:
          type: string
          description: "Com l'anomenes tu. Surt a la variable de plantilla {{account}}."

        host: { type: string }
        port: { type: integer, default: 993 }
        security:
          type: string
          enum: [tls, starttls]
          description: >-
            **No hi ha `none`.** Oferir IMAP en clar vol dir que algú el triarà i les
            seves credencials viatjaran nues per la xarxa de casa.
        username: { type: string }
        has_secret:
          type: boolean
          description: >-
            Si hi ha contrasenya desada. És l'única cosa que se'n diu, i serveix perquè
            el formulari pugui dir «desada» sense ensenyar-ne res.
        enabled: { type: boolean, default: true }
        poll_interval:
          type: [integer, 'null']
          description: Segons entre lectures. `null` fa servir el de la instància.
        last_polled_at: { type: [string, 'null'], format: date-time }
        last_error:
          type: [string, 'null']
          description: >-
            Per què va fallar l'última lectura. Va a la fila i no només al registre, pel
            mateix motiu que als calendaris: una font caiguda es veu igual que una buida.
        last_error_at: { type: [string, 'null'], format: date-time }
        consecutive_errors:
          type: integer
          description: >-
            Quantes vegades seguides ha fallat. Mou la retirada exponencial: reintentar
            una contrasenya errònia cada cinc minuts contra un proveïdor gros és com es
            bloqueja un compte.

    MailAccountInput:
      type: object
      required: [name, host, username]
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        security: { type: string, enum: [tls, starttls] }
        username: { type: string }
        password:
          type: string
          writeOnly: true
          description: >-
            Es xifra en repòs i no torna a sortir mai. **Els espais dels dos extrems es
            retallen**: una contrasenya d'aplicació s'enganxa, i el que s'enganxa sovint
            porta un espai o un salt de línia que el camp no dibuixa —i llavors el que
            llegeixes a la pantalla és exactament el que hauries d'haver escrit, i el
            servidor de correu la rebutja igualment.
        poll_interval: { type: [integer, 'null'] }
        enabled: { type: boolean }

    MailAccountPatch:
      type: object
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        security: { type: string, enum: [tls, starttls] }
        username: { type: string }
        password:
          type: string
          writeOnly: true
          description: >-
            Absent vol dir **«no la toquis»**, no «esborra-la»: el formulari no la torna
            a ensenyar mai, i canviar el nom del compte no ha de perdre'n les credencials.
        poll_interval: { type: [integer, 'null'] }
        enabled: { type: boolean }

    MailTestInput:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          description: >-
            Per provar-la **abans** de desar-la. Sense això, l'única manera de saber si
            una contrasenya va bé seria desar-la i esperar.

    MailTestResult:
      type: object
      required: [ok, folders]
      properties:
        ok: { type: boolean }
        error:
          type: [string, 'null']
          description: >-
            Què va passar, en text llegible. **No porta la resposta crua del servidor**:
            pot dur el nom d'usuari i acabaria en una captura de pantalla.
        folders:
          type: array
          items: { type: string }
          description: >-
            Les carpetes que el servidor llista, per poder-les triar en comptes
            d'escriure-les. Buida si la prova ha fallat.
        delimiter:
          type: [string, 'null']
          description: >-
            El separador de camins que ha dit el `LIST`: `.` a Dovecot, `/` a Gmail. És el
            que fa que «la regla més profunda guanya» es pugui calcular.

    MailRule:
      type: object
      required:
        [
          id,
          account_id,
          folder,
          scope_id,
          inbox_visible,
          inbox_visible_default,
          title_template,
          enabled,
        ]
      properties:
        id: { type: string }
        account_id: { type: string }
        folder: { type: string }
        scope_id: { type: string }
        project_id:
          type: [string, 'null']
          description: "`null` vol dir l'espai general de l'àmbit."
        inbox_visible:
          type: [boolean, 'null']
          description: >-
            Si el que arriba per aquesta carpeta surt a l'inbox de la pestanya Tasques.

            **Tri-estat**: `null` vol dir que no s'hi ha dit res i val `inbox_visible_default`.
            Absent en un `PATCH` vol dir «no ho toquis», que no és el mateix — sense el
            `null` no hi hauria manera de desdir-se'n i la carpeta es quedaria clavada al
            valor que se li va posar encara que el defecte canviés.

            El que no és visible **no desapareix**: es veu a la vista de calendari, i des
            d'allà es puja d'un clic.
        inbox_visible_default:
          type: boolean
          description: >-
            El defecte de la mena de font, que per al correu és **no**. Mapar una carpeta és
            dir «vull veure això en algun lloc», no «posa-m'ho tot a la llista de coses per
            fer». Va al contracte perquè **cap client hagi de duplicar aquesta regla**.
        title_template:
          type: string
          description: >-
            Amb `{{subject}}`, `{{from}}`, `{{from_name}}`, `{{from_email}}`, `{{date}}`,
            `{{folder}}` i `{{account}}`. **Una sola passada**: un assumpte que sigui
            literalment `{{from_email}}` no s'expandeix.
        body_to_description: { type: boolean, default: true }
        attachments_to_task: { type: boolean, default: true }
        position: { type: string }
        enabled: { type: boolean, default: true }
        last_seen_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        last_error_at: { type: [string, 'null'], format: date-time }

    MailRuleInput:
      type: object
      required: [account_id, folder, scope_id]
      properties:
        id: { type: string }
        account_id: { type: string }
        folder: { type: string }
        scope_id: { type: string }
        project_id: { type: [string, 'null'] }
        inbox_visible: { type: [boolean, 'null'] }
        title_template: { type: string }
        body_to_description: { type: boolean }
        attachments_to_task: { type: boolean }
        position: { type: string }
        enabled: { type: boolean }

    MailRulePatch:
      type: object
      properties:
        folder: { type: string }
        scope_id: { type: string }
        project_id: { type: [string, 'null'] }
        inbox_visible: { type: [boolean, 'null'] }
        title_template: { type: string }
        body_to_description: { type: boolean }
        attachments_to_task: { type: boolean }
        position: { type: string }
        enabled: { type: boolean }

    InstanceLink:
      type: object
      description: >-
        Un enllaç amb una altra instància. **`token_enc` no hi és**: és un secret xifrat
        amb clau derivada del secret d'aquesta instància i no surt de la base.
      required: [id, scope_id, base_url, created_at, updated_at]
      properties:
        id: { type: string }
        scope_id:
          type: string
          description: L'àmbit espill local on viu el que arriba de fora.
        base_url: { type: string, format: uri }
        name: { type: [string, 'null'] }
        cursor:
          type: [string, 'null']
          description: >-
            El cursor del sync remot. És opac: ve de l'altre servidor i no s'interpreta.
        last_sync_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        last_error_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Attachment:
      type: object
      description: >-
        Les metadades d'un adjunt. **`storage_path` no hi és**: és una ruta interna i el
        client demana el contingut per identificador.
      required: [id, filename, mime_type, size_bytes, source, created_at, updated_at, version]
      properties:
        id: { type: string }
        task_id: { type: [string, 'null'] }
        event_id: { type: [string, 'null'] }
        scope_id: { type: [string, 'null'] }
        filename: { type: string }
        mime_type:
          type: string
          description: Inferit del contingut, no de l'extensió. Mai `text/html`.
        size_bytes: { type: integer }
        source: { type: string, enum: [upload, ical_attach] }
        external_url:
          type: [string, 'null']
          description: >-
            Per a un `ATTACH` d'iCal que és un enllaç i no bytes: no es baixa mai per
            iniciativa pròpia, que seria seguir una URL de tercers des del servidor.
        is_ai_context: { type: boolean }
        uploaded_by: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    ScopeInvite:
      type: object
      required: [id, role, max_uses, use_count, expires_at, created_at]
      properties:
        id: { type: string }
        role: { type: [string, 'null'] }
        max_uses: { type: integer }
        use_count: { type: integer }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    ScopeInviteCreated:
      type: object
      required: [id, role, expires_at, invite_url]
      properties:
        id: { type: string }
        role: { type: [string, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        invite_url:
          type: string
          description: |
            **Surt una sola vegada.** No es pot recuperar del hash; si es perd, cal
            emetre'n un de nou. Cal dir-ho a qui el crea (docs/10 §6).

    ScopeInvitePreview:
      type: object
      required: [kind, scope_name, role, invited_by]
      properties:
        kind: { type: string }
        scope_name: { type: string }
        role: { type: string }
        invited_by: { type: string }

    ScopePatch:
      type: object
      description: |
        Només els camps donats. `kind` sí que hi és: cap a col·lectiu sempre, i cap a
        individual només si no queda cap altre membre (409 amb qui queda).
      properties:
        kind: { type: string, enum: [individual, collective] }
        name: { type: string }
        color: { type: string }
        icon: { type: [string, 'null'] }
        ai_instructions: { type: [string, 'null'] }
        ai_description: { type: [string, 'null'] }
        position: { type: string }

    Member:
      type: object
      required: [id, scope_id, user_id, external_calendar_id, role, created_at]
      properties:
        id: { type: string }
        scope_id: { type: string }
        user_id:
          type: [string, 'null']
          description: P3 · o això o `external_calendar_id`, mai totes dues coses.
        external_calendar_id: { type: [string, 'null'] }
        role: { type: string, enum: [owner, collaborator, viewer] }
        created_at: { type: string, format: date-time }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }

    MemberInput:
      type: object
      description: Exactament un de `user_id` o `external_calendar_id`.
      properties:
        user_id: { type: string }
        external_calendar_id: { type: string }
        role: { type: string, enum: [owner, collaborator, viewer] }

    ProjectPatch:
      type: object
      properties:
        name: { type: string }
        ai_instructions: { type: [string, 'null'] }
        ai_description: { type: [string, 'null'] }
        position: { type: string }
        archived:
          type: boolean
          description: Arxivar és posar-hi data; desarxivar és treure-la. No és un esborrat.

    Label:
      type: object
      required: [id, scope_id, name, color, created_at]
      properties:
        id: { type: string }
        scope_id: { type: string }
        name: { type: string }
        color: { type: string, description: 'Nom de token, mai un literal de color.' }
        created_at: { type: string, format: date-time }

    LabelInput:
      type: object
      required: [scope_id, name]
      properties:
        id: { type: string }
        scope_id: { type: string }
        name: { type: string }
        color: { type: string }

    TaskPatch:
      type: object
      description: |
        `null` vol dir "buida'l" i absent vol dir "no el toquis". Per moure-la, `/move`.
      properties:
        title: { type: string }
        description: { type: [string, 'null'] }
        due_date: { type: [string, 'null'], format: date }
        due_time: { type: [string, 'null'] }
        deadline:
          type: [string, 'null']
          format: date-time
          description: |
            Separada del venciment (docs/02 §7): "fes-ho aquest dijous" i "com a molt
            tard el dia 30" són dues coses, i amb un sol camp qui té les dues n'ha de
            triar una.
        project_id:
          type: [string, 'null']
          description: |
            `null` la torna a l'espai general de l'àmbit. **L'àmbit no es pot canviar
            editant**: altres membres, altres etiquetes i l'assignació automàtica dels
            àmbits individuals. Un projecte d'un altre àmbit es rebutja amb `422`.
        rrule:
          type: [string, 'null']
          description: 'RFC 5545. `null` deixa de repetir-se.'
        recurrence_mode:
          type: string
          enum: [schedule, completion]
          description: |
            La distinció que Todoist escriu com a `every` contra `every!`: repetir-se
            cada dimarts contra repetir-se una setmana **després d'haver-la fet**. RRULE
            no sap expressar la segona, i per a tasques domèstiques és la que la gent
            vol; per això és un camp propi (docs/01 §4).
        ai_mode: { type: string, enum: [manual, assisted, delegated] }
        ai_instructions: { type: [string, 'null'] }

    Subtask:
      type: object
      required: [id, task_id, title, done, position, version]
      properties:
        id: { type: string }
        task_id: { type: string }
        title: { type: string }
        done: { type: boolean }
        position: { type: string }
        version: { type: integer }

    SubtaskInput:
      type: object
      required: [title]
      properties:
        id: { type: string }
        title: { type: string }
        position: { type: string }

    SubtaskPatch:
      type: object
      properties:
        title: { type: string }
        done: { type: boolean }
        position: { type: string }

    Comment:
      type: object
      required: [id, task_id, body, created_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        author_id: { type: [string, 'null'] }
        author_name: { type: [string, 'null'] }
        guest_name:
          type: [string, 'null']
          description: Present quan el comentari ve d'un enllaç compartit.
        body: { type: string }
        created_at: { type: string, format: date-time }

    UpdateStatus:
      type: object
      additionalProperties: false
      required: [current, latest, available, url, reason]
      properties:
        current: { type: string, description: La versió que corre aquesta instància. }
        latest:
          type: [string, 'null']
          description: L'última publicada, o nul si no s'ha pogut saber.
        available: { type: boolean }
        url: { type: [string, 'null'] }
        reason:
          type: string
          enum: [ok, disabled, not-github, unreachable]
          description: |
            Per què no se sap res, si no se'n sap.

            **`unreachable` no és `ok`**, i distingir-ho és el punt: una instància sense
            sortida a internet estaria dient "estàs al dia" sempre, i callaria justament el
            dia que hi ha una actualització de seguretat.

            `not-github` vol dir que `FEMHO_SOURCE_URL` no apunta a un repositori de
            GitHub. Qui publiqui una versió modificada —cosa que l'AGPL §13 preveu— no ha
            de rebre avisos de les versions d'un altre.

    InboxEvent:
      type: object
      description: |
        El que arriba d'una font i entra a la bústia d'un dia.

        **No és una tasca i no en té res.** Sense `status`, sense `position`, sense
        assignació: és la forma que pren la regla 7 —un esdeveniment no té mai estat de
        kanban ni s'arrossega entre columnes—, i per això té esquema propi en comptes de
        ser un `Task` amb camps buits. Cap identificador d'aquí pot arribar a
        `POST /tasks/{id}/move`.

        S'identifica per `calendar_id` + `uid` + `recurrence_id`, que és la identitat que
        promet l'origen, i **no per l'`id` de la fila**: el refresc d'una font pot
        reescriure-la o tornar-la a la vida, i la fila no és estable.
      additionalProperties: false
      required:
        [
          calendar_id,
          scope_id,
          uid,
          recurrence_id,
          summary,
          location,
          starts_at,
          ends_at,
          all_day,
          source_kind,
          calendar_name,
          calendar_color,
          in_inbox,
        ]
      properties:
        calendar_id: { type: string, format: uuid }
        scope_id: { type: string, format: uuid }
        uid: { type: string }
        recurrence_id:
          type: [string, 'null']
          description: L'ocurrència concreta. `null` si no forma part de cap sèrie.
        summary: { type: string }
        location: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        all_day: { type: boolean }
        source_kind:
          type: [string, 'null']
          enum: [caldav, ical, rss, null]
          description: De quina mena és la font. `null` si el calendari és d'aquesta casa.
        calendar_name: { type: string }
        calendar_color: { type: [string, 'null'] }
        in_inbox:
          type: boolean
          description: >-
            Si surt a l'inbox de la pestanya Tasques. Amb `false` només arriba si s'ha
            demanat `include_hidden`, i el calendari el pinta difuminat.

    InboxMail:
      type: object
      description: |
        Un correu que ha entrat a la bústia i **encara no és una tasca**.

        Igual que `InboxEvent`, **no és un `Task` i no n'ha de semblar cap**: sense
        `status`, sense `position`, i cap identificador d'aquí pot arribar a
        `POST /tasks/{id}/move`. Un correu a la bústia és una cosa que has de mirar; que
        sigui una cosa a fer ho decideixes tu, o ho decideix la regla.

        S'identifica per l'`id` de la fila **i** per `message_key`, que és la identitat de
        veritat: la del `Message-ID` i mai la de l'UID d'IMAP (P11).
      additionalProperties: false
      required:
        [
          id,
          account_id,
          message_key,
          subject,
          from_name,
          from_address,
          received_at,
          scope_id,
          source_kind,
        ]
      properties:
        id: { type: string }
        account_id: { type: string }
        message_key: { type: string }
        subject: { type: [string, 'null'] }
        from_name: { type: [string, 'null'] }
        from_address: { type: [string, 'null'] }
        received_at:
          type: [string, 'null']
          format: date-time
          description: >-
            La que va posar el servidor que el va rebre, no la del remitent. La del
            remitent es desa però no ordena res: pot mentir.
        scope_id: { type: string, description: On aniria si es convertís. }
        project_id: { type: [string, 'null'] }
        account_name: { type: [string, 'null'] }
        folder: { type: [string, 'null'] }
        has_attachments: { type: boolean, default: false }
        source_kind:
          type: string
          enum: [mail]
          description: >-
            Sempre `mail`. Hi és perquè la targeta dibuixi la icona de provinença amb el
            mateix component que la resta, sense que el client hagi d'endevinar-ho pel
            tipus de l'ítem.
        in_inbox:
          type: boolean
          description: >-
            Si surt a l'inbox de la pestanya Tasques. **El calcula el servidor i el client no
            el recalcula mai**: és el que fa que «difuminat al calendari» i «no és a la meva
            bústia» siguin literalment la mateixa cosa. Amb `false` l'ítem només arriba si
            s'ha demanat `include_hidden`.

    Inbox:
      type: object
      required: [date, dated, overdue, undated, events, mail]
      properties:
        date: { type: string, format: date }
        dated:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        overdue:
          type: array
          description: Buit si no s'han demanat.
          items: { $ref: '#/components/schemas/Task' }
        undated:
          type: array
          description: La secció "SENSE DIA" del rail (docs/02 §5).
          items: { $ref: '#/components/schemas/Task' }
        events:
          type: array
          description: |
            El que arriba de les fonts subscrites aquell dia, ja filtrat: hi són els que
            aquesta persona ha de veure a la bústia i prou.

            **Els calendaris hi entren per defecte i els RSS no.** Un canal actiu pot
            publicar desenes de titulars al dia i la bústia és l'entrada de tot; qui en
            vulgui un l'encén a Ajustos, o n'encén un titular concret des del calendari.
          items: { $ref: '#/components/schemas/InboxEvent' }
        mail:
          type: array
          description: |
            Els correus que han entrat i encara no són tasques.

            **Array a part, com els esdeveniments.** Si compartissin llista amb les
            tasques, un dia algú passaria un correu per on passa una tasca i la distinció
            —la que sosté la regla 7 esmenada— s'evaporaria sense que res fallés.
          items: { $ref: '#/components/schemas/InboxMail' }

    DashboardScope:
      type: object
      required: [scope_id, name, color, pending, overdue]
      properties:
        scope_id: { type: string }
        name: { type: string }
        color: { type: string }
        pending: { type: integer }
        overdue: { type: integer }

    Dashboard:
      type: object
      required: [date, scopes, today, overdue, doing]
      properties:
        date: { type: string, format: date }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/DashboardScope' }
        today:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        overdue:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        doing:
          type: array
          items: { $ref: '#/components/schemas/Task' }

    QuickAddToken:
      type: object
      required: [kind, raw, start, end, id, label]
      properties:
        kind: { type: string, enum: [scope, project, person, aiMode] }
        raw:
          type: string
          description: El text literal que ocupava, sigil inclòs. Tornar-lo a posar desfà el xip.
        start: { type: integer }
        end: { type: integer }
        id: { type: string }
        label: { type: string }

    QuickAddResult:
      type: object
      required: [title, scopeId, projectId, assigneeIds, aiMode, tokens, error]
      properties:
        title: { type: string }
        scopeId: { type: [string, 'null'] }
        projectId: { type: [string, 'null'] }
        assigneeIds:
          type: array
          items: { type: string }
        aiMode: { type: string, enum: [manual, assisted, delegated] }
        tokens:
          type: array
          items: { $ref: '#/components/schemas/QuickAddToken' }
        error:
          type: ['null', string]
          enum: [scope-required, empty-title, null]
          description: |
            `scope-required` quan hi ha més d'un àmbit actiu i no s'ha escrit `#`: llavors
            no es crea res i es demana l'àmbit (docs/02 §4). El nom del camp és el que ja
            fan servir els fixtures compartits amb Kotlin, i no se'n pot inventar un altre
            aquí sense trencar `parser-parity`.

    CalendarInput:
      type: object
      required: [scope_id, name]
      properties:
        id: { type: string }
        scope_id: { type: string }
        project_id: { type: [string, 'null'] }
        name: { type: string }
        color: { type: [string, 'null'] }
        kind:
          type: string
          enum: [events, todos]
          description: |
            D9 · dues col·leccions per contenidor, sempre. RFC 4791 §5.2 prohibeix
            recursos de components mixtos.
        origin: { type: string, enum: [local, subscription] }
        source_kind:
          type: string
          enum: [caldav, ical, rss]
          description: |
            Obligatori a la pràctica si `origin` és `subscription`: sense, es tracta com
            a `ical`, que és la tria segura —un document es baixa sencer i funciona
            igualment contra un CalDAV que el serveixi per `GET`, i a l'inrevés no.
        source_url:
          type: string
          description: Obligatòria si `origin` és `subscription`.
        source_username: { type: string }
        source_secret:
          type: string
          writeOnly: true
          description: |
            La contrasenya de l'origen. **Es xifra en repòs** (docs/07 §9) i no torna mai
            a sortir del servidor: les respostes no la porten en cap forma.
        writable:
          type: boolean
          description: |
            Demana que la font sigui bidireccional. **Només s'atorga amb `caldav`**: a un
            `.ics` o un RSS s'ignora, perquè deixar editar una cosa que no arribarà mai a
            l'origen és pitjor que no deixar-ho.
        refresh_interval: { type: integer }
        strip_alarms: { type: boolean }

    CalendarPatch:
      type: object
      properties:
        name: { type: string }
        color: { type: [string, 'null'] }
        source_url: { type: string }
        source_username: { type: string }
        source_secret:
          type: string
          writeOnly: true
          description: |
            Absent vol dir **"no la toquis"**, no "esborra-la": el formulari no la torna
            a ensenyar mai, i desar el nom d'una font no ha de perdre'n les credencials.
        writable: { type: boolean }
        refresh_interval: { type: [integer, 'null'] }
        strip_alarms: { type: boolean }
        inbox_visible:
          type: [boolean, 'null']
          description: |
            Si la font entra a la bústia. **Absent vol dir "no ho toquis" i `null` vol dir
            "treu l'excepció"**, que no és el mateix: sense el `null` no hi hauria manera
            de desdir-se'n i el calendari es quedaria clavat al valor que se li va posar
            encara que el defecte canviés.

            Canvia el que veu tot l'àmbit, i per això demana el mateix rol que compartir
            el calendari.

    UserSettings:
      type: object
      properties:
        done_cleared_at:
          type: [string, 'null']
          format: date-time
          description: El botó de netejar la columna Fet. No esborra res (P2).
        inbox_position: { type: string, enum: [left, right, below] }
        inbox_show_overdue: { type: boolean }
        event_task_deleted:
          type: string
          enum: [return_to_inbox, hide_from_inbox]
          default: return_to_inbox
          description: |
            Què li passa a la cita quan s'esborra la tasca que en va sortir.

            `return_to_inbox` la torna a la bústia —esborrar es llegeix com a desfer— i
            **no escriu res enlloc**: la cita havia marxat només perquè hi havia una tasca
            viva, i en desaparèixer torna sola. `hide_from_inbox` deixa una marca: "d'això
            ja me n'he ocupat". En tots dos casos segueix al calendari.
        inbox_origin:
          type: string
          enum: [own, shared, all]
          description: El calaix de la bústia. Per usuari, com la resta de preferències.
        collapsed_groups:
          type: array
          items: { type: string }
        hidden_calendar_ids:
          type: array
          items: { type: string }
          description: |
            Fonts del calendari que aquest usuari no vol veure. **S'hi guarda el que
            s'amaga i no el que es veu**: així una font nova surt sola, que és el que ha
            de passar quan algú de la casa n'afegeix una.
        week_start:
          type: string
          enum: [auto, monday, sunday]
          default: auto
          description: |
            Amb quin dia comença la setmana. `auto` segueix l'idioma —dilluns en català
            i castellà, diumenge en anglès— i és el que hi ha per defecte.

            Es pot canviar perquè **el primer dia de la setmana no és només una
            convenció lingüística**: qui treballa el cap de setmana el vol d'una manera
            i qui no, d'una altra, i tots dos poden tenir la mateixa llengua.
        show_calendar_widget: { type: boolean }
        show_overdue_section: { type: boolean }
        quiet_hours_start: { type: [string, 'null'] }
        quiet_hours_end: { type: [string, 'null'] }
        daily_digest_at: { type: [string, 'null'] }
        gravatar:
          type: boolean
          default: true
          description: |
            Deixar que la meva foto surti de Gravatar. **Només compta si la instància ho té
            encès** (`FEMHO_GRAVATAR`); amb la instància apagada no es pregunta res de
            ningú.

            La casella és de cadascú perquè **el correu que es converteix en hash i viatja
            és el seu**, no el de qui administra. I el hash no és cap anonimat: per a una
            adreça que algú ja sospita, comprovar-la és calcular-lo i comparar.

    UserProfile:
      type: object
      required: [id, name, role, kind, timezone, locale, theme, accent]
      properties:
        id: { type: string }
        email: { type: [string, 'null'] }
        name: { type: string }
        role: { type: string, enum: [admin, member] }
        kind: { type: string, enum: [human, ai, caldav_only] }
        timezone: { type: string }
        locale:
          type: string
          enum: [ca, en, es]
          description: |
            L'idioma d'aquesta persona. La primera vegada el client el negocia del
            navegador o del dispositiu i l'escriu aquí; a partir d'aquí el perfil mana
            sobre el dispositiu, que és el que fa que canviar-lo al portàtil també el
            canviï al telèfon.

            **El servidor el fa servir per a les notificacions**, que les pinta el
            sistema operatiu i el client no pot traduir després.
        theme: { type: string, enum: [system, light, dark] }
        accent: { type: string, enum: [default, soft, mono-warm, mono-cool] }
        avatar_color: { type: [string, 'null'] }

    SettingsBundle:
      type: object
      required: [profile, settings]
