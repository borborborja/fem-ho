openapi: 3.1.0

info:
  title: Fem-ho
  version: 0.1.0
  description: |
    Contracte de l'API de Fem-ho. Aquest fitxer és la font de veritat (regla 5
    d'instruccions.md): els tipus de TypeScript i el client de Kotlin es generen des
    d'aquí i cap client escriu tipus a mà. Un endpoint que no hi és no existeix.

    A M1 només hi ha les dues rutes públiques de vida i identitat. La resta arriba a
    la seva fita, seguint docs/05-api-rest.md.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /api/v1
    description: Base de l'API. GET /info i GET /healthz pengen de l'arrel, no d'aquí.

tags:
  - name: instance
    description: Identitat i salut de la instància. Públic i sense autenticar.
  - name: scopes
    description: Àmbits i projectes. Una tasca sempre té àmbit; el projecte és opcional.
  - name: sync
    description: |
      El contracte de sincronització. L'implementen DOS clients —la web i Android— i han
      de fer-ho igual (docs/06).
  - name: checklists
    description: |
      Llistes senzilles. Un ítem només té text i fet/no fet (P1); la riquesa va al
      contenidor, que es pot pinejar i compartir.
  - name: events
    description: |
      Esdeveniments i calendaris. Un esdeveniment NO és una tasca amb hores (D8) i no
      surt mai al kanban.
  - name: tasks
    description: |
      Tasques i el tauler. La columna es diu `status` amb valors anglesos (D2), i
      l'ordre dins d'ella és `position`, un índex fraccional calculat al client (D3).
  - name: auth
    description: |
      Sessions i compte. docs/05 §1. Els tokens de refresc roten: cada refresc n'emet un
      de nou i invalida l'anterior, i reutilitzar-ne un de gastat revoca la família.

paths:
  /info:
    servers:
      - url: /
    get:
      tags: [instance]
      operationId: getInfo
      summary: Identitat de la instància
      description: |
        Públic i sense autenticar. És el que fa servir Android per validar la URL del
        servidor abans de demanar credencials (docs/05 §4), i el que li permet avisar
        si el servidor és més nou que l'app.
      security: []
      responses:
        '200':
          description: La instància respon i s'identifica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'

  /healthz:
    servers:
      - url: /
    get:
      tags: [instance]
      operationId: getHealthz
      summary: El procés és viu
      description: |
        Comprova només que el procés respon. No toca la base de dades: per a això hi ha
        /readyz (docs/12 §8). És el healthcheck del contenidor.
      security: []
      responses:
        '200':
          description: El procés és viu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    servers:
      - url: /
    get:
      tags: [instance]
      operationId: getReadyz
      summary: Base de dades accessible i migracions aplicades
      description: |
        docs/12 §8. A diferència de /healthz, aquesta SÍ que toca la base: diu si la
        instància pot servir peticions de veritat.

        Van separades a propòsit. Si el healthcheck del contenidor depengués de la base,
        una base lenta reiniciaria el contenidor en bucle, que és el pitjor que pot
        passar amb SQLite a mig escriure.
      security: []
      responses:
        '200':
          description: La base respon i l'esquema és al dia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: La base no respon o les migracions no s'han aplicat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Entrar amb correu i contrasenya
      description: |
        Retorna un token d'accés de vida curta i un de refresc de vida llarga.

        **Mai es diu si el correu existeix o no** (docs/02 §2): un correu desconegut i
        una contrasenya errònia donen exactament la mateixa resposta i triguen el
        mateix. Amb 10 intents fallits en 15 minuts comença un bloqueig progressiu
        comptat per correu, no per IP — darrere d'un proxy casolà totes les peticions
        comparteixen IP (docs/05 §7).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credencials correctes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Correu o contrasenya incorrectes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Massa intents. Porta `Retry-After`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotar el token de refresc
      description: |
        Emet un token nou i invalida l'anterior. Si arriba un token ja gastat es revoca
        tota la família de sessions: és senyal de robatori i no se sap quina de les dues
        bandes és la legítima (docs/05 §1).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token rotat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Token no vàlid, caducat, revocat o ja gastat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Tancar la sessió
      responses:
        '204':
          description: Sessió revocada.
        '401':
          description: Cal estar autenticat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuari, capacitats efectives i àmbits
      description: |
        Diu QUÈ pot fer aquesta credencial i A QUINS àmbits arriba. És l'equivalent REST
        de la tool `whoami` d'MCP, i existeix pel mateix motiu: que qui la fa servir
        sàpiga els seus límits abans de trobar-se un 403.
      responses:
        '200':
          description: Qui pregunta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Cal estar autenticat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /scopes:
    get:
      tags: [scopes]
      operationId: listScopes
      summary: Els àmbits que veu qui pregunta
      responses:
        '200':
          description: Àmbits accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [scopes]
      operationId: createScope
      summary: Crear un àmbit
      description: |
        Individual o col·lectiu (brief línia 44). L'`id` el pot posar el client: és un
        UUIDv7 nu (D4) i crear offline no ha de necessitar cap resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeInput'
      responses:
        '201':
          description: Creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scope'
        '200':
          description: Ja existia amb aquest `id`. Idempotència (docs/05 §3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects:
    get:
      tags: [scopes]
      operationId: listProjects
      summary: Projectes, filtrables per àmbit
      parameters:
        - name: scope_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Projectes accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [scopes]
      operationId: createProject
      summary: Crear un projecte dins d'un àmbit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Tasques amb filtres
      parameters:
        - name: scope_id
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Valors múltiples separats per comes.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          description: Cursor opac. El client no l'ha d'interpretar mai.
          schema:
            type: string
      responses:
        '200':
          description: Pàgina de tasques.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [tasks]
      operationId: createTask
      summary: Crear una tasca
      description: |
        **`scope_id` és obligatori.** És la invariant central del producte: pot ser que
        un àmbit tingui una tasca sense projecte, però mai una tasca sense àmbit
        (docs/01 §4). L'`id` i la `position` els pot posar el client (D3, D4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '200':
          description: Ja existia amb aquest `id`. Idempotència.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Falta l'àmbit, o no és vàlid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /tasks/{id}/move:
    post:
      tags: [tasks]
      operationId: moveTask
      summary: Moure una tasca de columna o de posició
      description: |
        Existeix a part de `PATCH` perquè moure és l'operació més freqüent del producte,
        la que més s'ha de fusionar offline, i la que necessita la seva pròpia semàntica
        de conflicte (docs/05 §4).

        S'accepta `position` directament —el camí normal, calculada al client (D3)— o
        `{before_id, after_id}` perquè el servidor la calculi, per a clients simples.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveInput'
      responses:
        '200':
          description: Moguda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/complete:
    post:
      tags: [tasks]
      operationId: completeTask
      summary: Completar una tasca
      description: |
        Aplica la cascada i genera la següent instància si es repeteix (docs/05 §4).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /board:
    get:
      tags: [tasks]
      operationId: getBoard
      summary: Les quatre columnes en una crida
      description: |
        Existeix perquè pintar el tauler amb quatre peticions paral·lelitzades dona
        quatre estats de càrrega i quatre punts de fallada per a una sola pantalla
        (docs/05 §4).
      parameters:
        - name: scope_ids
          in: query
          description: Àmbits actius, separats per comes. Sense això, tots els visibles.
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: El tauler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Esdeveniments en una finestra
      description: |
        **Requereix `from` i `to`**: sense finestra no es poden expandir repeticions
        (docs/05 §4). Una RRULE sense COUNT ni UNTIL és infinita.

        Torna OCURRÈNCIES, no files: una sèrie setmanal dins d'un mes surt quatre
        vegades, cadascuna amb el seu `recurrence_id`.

        **Els esdeveniments no surten mai al kanban** (D8). Aquesta és l'única manera
        de demanar-los.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: scope_ids
          in: query
          description: Àmbits actius, separats per comes.
          schema: { type: string }
      responses:
        '200':
          description: Ocurrències dins de la finestra, ordenades per inici.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOccurrence'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Falta la finestra, o no és vàlida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [events]
      operationId: createEvent
      summary: Crear un esdeveniment
      description: |
        Un esdeveniment **no és una tasca amb hores** (D8): té els seus propis `status`
        —TENTATIVE, CONFIRMED, CANCELLED—, té `transparency`, i un calendari extern
        subscrit només en pot produir d'aquests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '200':
          description: Ja existia amb aquest `id`. Idempotència.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events/{id}:
    patch:
      tags: [events]
      operationId: updateEvent
      summary: Modificar un esdeveniment o una sèrie
      description: |
        `series_mode` resol "aquest esdeveniment, aquest i els següents, o tota la
        sèrie" (docs/05 §4):

        - `single` crea una instància modificada, una fila germana amb el seu
          `RECURRENCE-ID` (D8).
        - `future` **parteix la sèrie**: posa `UNTIL` al mestre i en crea un de nou.
          **No emet mai `RANGE=THISANDFUTURE`.**
        - `all` toca el mestre.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: series_mode
          in: query
          schema:
            type: string
            enum: [single, future, all]
            default: single
        - name: occurrence
          in: query
          description: L'ocurrència afectada, per als modes `single` i `future`.
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Modificat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Falta l'ocurrència per al mode demanat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /calendars:
    get:
      tags: [events]
      operationId: listCalendars
      summary: Els calendaris que veu qui pregunta
      description: |
        Cada àmbit i cada projecte que es publiqui genera **DUES** col·leccions (D9):
        una `events` i una `todos`. RFC 4791 §5.2 prohibeix recursos de components
        mixtos, DAVx⁵ classifica una col·lecció només per
        `supported-calendar-component-set`, i el CalDAV de Google no accepta VTODO.
      responses:
        '200':
          description: Calendaris accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Calendar'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /tasks/{id}/checklists:
    get:
      tags: [checklists]
      operationId: listChecklists
      summary: Les llistes senzilles d'una tasca
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Llistes amb els seus ítems.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Checklist'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [checklists]
      operationId: createChecklist
      summary: Crear una llista dins d'una tasca
      description: |
        Una llista pertany **sempre** a una tasca, i opcionalment s'ancora a una subtasca
        concreta (P1). No és un subprojecte ni una subtasca: són dues taules i un flag de
        presentació.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistInput'
      responses:
        '201':
          description: Creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /checklists/{id}/items:
    post:
      tags: [checklists]
      operationId: createChecklistItem
      summary: Afegir un ítem
      description: |
        Un ítem **només té text i fet/no fet** (P1). Cap data, cap assignat, cap
        niuament. La contenció és deliberada i ve de Things 3: és el que fa que la llista
        no es converteixi en un segon gestor de tasques dins del gestor de tasques.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemInput'
      responses:
        '201':
          description: Afegit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /checklist-items/{id}:
    patch:
      tags: [checklists]
      operationId: updateChecklistItem
      summary: Marcar o desmarcar un ítem
      description: |
        **Marcar-lo pot disparar la cascada amunt** (docs/01 §4): quan l'últim ítem d'una
        llista passa a fet, en la mateixa transacció es marca la subtasca ancorada; i si
        totes les llistes i subtasques d'una tasca estan fetes, la tasca passa a `done`.

        Es registra amb `verb='cascade_complete'` perquè es distingeixi d'un gest directe.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemInput'
      responses:
        '200':
          description: Modificat, amb el que la cascada hagi tocat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItemResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /checklists/{id}/pin:
    post:
      tags: [checklists]
      operationId: pinChecklist
      summary: Pinejar una llista
      description: |
        El pinejat és **per usuari** (docs/01 §4): el rail de llistes pinejades és de
        cada persona, no de la casa.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Pinejada.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [checklists]
      operationId: unpinChecklist
      summary: Despinejar una llista
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Despinejada.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /pinned-checklists:
    get:
      tags: [checklists]
      operationId: listPinnedChecklists
      summary: Les llistes pinejades de qui pregunta
      responses:
        '200':
          description: Llistes pinejades, amb el seu progrés.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Checklist'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /sync:
    get:
      tags: [sync]
      operationId: pullSync
      summary: Delta des d'un cursor
      description: |
        Ordenat per `seq` ascendent, sempre. Filtrat pel principal: només arriba el dels
        àmbits que el token pot veure.

        Un `upsert` porta l'entitat SENCERA, no un diff: és més trànsit i molta menys
        complexitat, i les entitats de Fem-ho són petites. Un `delete` només porta
        l'identificador.

        **Sense cursor és una sincronització completa.**
      parameters:
        - name: cursor
          in: query
          description: Cadena OPACA. El client no l'ha d'interpretar mai.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 500 }
      responses:
        '200':
          description: El delta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            El cursor és més vell que la retenció de tombstones i el delta seria
            incomplet. El client buida la base local i torna a començar sense cursor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /sync/batch:
    post:
      tags: [sync]
      operationId: pushSync
      summary: Buidat de la cua de sortida
      description: |
        **Cada operació es resol per separat**: una que falli no ha de tombar el lot.

        `op_id` és la clau d'idempotència. Reenviar un lot després d'una caiguda no
        duplica res.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatch'
      responses:
        '200':
          description: Un resultat per operació, en el mateix ordre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResults'
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  schemas:
    SyncChange:
      type: object
      additionalProperties: false
      required: [entity, id, op, seq]
      properties:
        entity: { type: string }
        id: { type: string }
        op:
          type: string
          enum: [upsert, delete]
        seq: { type: integer }
        data:
          type: object
          additionalProperties: true
          description: L'entitat SENCERA. Absent als `delete`.

    SyncResponse:
      type: object
      additionalProperties: false
      required: [changes, next_cursor, has_more, server_time]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        next_cursor: { type: string }
        has_more: { type: boolean }
        server_time:
          type: string
          format: date-time
          description: |
            Perquè el client detecti desviació de rellotge. Un rellotge mal posat trenca
            els recordatoris i les comparacions de "avui" (docs/06 §3).

    SyncOperation:
      type: object
      additionalProperties: false
      required: [op_id, entity, op, id]
      properties:
        op_id:
          type: string
          description: Clau d'idempotència. Reenviar el lot no duplica res.
        entity: { type: string }
        op:
          type: string
          enum: [create, update, delete, move]
        id: { type: string }
        base_version:
          type: integer
          description: La versió sobre la qual s'edita.
        data:
          type: object
          additionalProperties: true

    SyncBatch:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'

    SyncBatchResult:
      type: object
      additionalProperties: false
      required: [op_id, status]
      properties:
        op_id: { type: string }
        status:
          type: string
          enum: [ok, conflict, rejected]
          description: Tres resultats i prou (docs/06 §4).
        entity:
          type: object
          additionalProperties: true
        server_entity:
          type: object
          additionalProperties: true
          description: L'estat actual, perquè el client pugui fusionar sense una altra petició.
        error:
          type: object
          additionalProperties: true

    SyncBatchResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncBatchResult'

    Checklist:
      type: object
      additionalProperties: false
      required: [id, task_id, name, pinned, show_completed_inline, position, items, version]
      properties:
        id: { type: string }
        task_id: { type: string }
        subtask_id:
          type: [string, 'null']
          description: Ancoratge opcional a una subtasca concreta (P1).
        name: { type: string }
        pinned:
          type: boolean
          description: Pinejat PER USUARI. El rail és de cada persona.
        show_completed_inline:
          type: boolean
          description: |
            Completats ratllats al seu lloc, o en una secció "Completats" al final,
            plegada amb el recompte (docs/02 §6).
        position: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        version: { type: integer }

    ChecklistInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1 }
        subtask_id: { type: string }
        show_completed_inline: { type: boolean }

    ChecklistItem:
      type: object
      additionalProperties: false
      required: [id, checklist_id, text, done, position]
      properties:
        id: { type: string }
        checklist_id: { type: string }
        text: { type: string }
        done: { type: boolean }
        done_at: { type: [string, 'null'], format: date-time }
        done_by: { type: [string, 'null'] }
        position: { type: string }

    ChecklistItemInput:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        text: { type: string, minLength: 1 }
        done: { type: boolean }
        position: { type: string }

    ChecklistItemResult:
      type: object
      additionalProperties: false
      required: [item, cascade]
      properties:
        item:
          $ref: '#/components/schemas/ChecklistItem'
        cascade:
          type: object
          additionalProperties: false
          required: [checklist_completed, subtask_completed, task_completed]
          description: Què ha tocat la cascada amunt, perquè la interfície ho pugui dir.
          properties:
            checklist_completed: { type: boolean }
            subtask_completed: { type: boolean }
            task_completed: { type: boolean }
            suggest_unpin:
              type: boolean
              description: |
                Cert quan una llista PINEJADA s'ha completat del tot: llavors es pregunta
                si es vol despinejar (P1).

    Calendar:
      type: object
      additionalProperties: false
      required: [id, scope_id, name, kind, origin]
      properties:
        id: { type: string }
        scope_id: { type: string }
        project_id: { type: [string, 'null'] }
        name: { type: string }
        color: { type: [string, 'null'] }
        kind:
          type: string
          enum: [events, todos]
          description: Obligatori i únic per col·lecció (D9).
        origin:
          type: string
          enum: [local, subscription]
          description: Les subscripcions són de només lectura a la capa de repositori.

    Event:
      type: object
      additionalProperties: false
      required: [id, calendar_id, uid, summary, starts_at, all_day, version]
      properties:
        id: { type: string }
        calendar_id: { type: string }
        uid: { type: string, description: UID d'iCalendar. }
        recurrence_id:
          type: [string, 'null']
          description: Nul al mestre. Amb valor, és una instància modificada (D8).
        summary: { type: string }
        description: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        all_day:
          type: boolean
          description: |
            VALUE=DATE és tot el dia i NO té fus. Convertir-lo a mitjanit UTC és l'error
            que fa que els aniversaris apareguin el dia abans a mig món (docs/07 §8).
        timezone: { type: [string, 'null'] }
        status:
          type: string
          enum: [TENTATIVE, CONFIRMED, CANCELLED]
          description: Els de VEVENT. Els de VTODO són uns altres (D8).
        transparency:
          type: string
          enum: [OPAQUE, TRANSPARENT]
          description: Si ocupa temps. VTODO no en té equivalent.
        rrule: { type: [string, 'null'] }
        version: { type: integer }

    EventInput:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        calendar_id: { type: string }
        summary: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        all_day: { type: boolean }
        timezone: { type: string }
        status:
          type: string
          enum: [TENTATIVE, CONFIRMED, CANCELLED]
        transparency:
          type: string
          enum: [OPAQUE, TRANSPARENT]
        rrule: { type: string }

    EventOccurrence:
      type: object
      additionalProperties: false
      required: [event_id, uid, summary, starts_at, ends_at, all_day, scope_id]
      properties:
        event_id: { type: string }
        uid: { type: string }
        recurrence_id:
          type: [string, 'null']
          description: L'inici que li tocaria segons la regla, encara que s'hagi mogut.
        summary: { type: string }
        location: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        all_day: { type: boolean }
        scope_id: { type: string }
        calendar_id: { type: string }
        status:
          type: string
          enum: [TENTATIVE, CONFIRMED, CANCELLED]
        is_override:
          type: boolean
          description: Cert si aquesta ocurrència ve d'una instància modificada.

    Scope:
      type: object
      additionalProperties: false
      required: [id, name, kind, color, position, created_at, updated_at, version]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [individual, collective]
        color:
          type: string
          description: Token CSS o hex. Els tres inicials fan servir la tríada de Plou.
        icon: { type: [string, 'null'] }
        ai_instructions: { type: [string, 'null'] }
        ai_description: { type: [string, 'null'] }
        position: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    ScopeInput:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        id:
          type: string
          description: UUIDv7 nu. El pot posar el client (D4).
        name: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [individual, collective]
          default: individual
        color: { type: string }
        icon: { type: string }
        ai_instructions: { type: string }
        ai_description: { type: string }
        position: { type: string }

    Project:
      type: object
      additionalProperties: false
      required: [id, scope_id, name, position, created_at, updated_at, version]
      properties:
        id: { type: string }
        scope_id: { type: string }
        name: { type: string }
        ai_instructions: { type: [string, 'null'] }
        ai_description: { type: [string, 'null'] }
        position: { type: string }
        archived_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    ProjectInput:
      type: object
      additionalProperties: false
      required: [scope_id, name]
      properties:
        id: { type: string }
        scope_id: { type: string }
        name: { type: string, minLength: 1 }
        ai_instructions: { type: string }
        ai_description: { type: string }
        position: { type: string }

    Task:
      type: object
      additionalProperties: false
      required:
        [id, scope_id, title, status, position, ai_mode, view_mode, created_at, updated_at, version]
      properties:
        id: { type: string }
        scope_id: { type: string }
        project_id: { type: [string, 'null'] }
        title: { type: string }
        description: { type: [string, 'null'] }
        status:
          type: string
          enum: [inbox, todo, doing, done]
          description: La columna. Es diu `status`, no `column` (D2).
        position:
          type: string
          description: Índex fraccional. Ordenat amb collation binària (D3).
        due_date:
          type: [string, 'null']
          description: YYYY-MM-DD, sense fus. Una data de tot el dia no té instant.
        due_time: { type: [string, 'null'] }
        deadline: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        view_mode:
          type: string
          enum: [card, simple]
        ai_mode:
          type: string
          enum: [manual, assisted, delegated]
          description: Delegar no és assignar (D5).
        delegate_agent_id: { type: [string, 'null'] }
        assignee_ids:
          type: array
          items: { type: string }
          description: Persones. El brief demana "persona o persones".
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    TaskInput:
      type: object
      additionalProperties: false
      required: [scope_id, title]
      properties:
        id: { type: string }
        scope_id:
          type: string
          description: Obligatori. Mai una tasca sense àmbit (docs/01 §4).
        project_id: { type: string }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status:
          type: string
          enum: [inbox, todo, doing, done]
          default: inbox
        position: { type: string }
        due_date: { type: string }
        due_time: { type: string }
        assignee_ids:
          type: array
          items: { type: string }

    MoveInput:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [inbox, todo, doing, done]
        position:
          type: string
          description: El camí normal. La calcula el client (D3).
        before_id:
          type: [string, 'null']
          description: Per a clients simples, perquè el servidor calculi la posició.
        after_id:
          type: [string, 'null']

    TaskPage:
      type: object
      additionalProperties: false
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }

    BoardColumn:
      type: object
      additionalProperties: false
      required: [status, groups]
      properties:
        status:
          type: string
          enum: [inbox, todo, doing, done]
        groups:
          type: array
          description: Agrupades per àmbit, com les pinta la interfície (docs/02 §4).
          items:
            $ref: '#/components/schemas/BoardGroup'

    BoardGroup:
      type: object
      additionalProperties: false
      required: [scope_id, tasks]
      properties:
        scope_id: { type: string }
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    Board:
      type: object
      additionalProperties: false
      required: [columns]
      properties:
        columns:
          type: array
          description: Sempre les QUATRE, encara que alguna sigui buida.
          items:
            $ref: '#/components/schemas/BoardColumn'

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, expires_at]
      properties:
        access_token:
          type: string
          description: Vida curta. A la web viatja en galeta HttpOnly; a Android com a Bearer.
        refresh_token:
          type: string
          description: Vida llarga i d'un sol ús. Cada refresc n'emet un de nou.
        expires_at:
          type: string
          format: date-time
          description: Caducitat del token de refresc.

    Me:
      type: object
      additionalProperties: false
      required: [id, name, kind, capabilities, scope_ids]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: [string, 'null']
        kind:
          type: string
          enum: [user, agent, guest]
          description: Quina mena de principal és aquesta credencial.
        role:
          type: string
          enum: [admin, member]
        timezone:
          type: string
          description: Les consultes de "avui" es resolen en el fus de qui mira (docs/01 §8).
        capabilities:
          type: array
          items:
            type: string
          description: Les capacitats EFECTIVES, ja intersecades amb el rol del propietari.
        scope_ids:
          type: [array, 'null']
          items:
            type: string
          description: |
            Els àmbits accessibles, o `null` per a tots els del propietari. Regla 9: això
            surt del registre del token, no de cap scope d'OAuth.
        agent_id:
          type: [string, 'null']
          description: Si la credencial és d'un agent, quin. Delegar no és assignar (D5).

    Info:
      type: object
      additionalProperties: false
      required: [name, version, registration]
      properties:
        name:
          type: string
          description: Nom de la instància, configurable per qui l'allotja.
          examples: ['Fem-ho']
        version:
          type: string
          description: Versió del servidor, en semàntica de versions.
          examples: ['0.1.0']
        registration:
          type: string
          enum: [disabled, invite, open]
          description: |
            Si la instància accepta altes. Surt de FEMHO_REGISTRATION i per defecte és
            `disabled`, que és el correcte per a una instància familiar exposada a
            internet (docs/12 §7).
        setup_required:
          type: boolean
          description: |
            Cert mentre no hi hagi cap administrador. Mentre ho sigui, /setup és
            accessible; un cop creat el primer administrador, es tanca per sempre.

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      additionalProperties: false
      required: [status, database, schema_version]
      properties:
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [sqlite, postgres]
          description: El motor amb què corre la instància (D11).
        schema_version:
          type: string
          description: L'última migració aplicada.
          examples: ['001-initial-schema']

    Problem:
      type: object
      description: |
        Error en application/problem+json (RFC 9457, docs/05 §3). `type` i `title` són
        estables i en anglès per poder-hi programar; `detail` va en l'idioma de
        l'Accept-Language.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ['https://femho.app/errors/scope-forbidden']
        title:
          type: string
          examples: ['Scope not accessible']
        status:
          type: integer
          examples: [403]
        detail:
          type: string
          examples: ["Aquest token només té accés a l'àmbit Feina."]
        instance:
          type: string

  responses:
    Unauthenticated:
      description: Cal autenticar-se.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Sense permís. El cos diu QUINS àmbits veu el token i ON és el que s'ha demanat:
        un 403 mut fa que un agent reintenti en bucle (docs/05 §2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No existeix, o no és visible per a qui pregunta.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: femho_session
      description: Sessió de navegador. Galeta HttpOnly, Secure, SameSite=Lax.
    bearer:
      type: http
      scheme: bearer
      description: |
        Token d'accés (Android) o token d'API `femho_pat_…` (integracions, MCP, IA).
        Les capacitats i els àmbits van al registre del token, no a scopes d'OAuth
        (regla 9).

security:
  - session: []
  - bearer: []
