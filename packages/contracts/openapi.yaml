openapi: 3.1.0

info:
  title: Fem-ho
  version: 0.1.0
  description: |
    Contracte de l'API de Fem-ho. Aquest fitxer és la font de veritat (regla 5
    d'instruccions.md): els tipus de TypeScript i el client de Kotlin es generen des
    d'aquí i cap client escriu tipus a mà. Un endpoint que no hi és no existeix.

    A M1 només hi ha les dues rutes públiques de vida i identitat. La resta arriba a
    la seva fita, seguint docs/05-api-rest.md.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /api/v1
    description: Base de l'API. GET /info i GET /healthz pengen de l'arrel, no d'aquí.

tags:
  - name: instance
    description: Identitat i salut de la instància. Públic i sense autenticar.
  - name: scopes
    description: Àmbits i projectes. Una tasca sempre té àmbit; el projecte és opcional.
  - name: sync
    description: |
      El contracte de sincronització. L'implementen DOS clients —la web i Android— i han
      de fer-ho igual (docs/06).
  - name: checklists
    description: |
      Llistes senzilles. Un ítem només té text i fet/no fet (P1); la riquesa va al
      contenidor, que es pot pinejar i compartir.
  - name: events
    description: |
      Esdeveniments i calendaris. Un esdeveniment NO és una tasca amb hores (D8) i no
      surt mai al kanban.
  - name: tasks
    description: |
      Tasques i el tauler. La columna es diu `status` amb valors anglesos (D2), i
      l'ordre dins d'ella és `position`, un índex fraccional calculat al client (D3).
  - name: auth
    description: |
      Sessions i compte. docs/05 §1. Els tokens de refresc roten: cada refresc n'emet un
      de nou i invalida l'anterior, i reutilitzar-ne un de gastat revoca la família.

paths:
  /info:
    servers:
      - url: /
    get:
      tags: [instance]
      operationId: getInfo
      summary: Identitat de la instància
      description: |
        Públic i sense autenticar. És el que fa servir Android per validar la URL del
        servidor abans de demanar credencials (docs/05 §4), i el que li permet avisar
        si el servidor és més nou que l'app.
      security: []
      responses:
        '200':
          description: La instància respon i s'identifica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'

  /healthz:
    servers:
      - url: /
    get:
      tags: [instance]
      operationId: getHealthz
      summary: El procés és viu
      description: |
        Comprova només que el procés respon. No toca la base de dades: per a això hi ha
        /readyz (docs/12 §8). És el healthcheck del contenidor.
      security: []
      responses:
        '200':
          description: El procés és viu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    servers:
      - url: /
    get:
      tags: [instance]
      operationId: getReadyz
      summary: Base de dades accessible i migracions aplicades
      description: |
        docs/12 §8. A diferència de /healthz, aquesta SÍ que toca la base: diu si la
        instància pot servir peticions de veritat.

        Van separades a propòsit. Si el healthcheck del contenidor depengués de la base,
        una base lenta reiniciaria el contenidor en bucle, que és el pitjor que pot
        passar amb SQLite a mig escriure.
      security: []
      responses:
        '200':
          description: La base respon i l'esquema és al dia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: La base no respon o les migracions no s'han aplicat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Entrar amb correu i contrasenya
      description: |
        Retorna un token d'accés de vida curta i un de refresc de vida llarga.

        **Mai es diu si el correu existeix o no** (docs/02 §2): un correu desconegut i
        una contrasenya errònia donen exactament la mateixa resposta i triguen el
        mateix. Amb 10 intents fallits en 15 minuts comença un bloqueig progressiu
        comptat per correu, no per IP — darrere d'un proxy casolà totes les peticions
        comparteixen IP (docs/05 §7).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credencials correctes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Correu o contrasenya incorrectes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Massa intents. Porta `Retry-After`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotar el token de refresc
      description: |
        Emet un token nou i invalida l'anterior. Si arriba un token ja gastat es revoca
        tota la família de sessions: és senyal de robatori i no se sap quina de les dues
        bandes és la legítima (docs/05 §1).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token rotat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Token no vàlid, caducat, revocat o ja gastat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Tancar la sessió
      responses:
        '204':
          description: Sessió revocada.
        '401':
          description: Cal estar autenticat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuari, capacitats efectives i àmbits
      description: |
        Diu QUÈ pot fer aquesta credencial i A QUINS àmbits arriba. És l'equivalent REST
        de la tool `whoami` d'MCP, i existeix pel mateix motiu: que qui la fa servir
        sàpiga els seus límits abans de trobar-se un 403.
      responses:
        '200':
          description: Qui pregunta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Cal estar autenticat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # CONVENCIÓ DE LLISTES
  #
  # Les llistes **paginades** tornen `{ data, next_cursor, has_more }` (docs/05 §3). Les
  # que no es paginen —àmbits, projectes, calendaris— tornen l'array pelat: un envoltori
  # amb un sol camp que no porta cap cursor només afegeix una indirecció a cada client.
  #
  # `/tokens`, `/shares` i `/activity` fan servir l'envoltori sense paginar. És una
  # inconsistència coneguda i es deixa estar a posta: canviar-los ara trencaria els
  # clients per un guany estètic.
    patch:
      tags: [auth]
      operationId: updateProfile
      summary: Modificar el propi perfil
      description: |
        Aquí es toca NOMÉS el compte propi. El brief és explícit (línia 42): al Perfil no
        s'editen els altres; això és a `/admin/users`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                timezone: { type: string, description: 'Nom IANA. Es valida amb `Intl`.' }
                locale:
                  type: string
                  enum: [ca, en, es]
                theme: { type: string, enum: [system, light, dark] }
                accent: { type: string, enum: [default, soft, mono-warm, mono-cool] }
                avatar_color: { type: [string, 'null'] }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Un valor d'enum o un fus que no existeixen.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /scopes:
    get:
      tags: [scopes]
      operationId: listScopes
      summary: Els àmbits que veu qui pregunta
      responses:
        '200':
          description: Àmbits accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [scopes]
      operationId: createScope
      summary: Crear un àmbit
      description: |
        Individual o col·lectiu (brief línia 44). L'`id` el pot posar el client: és un
        UUIDv7 nu (D4) i crear offline no ha de necessitar cap resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeInput'
      responses:
        '201':
          description: Creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scope'
        '200':
          description: Ja existia amb aquest `id`. Idempotència (docs/05 §3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects:
    get:
      tags: [scopes]
      operationId: listProjects
      summary: Projectes, filtrables per àmbit
      parameters:
        - name: scope_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Projectes accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [scopes]
      operationId: createProject
      summary: Crear un projecte dins d'un àmbit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Tasques amb filtres
      parameters:
        - name: scope_id
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Valors múltiples separats per comes.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          description: Cursor opac. El client no l'ha d'interpretar mai.
          schema:
            type: string
      responses:
        '200':
          description: Pàgina de tasques.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [tasks]
      operationId: createTask
      summary: Crear una tasca
      description: |
        **`scope_id` és obligatori.** És la invariant central del producte: pot ser que
        un àmbit tingui una tasca sense projecte, però mai una tasca sense àmbit
        (docs/01 §4). L'`id` i la `position` els pot posar el client (D3, D4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '200':
          description: Ja existia amb aquest `id`. Idempotència.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Falta l'àmbit, o no és vàlid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /tasks/{id}/move:
    post:
      tags: [tasks]
      operationId: moveTask
      summary: Moure una tasca de columna o de posició
      description: |
        Existeix a part de `PATCH` perquè moure és l'operació més freqüent del producte,
        la que més s'ha de fusionar offline, i la que necessita la seva pròpia semàntica
        de conflicte (docs/05 §4).

        S'accepta `position` directament —el camí normal, calculada al client (D3)— o
        `{before_id, after_id}` perquè el servidor la calculi, per a clients simples.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveInput'
      responses:
        '200':
          description: Moguda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/complete:
    post:
      tags: [tasks]
      operationId: completeTask
      summary: Completar una tasca
      description: |
        Aplica la cascada i genera la següent instància si es repeteix (docs/05 §4).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /board:
    get:
      tags: [tasks]
      operationId: getBoard
      summary: Les quatre columnes en una crida
      description: |
        Existeix perquè pintar el tauler amb quatre peticions paral·lelitzades dona
        quatre estats de càrrega i quatre punts de fallada per a una sola pantalla
        (docs/05 §4).
      parameters:
        - name: scope_ids
          in: query
          description: Àmbits actius, separats per comes. Sense això, tots els visibles.
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: El tauler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Esdeveniments en una finestra
      description: |
        **Requereix `from` i `to`**: sense finestra no es poden expandir repeticions
        (docs/05 §4). Una RRULE sense COUNT ni UNTIL és infinita.

        Torna OCURRÈNCIES, no files: una sèrie setmanal dins d'un mes surt quatre
        vegades, cadascuna amb el seu `recurrence_id`.

        **Els esdeveniments no surten mai al kanban** (D8). Aquesta és l'única manera
        de demanar-los.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: scope_ids
          in: query
          description: Àmbits actius, separats per comes.
          schema: { type: string }
      responses:
        '200':
          description: Ocurrències dins de la finestra, ordenades per inici.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOccurrence'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Falta la finestra, o no és vàlida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [events]
      operationId: createEvent
      summary: Crear un esdeveniment
      description: |
        Un esdeveniment **no és una tasca amb hores** (D8): té els seus propis `status`
        —TENTATIVE, CONFIRMED, CANCELLED—, té `transparency`, i un calendari extern
        subscrit només en pot produir d'aquests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Creat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '200':
          description: Ja existia amb aquest `id`. Idempotència.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events/{id}:
    patch:
      tags: [events]
      operationId: updateEvent
      summary: Modificar un esdeveniment o una sèrie
      description: |
        `series_mode` resol "aquest esdeveniment, aquest i els següents, o tota la
        sèrie" (docs/05 §4):

        - `single` crea una instància modificada, una fila germana amb el seu
          `RECURRENCE-ID` (D8).
        - `future` **parteix la sèrie**: posa `UNTIL` al mestre i en crea un de nou.
          **No emet mai `RANGE=THISANDFUTURE`.**
        - `all` toca el mestre.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: series_mode
          in: query
          schema:
            type: string
            enum: [single, future, all]
            default: single
        - name: occurrence
          in: query
          description: L'ocurrència afectada, per als modes `single` i `future`.
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Modificat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Falta l'ocurrència per al mode demanat.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    get:
      tags: [events]
      operationId: getEvent
      summary: Un esdeveniment
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: L'esdeveniment.
          content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [events]
      operationId: deleteEvent
      summary: Esborrar un esdeveniment o part d'una sèrie
      description: |
        `single` posa un EXDATE al mestre —esborrar la fila no serviria, el mestre la
        tornaria a generar—; `future` parteix la sèrie amb `UNTIL`; `all` se l'endú
        sencera. Mai s'emet `RANGE=THISANDFUTURE` (D8).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: series_mode, in: query, required: false, schema: { type: string, enum: [single, future, all] } }
        - { name: occurrence, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: El calendari és una subscripció.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /calendars:
    get:
      tags: [events]
      operationId: listCalendars
      summary: Els calendaris que veu qui pregunta
      description: |
        Cada àmbit i cada projecte que es publiqui genera **DUES** col·leccions (D9):
        una `events` i una `todos`. RFC 4791 §5.2 prohibeix recursos de components
        mixtos, DAVx⁵ classifica una col·lecció només per
        `supported-calendar-component-set`, i el CalDAV de Google no accepta VTODO.
      responses:
        '200':
          description: Calendaris accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Calendar'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    post:
      tags: [events]
      operationId: createCalendar
      summary: Crear un calendari
      description: |
        `origin: subscription` necessita `source_url`. Una subscripció és de només
        lectura a la capa de repositori, no només a la interfície (docs/01 §5).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarInput' } } }
      responses:
        '201':
          description: Creat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } }
        '200':
          description: Ja existia amb aquest `id`.
          content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Falta l'àmbit, el nom o la URL d'origen.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /tasks/{id}/checklists:
    get:
      tags: [checklists]
      operationId: listChecklists
      summary: Les llistes senzilles d'una tasca
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Llistes amb els seus ítems.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Checklist'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [checklists]
      operationId: createChecklist
      summary: Crear una llista dins d'una tasca
      description: |
        Una llista pertany **sempre** a una tasca, i opcionalment s'ancora a una subtasca
        concreta (P1). No és un subprojecte ni una subtasca: són dues taules i un flag de
        presentació.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistInput'
      responses:
        '201':
          description: Creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /checklists/{id}/items:
    post:
      tags: [checklists]
      operationId: createChecklistItem
      summary: Afegir un ítem
      description: |
        Un ítem **només té text i fet/no fet** (P1). Cap data, cap assignat, cap
        niuament. La contenció és deliberada i ve de Things 3: és el que fa que la llista
        no es converteixi en un segon gestor de tasques dins del gestor de tasques.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemInput'
      responses:
        '201':
          description: Afegit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      tags: [checklists]
      operationId: listChecklistItems
      summary: Els ítems d'una llista
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Els ítems.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /checklists/{id}:
    get:
      tags: [checklists]
      operationId: getChecklist
      summary: Una llista, amb els seus ítems
      description: |
        Porta `task_title` perquè la vista de llista senzilla el pinta com a molla de pa
        clicable (docs/02 §6), i una segona crida per a un sol camp és una segona fallada.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: La llista.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Checklist' }
                  - type: object
                    required: [task_title]
                    properties:
                      task_title: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [checklists]
      operationId: updateChecklist
      summary: Modificar una llista
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                show_completed_inline:
                  type: boolean
                  description: Completats en línia (ratllats al seu lloc) o en una secció al final.
                subtask_id: { type: [string, 'null'] }
                position: { type: string }
      responses:
        '200':
          description: Modificada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Checklist' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [checklists]
      operationId: deleteChecklist
      summary: Esborrar una llista
      description: "Els ítems cauen amb ella: no existeixen fora d'una llista (P1)."
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /checklist-items/{id}:
    patch:
      tags: [checklists]
      operationId: updateChecklistItem
      summary: Marcar o desmarcar un ítem
      description: |
        **Marcar-lo pot disparar la cascada amunt** (docs/01 §4): quan l'últim ítem d'una
        llista passa a fet, en la mateixa transacció es marca la subtasca ancorada; i si
        totes les llistes i subtasques d'una tasca estan fetes, la tasca passa a `done`.

        Es registra amb `verb='cascade_complete'` perquè es distingeixi d'un gest directe.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemInput'
      responses:
        '200':
          description: Modificat, amb el que la cascada hagi tocat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItemResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [checklists]
      operationId: deleteChecklistItem
      summary: Esborrar un ítem
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /checklists/{id}/pin:
    post:
      tags: [checklists]
      operationId: pinChecklist
      summary: Pinejar una llista
      description: |
        El pinejat és **per usuari** (docs/01 §4): el rail de llistes pinejades és de
        cada persona, no de la casa.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Pinejada.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [checklists]
      operationId: unpinChecklist
      summary: Despinejar una llista
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Despinejada.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /tokens:
    get:
      tags: [tokens]
      operationId: listApiTokens
      summary: Els tokens d'API de qui pregunta
      description: |
        Es llisten amb el **prefix** i l'últim ús, mai el token sencer: només se'n guarda
        el hash (docs/05 §2). Si l'usuari el perd, ha de crear-ne un de nou.
      responses:
        '200':
          description: Els tokens.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ApiTokenSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [tokens]
      operationId: createApiToken
      summary: Crear un token d'API
      description: |
        **El token sencer es retorna UN SOL COP.** No es pot recuperar del hash, i cal
        dir-ho clarament a qui el crea.

        Les capacitats i els àmbits van al registre del token, **no** a scopes d'OAuth
        (regla 9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, capabilities]
              properties:
                name: { type: string }
                capabilities:
                  type: array
                  items: { type: string }
                scope_ids:
                  type: array
                  items: { type: string }
                  description: Buit vol dir tots els àmbits del propietari.
                expires_at: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Creat. Porta el token en clar, i és l'única vegada.
          content:
            application/json:
              schema:
                type: object
                required: [token, summary]
                properties:
                  token:
                    type: string
                    description: El token sencer. No es torna a poder llegir mai més.
                  summary: { $ref: '#/components/schemas/ApiTokenSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tokens/{id}:
    delete:
      tags: [tokens]
      operationId: revokeApiToken
      summary: Revocar un token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Revocat.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /shares:
    get:
      tags: [shares]
      operationId: listShares
      summary: Els enllaços públics de qui pregunta
      description: |
        Es llisten amb la configuració i les visites, **mai amb el token**: només se'n
        guarda l'HMAC (docs/10 §3). Si l'usuari el perd, ha de crear-ne un de nou.
      responses:
        '200':
          description: Els enllaços.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ShareSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [shares]
      operationId: createShare
      summary: Crear un enllaç públic
      description: |
        Una **tasca amb les seves llistes**, o una **llista sola**. No es comparteixen
        projectes ni àmbits sencers (docs/10 §1).

        **No hi ha permís d'edició** (D10): un convidat marca ítems i comenta.

        L'URL sencer es retorna **un sol cop**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id: { type: string }
                checklist_id: { type: string }
                permission:
                  type: string
                  enum: [view, check, comment]
                  default: view
                password: { type: [string, 'null'] }
                require_name: { type: boolean, default: false }
                expires_at: { type: [string, 'null'], format: date-time }
                max_views: { type: [integer, 'null'] }
      responses:
        '201':
          description: Creat. Porta l'URL, i és l'única vegada.
          content:
            application/json:
              schema:
                type: object
                required: [url, token, share]
                properties:
                  url: { type: string }
                  token: { type: string }
                  share: { $ref: '#/components/schemas/ShareSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /shares/{id}:
    delete:
      tags: [shares]
      operationId: revokeShare
      summary: Revocar un enllaç
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Revocat.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags: [scopes]
      operationId: getShare
      summary: Un enllaç compartit
      description: "El token NO hi surt: no es pot recuperar del seu HMAC (docs/10 §6)."
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: L'enllaç.
          content: { application/json: { schema: { $ref: '#/components/schemas/ShareSummary' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [scopes]
      operationId: updateShare
      summary: Reconfigurar un enllaç
      description: |
        El token NO es regenera mai des d'aquí: si canviar el permís canviés l'enllaç, tot
        el que ja s'hagi enviat deixaria de funcionar sense que ningú ho hagi demanat.

        Canviar la contrasenya desbloqueja l'enllaç: els cinc intents fallits eren contra
        l'antiga.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permission: { type: string, enum: [view, check, comment] }
                expires_at: { type: [string, 'null'], format: date-time }
                max_views: { type: [integer, 'null'] }
                require_name: { type: boolean }
                password:
                  type: [string, 'null']
                  description: '`null` la treu; una cadena la canvia; absent no la toca.'
      responses:
        '200':
          description: Reconfigurat.
          content: { application/json: { schema: { $ref: '#/components/schemas/ShareSummary' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Està revocat i no es pot tornar a obrir.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /push/subscriptions:
    post:
      tags: [notifications]
      operationId: subscribePush
      summary: Registrar una subscripció de push
      description: |
        **La mateixa ruta per a Web Push i per a UnifiedPush**: comparteixen RFC i
        xifratge (docs/11 §1). El mateix `endpoint` actualitza la fila en comptes de
        crear-ne una de nova.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, p256dh, auth, platform]
              properties:
                endpoint: { type: string }
                p256dh: { type: string }
                auth: { type: string }
                platform: { type: string, enum: [web, android] }
      responses:
        '201':
          description: Registrada.
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags: [notifications]
      operationId: unsubscribePush
      summary: Treure una subscripció
      parameters:
        - name: endpoint
          in: query
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Treta.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /push/public-key:
    get:
      tags: [notifications]
      operationId: getVapidPublicKey
      summary: La clau pública VAPID de la instància
      description: |
        És estable per sempre: es genera un sol cop i **no hi ha rotació** (docs/11 §2).
      responses:
        '200':
          description: La clau.
          content:
            application/json:
              schema:
                type: object
                required: [public_key]
                properties:
                  public_key: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /tasks/{id}/ai-mode:
    post:
      tags: [tasks]
      operationId: setAiMode
      summary: Canviar el mode d'IA d'una tasca
      description: |
        Els tres modes de docs/09 §2. `manual` és el per defecte i no es pinta res a la
        targeta; `assisted` pot llegir, comentar i preparar però **no completar**;
        `delegated` la pot executar sencera.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ai_mode]
              properties:
                ai_mode:
                  type: string
                  enum: [manual, assisted, delegated]
      responses:
        '200':
          description: El mode nou.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/activity:
    get:
      tags: [tasks]
      operationId: listActivity
      summary: L'historial d'una tasca
      description: |
        Els actors barrejats —humans, IA i externs— amb el valor anterior i el nou de
        cada camp (docs/09 §7).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: actor
          in: query
          required: false
          schema: { type: string, enum: [all, ai, human] }
      responses:
        '200':
          description: L'historial.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityEntry' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /pinned-checklists:
    get:
      tags: [checklists]
      operationId: listPinnedChecklists
      summary: Les llistes pinejades de qui pregunta
      responses:
        '200':
          description: Llistes pinejades, amb el seu progrés.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Checklist'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /sync:
    get:
      tags: [sync]
      operationId: pullSync
      summary: Delta des d'un cursor
      description: |
        Ordenat per `seq` ascendent, sempre. Filtrat pel principal: només arriba el dels
        àmbits que el token pot veure.

        Un `upsert` porta l'entitat SENCERA, no un diff: és més trànsit i molta menys
        complexitat, i les entitats de Fem-ho són petites. Un `delete` només porta
        l'identificador.

        **Sense cursor és una sincronització completa.**
      parameters:
        - name: cursor
          in: query
          description: Cadena OPACA. El client no l'ha d'interpretar mai.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 500 }
      responses:
        '200':
          description: El delta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            El cursor és més vell que la retenció de tombstones i el delta seria
            incomplet. El client buida la base local i torna a començar sense cursor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /sync/batch:
    post:
      tags: [sync]
      operationId: pushSync
      summary: Buidat de la cua de sortida
      description: |
        **Cada operació es resol per separat**: una que falli no ha de tombar el lot.

        `op_id` és la clau d'idempotència. Reenviar un lot després d'una caiguda no
        duplica res.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatch'
      responses:
        '200':
          description: Un resultat per operació, en el mateix ordre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResults'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /scopes/{id}:
    get:
      tags: [scopes]
      operationId: getScope
      summary: Un àmbit
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: L'àmbit.
          content: { application/json: { schema: { $ref: '#/components/schemas/Scope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [scopes]
      operationId: updateScope
      summary: Modificar un àmbit
      description: |
        `kind` NO es pot canviar. Passar d'individual a col·lectiu deixaria totes les
        tasques assignades al propietari per la regla d'assignació automàtica (docs/01
        §4) sense que ningú ho hagi demanat.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScopePatch' } } }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Scope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [scopes]
      operationId: deleteScope
      summary: Esborrar un àmbit
      description: |
        Es nega amb `409` si encara té tasques o projectes, i diu quants: la cascada
        aquí seria irreversible des de la interfície.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Encara té coses a dins.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /scopes/{id}/members:
    get:
      tags: [scopes]
      operationId: listMembers
      summary: Els membres d'un àmbit
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Els membres.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Member' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [scopes]
      operationId: addMember
      summary: Afegir un membre
      description: |
        P3: un membre és **o bé** un usuari **o bé** una subscripció de calendari de
        només lectura. Mai totes dues coses ni cap.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemberInput' } } }
      responses:
        '201':
          description: Afegit.
          content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Forma de membre invàlida, o l'àmbit no és col·lectiu.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /scopes/{id}/members/{memberId}:
    patch:
      tags: [scopes]
      operationId: updateMember
      summary: Canviar el rol d'un membre
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member, viewer] }
      responses:
        '200':
          description: Canviat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Es quedaria sense cap propietari.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    delete:
      tags: [scopes]
      operationId: removeMember
      summary: Treure un membre
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Tret. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Es quedaria sense cap propietari.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /projects/{id}:
    get:
      tags: [scopes]
      operationId: getProject
      summary: Un projecte
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: El projecte.
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [scopes]
      operationId: updateProject
      summary: Modificar o arxivar un projecte
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPatch' } } }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [scopes]
      operationId: deleteProject
      summary: Esborrar un projecte
      description: |
        Les tasques NO cauen amb ell: tornen a l'espai general de l'àmbit, que és el
        filtre `project_id IS NULL` i no una fila (docs/01 §4).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Esborrat, amb quantes tasques han passat a l'espai general.
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /labels:
    get:
      tags: [tasks]
      operationId: listLabels
      summary: Les etiquetes visibles
      parameters:
        - { name: scope_id, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Les etiquetes.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Label' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [tasks]
      operationId: createLabel
      summary: Crear una etiqueta
      description: |
        Una etiqueta pertany a un àmbit: "Urgent" a Feina i "Urgent" a Casa són coses
        diferents, i la clau única `(scope_id, name)` ho imposa.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LabelInput' } } }
      responses:
        '201':
          description: Creada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Label' } } }
        '200':
          description: Ja existia amb aquest nom en aquest àmbit.
          content: { application/json: { schema: { $ref: '#/components/schemas/Label' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Falta l'àmbit o el nom.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /labels/{id}:
    delete:
      tags: [tasks]
      operationId: deleteLabel
      summary: Esborrar una etiqueta
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: Una tasca
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: La tasca.
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Modificar una tasca
      description: |
        Només els camps que es donin. `null` vol dir "buida'l" i absent vol dir "no el
        toquis": sense la distinció, buidar una data seria impossible des d'un client
        que envia només el que ha canviat.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskPatch' } } }
      responses:
        '200':
          description: Modificada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Esborrar una tasca
      description: |
        Esborrat suau. Les subtasques i les llistes cauen amb ella —no existeixen fora
        d'una tasca—, a diferència del que passa en esborrar un projecte.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/assignees/{userId}:
    post:
      tags: [tasks]
      operationId: addAssignee
      summary: Assignar una persona
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Assignada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: No és membre de l'àmbit col·lectiu.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    delete:
      tags: [tasks]
      operationId: removeAssignee
      summary: Desassignar una persona
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Desassignada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/{id}/labels/{labelId}:
    post:
      tags: [tasks]
      operationId: addTaskLabel
      summary: Posar una etiqueta a una tasca
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: labelId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Posada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: L'etiqueta és d'un altre àmbit.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    delete:
      tags: [tasks]
      operationId: removeTaskLabel
      summary: Treure una etiqueta d'una tasca
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: labelId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Treta. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /tasks/{id}/subtasks:
    get:
      tags: [tasks]
      operationId: listSubtasks
      summary: Les subtasques d'una tasca
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Les subtasques.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Subtask' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tasks]
      operationId: createSubtask
      summary: Crear una subtasca
      description: |
        Una subtasca NO és una tasca: no té àmbit propi, ni estat de kanban, ni data, ni
        assignat. Té títol i fet/no fet, i pot ancorar una llista senzilla.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubtaskInput' } } }
      responses:
        '201':
          description: Creada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Subtask' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Falta el títol.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /subtasks/{id}:
    patch:
      tags: [tasks]
      operationId: updateSubtask
      summary: Modificar una subtasca
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubtaskPatch' } } }
      responses:
        '200':
          description: Modificada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Subtask' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      operationId: deleteSubtask
      summary: Esborrar una subtasca
      description: |
        Les llistes ancorades es desancoren, no cauen: una llista de la compra segueix
        sent la llista de la compra quan la subtasca desapareix.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/comments:
    get:
      tags: [tasks]
      operationId: listComments
      summary: Els comentaris d'una tasca
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Els comentaris.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [tasks]
      operationId: addComment
      summary: Comentar una tasca
      description: |
        És la via principal perquè un agent reporti (docs/09 §6), i per això surt a
        l'historial com qualsevol altre gest.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        '201':
          description: Comentat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /inbox:
    get:
      tags: [tasks]
      operationId: getInbox
      summary: L'Inbox d'un dia
      description: |
        La MATEIXA font de dades per a la columna del kanban i per al rail del calendari
        (P4). Sense `date`, el dia és avui al fus de qui pregunta, no al del servidor.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: include_overdue, in: query, required: false, schema: { type: boolean } }
        - { name: scope_ids, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: L'Inbox.
          content: { application/json: { schema: { $ref: '#/components/schemas/Inbox' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /dashboard:
    get:
      tags: [tasks]
      operationId: getDashboard
      summary: El dashboard global
      description: |
        Ignora la selecció d'àmbits i de projecte: ho ensenya tot (docs/02 §8). Per això
        no accepta cap filtre d'àmbit.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: El dashboard.
          content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /search:
    get:
      tags: [tasks]
      operationId: search
      summary: Cercar tasques
      description: |
        La consulta es normalitza amb la MATEIXA funció que va generar `search_text`
        (docs/01 §11). Dues implementacions divergirien justament en les paraules per a
        les quals la normalització existeix: "col·legi", "Barça", "l'aigua".
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: scope_id, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Els resultats.
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskPage' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /parse:
    post:
      tags: [tasks]
      operationId: parseQuickAdd
      summary: Analitzar una cadena d'afegida ràpida
      description: |
        Per a clients que no poden portar el parser. Els que sí, el porten: el camp
        d'afegida ha de pintar els xips mentre s'escriu i una petició per tecla no és
        una opció (D12).

        A la v1, només sigils. El parseig de dates en català arriba a la v1.1 sense
        canviar la forma d'aquest endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                active_scope_ids: { type: string }
      responses:
        '200':
          description: El resultat del parseig.
          content: { application/json: { schema: { $ref: '#/components/schemas/QuickAddResult' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /calendars/{id}:
    patch:
      tags: [events]
      operationId: updateCalendar
      summary: Modificar un calendari
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarPatch' } } }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [events]
      operationId: deleteCalendar
      summary: Esborrar un calendari
      description: |
        Es nega amb `409` si és local i encara té esdeveniments. Una subscripció sí que
        se'n va amb el que hagi portat: el que hi ha a dins no l'ha escrit ningú d'aquí.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Encara té esdeveniments.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Canviar la contrasenya
      description: |
        Demana l'actual encara que hi hagi sessió: una sessió oberta en un ordinador
        compartit no és prova d'identitat per canviar la credencial que obre totes les
        altres. I revoca la resta de sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        '200':
          description: Canviada, amb quantes sessions s'han revocat.
          content:
            application/json:
              schema:
                type: object
                required: [revoked_sessions]
                properties:
                  revoked_sessions: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: La contrasenya actual no és correcta.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /auth/settings:
    get:
      tags: [auth]
      operationId: getSettings
      summary: Perfil i preferències
      responses:
        '200':
          description: El perfil i les preferències.
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingsBundle' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [auth]
      operationId: updateSettings
      summary: Canviar les preferències
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } }
      responses:
        '200':
          description: Canviades.
          content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /ai/agents:
    get:
      tags: [tasks]
      operationId: listAgents
      summary: Els agents que actuen en nom de qui pregunta
      responses:
        '200':
          description: Els agents.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Agent' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [tasks]
      operationId: createAgent
      summary: Crear un agent
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentInput' } } }
      responses:
        '201':
          description: Creat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /ai/agents/{id}:
    get:
      tags: [tasks]
      operationId: getAgent
      summary: Un agent
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: L'agent.
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      operationId: updateAgent
      summary: Modificar un agent
      description: Desactivar-lo allibera les seves reserves.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentPatch' } } }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      operationId: deleteAgent
      summary: Esborrar un agent
      description: |
        Les tasques que hi tenien delegació es queden, amb `delegate_agent_id` a null i
        el mode d'IA a `manual`: la feina és de la persona, no de l'agent (D5).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Esborrat, amb quantes tasques s'han desdelegat.
          content:
            application/json:
              schema:
                type: object
                required: [released]
                properties:
                  released: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ai/next-task:
    get:
      tags: [tasks]
      operationId: nextTask
      summary: La següent tasca disponible, ja reservada
      description: |
        `task` a null vol dir "ara no hi ha res a fer", que és una resposta correcta: un
        404 faria que un agent que consulta cada minut ho llegís com un error de
        configuració.
      parameters:
        - { name: scope_id, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: La tasca reservada, o null.
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    oneOf:
                      - { $ref: '#/components/schemas/ClaimedTask' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /ai/tasks/{id}/claim:
    post:
      tags: [tasks]
      operationId: claimTask
      summary: Reservar una tasca
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Reservada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Lease' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Ja la té algú altre.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /ai/tasks/{id}/release:
    post:
      tags: [tasks]
      operationId: releaseTask
      summary: Alliberar una reserva
      description: |
        El motiu és obligatori: una reserva alliberada sense dir per què deixa
        l'historial amb un forat que ningú sabrà interpretar (docs/09 §5).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '204': { description: Alliberada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Falta el motiu.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /ai/tasks/{id}/lease:
    get:
      tags: [tasks]
      operationId: getLease
      summary: La reserva d'una tasca, si en té
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: La reserva, o null.
          content:
            application/json:
              schema:
                type: object
                required: [lease]
                properties:
                  lease:
                    oneOf:
                      - { $ref: '#/components/schemas/Lease' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /shares/{id}/accesses:
    get:
      tags: [scopes]
      operationId: listShareAccesses
      summary: Qui ha entrat per un enllaç
      description: |
        L'etiqueta és pseudònima: "Extern · Marta" o "Extern · a4f2". No hi ha cap
        columna d'IP enlloc, i és una decisió de privadesa explícita (D10).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Els accessos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ShareAccess' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    get:
      tags: [instance]
      operationId: listUsers
      summary: Els membres de la llar
      responses:
        '200':
          description: Els usuaris.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/invite:
    post:
      tags: [instance]
      operationId: inviteUser
      summary: Convidar un membre
      description: |
        Crea l'usuari SENSE contrasenya i genera un enllaç d'un sol ús perquè la posi
        ell. L'administrador no arriba a saber-la mai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                role: { type: string, enum: [admin, member] }
      responses:
        '201':
          description: Convidat. `invite_url` es mostra un sol cop.
          content: { application/json: { schema: { $ref: '#/components/schemas/InviteResult' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ja hi ha un compte amb aquest correu.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /admin/users/{id}:
    patch:
      tags: [instance]
      operationId: updateUser
      summary: Modificar un usuari
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string, enum: [admin, member] }
      responses:
        '200':
          description: Modificat.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [instance]
      operationId: deleteUser
      summary: Esborrar un usuari
      description: |
        Un administrador NO es pot esborrar a si mateix, ni es pot esborrar l'últim: la
        instància es quedaria sense ningú que la pogués administrar.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Esborrat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: És l'últim administrador, o ets tu mateix.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /admin/wipe:
    post:
      tags: [instance]
      operationId: wipeInstance
      summary: Netejar la instància
      description: |
        La confirmació escrivint el nom exacte de la instància es comprova TAMBÉ aquí:
        una crida directa a l'API no ha de poder-ho fer sense el mateix gest deliberat
        que la interfície demana.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string }
      responses:
        '200':
          description: Netejada, amb el recompte per taula.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: object, additionalProperties: { type: integer } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: La confirmació no coincideix.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /admin/diagnostics:
    get:
      tags: [instance]
      operationId: getDiagnostics
      summary: Paquet de diagnòstic
      description: |
        Amb tots els secrets ocultats (docs/12 §8). El punt és poder-lo enganxar a un
        informe d'error: no hi surt cap valor de variable d'entorn, cap cadena de
        connexió i cap clau, només si hi són.
      responses:
        '200':
          description: El diagnòstic.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /export:
    get:
      tags: [instance]
      operationId: exportAll
      summary: Exportar les dades pròpies
      description: |
        No demana permís a ningú: són les seves dades (docs/10 §9). El que surt és el
        que qui pregunta pot veure, i les entitats esborrades no hi són.
      responses:
        '200':
          description: L'exportació.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

components:
  schemas:

    ScopePatch:
      type: object
      description: |
        Només els camps donats. `kind` no hi és a posta: no es pot canviar.
      properties:
        name: { type: string }
        color: { type: string }
        icon: { type: [string, 'null'] }
        ai_instructions: { type: [string, 'null'] }
        ai_description: { type: [string, 'null'] }
        position: { type: string }

    Member:
      type: object
      required: [id, scope_id, user_id, external_calendar_id, role, created_at]
      properties:
        id: { type: string }
        scope_id: { type: string }
        user_id:
          type: [string, 'null']
          description: P3 · o això o `external_calendar_id`, mai totes dues coses.
        external_calendar_id: { type: [string, 'null'] }
        role: { type: string, enum: [owner, admin, member, viewer] }
        created_at: { type: string, format: date-time }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }

    MemberInput:
      type: object
      description: Exactament un de `user_id` o `external_calendar_id`.
      properties:
        user_id: { type: string }
        external_calendar_id: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }

    ProjectPatch:
      type: object
      properties:
        name: { type: string }
        ai_instructions: { type: [string, 'null'] }
        ai_description: { type: [string, 'null'] }
        position: { type: string }
        archived:
          type: boolean
          description: Arxivar és posar-hi data; desarxivar és treure-la. No és un esborrat.

    Label:
      type: object
      required: [id, scope_id, name, color, created_at]
      properties:
        id: { type: string }
        scope_id: { type: string }
        name: { type: string }
        color: { type: string, description: 'Nom de token, mai un literal de color.' }
        created_at: { type: string, format: date-time }

    LabelInput:
      type: object
      required: [scope_id, name]
      properties:
        id: { type: string }
        scope_id: { type: string }
        name: { type: string }
        color: { type: string }

    TaskPatch:
      type: object
      description: |
        `null` vol dir "buida'l" i absent vol dir "no el toquis". Per moure-la, `/move`.
      properties:
        title: { type: string }
        description: { type: [string, 'null'] }
        due_date: { type: [string, 'null'], format: date }
        due_time: { type: [string, 'null'] }
        deadline:
          type: [string, 'null']
          format: date-time
          description: |
            Separada del venciment (docs/02 §7): "fes-ho aquest dijous" i "com a molt
            tard el dia 30" són dues coses, i amb un sol camp qui té les dues n'ha de
            triar una.
        project_id:
          type: [string, 'null']
          description: |
            `null` la torna a l'espai general de l'àmbit. **L'àmbit no es pot canviar
            editant**: altres membres, altres etiquetes i l'assignació automàtica dels
            àmbits individuals. Un projecte d'un altre àmbit es rebutja amb `422`.
        rrule:
          type: [string, 'null']
          description: 'RFC 5545. `null` deixa de repetir-se.'
        recurrence_mode:
          type: string
          enum: [schedule, completion]
          description: |
            La distinció que Todoist escriu com a `every` contra `every!`: repetir-se
            cada dimarts contra repetir-se una setmana **després d'haver-la fet**. RRULE
            no sap expressar la segona, i per a tasques domèstiques és la que la gent
            vol; per això és un camp propi (docs/01 §4).
        ai_mode: { type: string, enum: [manual, assisted, delegated] }
        ai_instructions: { type: [string, 'null'] }

    Subtask:
      type: object
      required: [id, task_id, title, done, position, version]
      properties:
        id: { type: string }
        task_id: { type: string }
        title: { type: string }
        done: { type: boolean }
        position: { type: string }
        version: { type: integer }

    SubtaskInput:
      type: object
      required: [title]
      properties:
        id: { type: string }
        title: { type: string }
        position: { type: string }

    SubtaskPatch:
      type: object
      properties:
        title: { type: string }
        done: { type: boolean }
        position: { type: string }

    Comment:
      type: object
      required: [id, task_id, body, created_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        author_id: { type: [string, 'null'] }
        author_name: { type: [string, 'null'] }
        guest_name:
          type: [string, 'null']
          description: Present quan el comentari ve d'un enllaç compartit.
        body: { type: string }
        created_at: { type: string, format: date-time }

    Inbox:
      type: object
      required: [date, dated, overdue, undated]
      properties:
        date: { type: string, format: date }
        dated:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        overdue:
          type: array
          description: Buit si no s'han demanat.
          items: { $ref: '#/components/schemas/Task' }
        undated:
          type: array
          description: La secció "SENSE DIA" del rail (docs/02 §5).
          items: { $ref: '#/components/schemas/Task' }

    DashboardScope:
      type: object
      required: [scope_id, name, color, pending, overdue]
      properties:
        scope_id: { type: string }
        name: { type: string }
        color: { type: string }
        pending: { type: integer }
        overdue: { type: integer }

    Dashboard:
      type: object
      required: [date, scopes, today, overdue, doing]
      properties:
        date: { type: string, format: date }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/DashboardScope' }
        today:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        overdue:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        doing:
          type: array
          items: { $ref: '#/components/schemas/Task' }

    QuickAddToken:
      type: object
      required: [kind, raw, start, end, id, label]
      properties:
        kind: { type: string, enum: [scope, project, person, aiMode] }
        raw:
          type: string
          description: El text literal que ocupava, sigil inclòs. Tornar-lo a posar desfà el xip.
        start: { type: integer }
        end: { type: integer }
        id: { type: string }
        label: { type: string }

    QuickAddResult:
      type: object
      required: [title, scopeId, projectId, assigneeIds, aiMode, tokens, error]
      properties:
        title: { type: string }
        scopeId: { type: [string, 'null'] }
        projectId: { type: [string, 'null'] }
        assigneeIds:
          type: array
          items: { type: string }
        aiMode: { type: string, enum: [manual, assisted, delegated] }
        tokens:
          type: array
          items: { $ref: '#/components/schemas/QuickAddToken' }
        error:
          type: ['null', string]
          enum: [scope-required, empty-title, null]
          description: |
            `scope-required` quan hi ha més d'un àmbit actiu i no s'ha escrit `#`: llavors
            no es crea res i es demana l'àmbit (docs/02 §4). El nom del camp és el que ja
            fan servir els fixtures compartits amb Kotlin, i no se'n pot inventar un altre
            aquí sense trencar `parser-parity`.

    CalendarInput:
      type: object
      required: [scope_id, name]
      properties:
        id: { type: string }
        scope_id: { type: string }
        project_id: { type: [string, 'null'] }
        name: { type: string }
        color: { type: [string, 'null'] }
        kind:
          type: string
          enum: [events, todos]
          description: |
            D9 · dues col·leccions per contenidor, sempre. RFC 4791 §5.2 prohibeix
            recursos de components mixtos.
        origin: { type: string, enum: [local, subscription] }
        source_kind:
          type: string
          enum: [caldav, ical, rss]
          description: |
            Obligatori a la pràctica si `origin` és `subscription`: sense, es tracta com
            a `ical`, que és la tria segura —un document es baixa sencer i funciona
            igualment contra un CalDAV que el serveixi per `GET`, i a l'inrevés no.
        source_url:
          type: string
          description: Obligatòria si `origin` és `subscription`.
        source_username: { type: string }
        source_secret:
          type: string
          writeOnly: true
          description: |
            La contrasenya de l'origen. **Es xifra en repòs** (docs/07 §9) i no torna mai
            a sortir del servidor: les respostes no la porten en cap forma.
        writable:
          type: boolean
          description: |
            Demana que la font sigui bidireccional. **Només s'atorga amb `caldav`**: a un
            `.ics` o un RSS s'ignora, perquè deixar editar una cosa que no arribarà mai a
            l'origen és pitjor que no deixar-ho.
        refresh_interval: { type: integer }
        strip_alarms: { type: boolean }

    CalendarPatch:
      type: object
      properties:
        name: { type: string }
        color: { type: [string, 'null'] }
        source_url: { type: string }
        source_username: { type: string }
        source_secret:
          type: string
          writeOnly: true
          description: |
            Absent vol dir **"no la toquis"**, no "esborra-la": el formulari no la torna
            a ensenyar mai, i desar el nom d'una font no ha de perdre'n les credencials.
        writable: { type: boolean }
        refresh_interval: { type: [integer, 'null'] }
        strip_alarms: { type: boolean }

    UserSettings:
      type: object
      properties:
        done_cleared_at:
          type: [string, 'null']
          format: date-time
          description: El botó de netejar la columna Fet. No esborra res (P2).
        inbox_position: { type: string, enum: [left, right, below] }
        inbox_show_overdue: { type: boolean }
        collapsed_groups:
          type: array
          items: { type: string }
        hidden_calendar_ids:
          type: array
          items: { type: string }
          description: |
            Fonts del calendari que aquest usuari no vol veure. **S'hi guarda el que
            s'amaga i no el que es veu**: així una font nova surt sola, que és el que ha
            de passar quan algú de la casa n'afegeix una.
        week_start:
          type: string
          enum: [auto, monday, sunday]
          default: auto
          description: |
            Amb quin dia comença la setmana. `auto` segueix l'idioma —dilluns en català
            i castellà, diumenge en anglès— i és el que hi ha per defecte.

            Es pot canviar perquè **el primer dia de la setmana no és només una
            convenció lingüística**: qui treballa el cap de setmana el vol d'una manera
            i qui no, d'una altra, i tots dos poden tenir la mateixa llengua.
        show_calendar_widget: { type: boolean }
        show_overdue_section: { type: boolean }
        quiet_hours_start: { type: [string, 'null'] }
        quiet_hours_end: { type: [string, 'null'] }
        daily_digest_at: { type: [string, 'null'] }

    UserProfile:
      type: object
      required: [id, name, role, kind, timezone, locale, theme, accent]
      properties:
        id: { type: string }
        email: { type: [string, 'null'] }
        name: { type: string }
        role: { type: string, enum: [admin, member] }
        kind: { type: string, enum: [human, ai, caldav_only] }
        timezone: { type: string }
        locale:
          type: string
          enum: [ca, en, es]
          description: |
            L'idioma d'aquesta persona. La primera vegada el client el negocia del
            navegador o del dispositiu i l'escriu aquí; a partir d'aquí el perfil mana
            sobre el dispositiu, que és el que fa que canviar-lo al portàtil també el
            canviï al telèfon.

            **El servidor el fa servir per a les notificacions**, que les pinta el
            sistema operatiu i el client no pot traduir després.
        theme: { type: string, enum: [system, light, dark] }
        accent: { type: string, enum: [default, soft, mono-warm, mono-cool] }
        avatar_color: { type: [string, 'null'] }

    SettingsBundle:
      type: object
      required: [profile, settings]
      properties:
        profile: { $ref: '#/components/schemas/UserProfile' }
        settings: { $ref: '#/components/schemas/UserSettings' }

    Agent:
      type: object
      required: [id, name, on_behalf_of_user_id, actor_user_id, can_create_tasks, enabled, created_at, version]
      properties:
        id: { type: string }
        name: { type: string }
        on_behalf_of_user_id:
          type: string
          description: D5 · la responsabilitat es queda sempre amb una persona.
        actor_user_id:
          type: string
          description: La fila d'usuari `kind='ai'`, que és qui signa l'historial i els comentaris.
        can_create_tasks: { type: boolean }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    AgentInput:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
        can_create_tasks: { type: boolean }

    AgentPatch:
      type: object
      properties:
        name: { type: string }
        can_create_tasks: { type: boolean }
        enabled: { type: boolean }

    Lease:
      type: object
      required: [task_id, user_id, acquired_at, expires_at]
      properties:
        task_id: { type: string }
        user_id: { type: string }
        agent_id: { type: [string, 'null'] }
        acquired_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Trenta minuts (docs/09 §5). Caducada, la tasca torna a estar disponible.

    ClaimedTask:
      type: object
      required: [taskId, lease]
      properties:
        taskId: { type: string }
        lease: { $ref: '#/components/schemas/Lease' }

    ShareAccess:
      type: object
      required: [id, label, first_seen, last_seen]
      properties:
        id: { type: string }
        label:
          type: string
          description: '"Extern · Marta" o "Extern · a4f2". Mai una IP: no n''hi ha cap columna (D10).'
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }

    AdminUser:
      type: object
      required: [id, name, role, kind, created_at, pending_invite]
      properties:
        id: { type: string }
        email: { type: [string, 'null'] }
        name: { type: string }
        role: { type: string, enum: [admin, member] }
        kind: { type: string, enum: [human, ai, caldav_only] }
        created_at: { type: string, format: date-time }
        pending_invite:
          type: boolean
          description: Encara no ha fet servir la invitació; el compte no s'ha estrenat.

    InviteResult:
      type: object
      required: [user, invite_url, expires_at]
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        invite_url:
          type: string
          description: Es mostra UN SOL COP. Després només en queda l'HMAC.
        expires_at: { type: string, format: date-time }
    ShareSummary:
      type: object
      required: [id, permission, require_name, has_password, view_count, created_at]
      properties:
        id: { type: string }
        task_id: { type: [string, 'null'] }
        checklist_id: { type: [string, 'null'] }
        permission:
          type: string
          enum: [view, check, comment]
        require_name: { type: boolean }
        has_password:
          type: boolean
          description: Si en té, no quina. La contrasenya es guarda amb argon2id.
        expires_at: { type: [string, 'null'], format: date-time }
        max_views: { type: [integer, 'null'] }
        view_count: { type: integer }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }

    ApiTokenSummary:
      type: object
      required: [id, name, token_prefix, capabilities, scope_ids, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        token_prefix:
          type: string
          description: Els primers caràcters, per poder-lo reconèixer a la llista.
        capabilities:
          type: array
          items: { type: string }
        scope_ids:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }

    ActivityEntry:
      type: object
      required: [id, entity_type, entity_id, verb, actor_type, source, created_at]
      properties:
        id:
          type: string
          description: UUIDv7, que ordena per temps sense un comptador a part.
        entity_type: { type: string }
        entity_id: { type: string }
        verb: { type: string }
        actor_type:
          type: string
          enum: [user, ai_agent, guest, system, caldav]
        actor_user_id: { type: [string, 'null'] }
        actor_agent_id: { type: [string, 'null'] }
        actor_label:
          type: [string, 'null']
          description: '"Borja", "IA · Claude", "Extern · Marta".'
        source: { type: string }
        changes:
          type: [object, 'null']
          description: |
            `{camp: {from, to}}`. És el que fa possible el botó Desfés: sense el valor
            anterior no hi ha res a què tornar.

            La forma és fixa i el contracte ho diu, perquè `additionalProperties: true`
            generava un `unknown` per valor i obligava cada client a assumir-ne la forma
            pel seu compte, que és exactament el que la regla 5 evita.
          additionalProperties:
            type: object
            required: [from, to]
            properties:
              from: {}
              to: {}
        created_at: { type: string, format: date-time }
        undoable:
          type: boolean
          description: Un canvi autònom d'IA que encara es pot desfer.

    SyncChange:
      type: object
      additionalProperties: false
      required: [entity, id, op, seq]
      properties:
        entity: { type: string }
        id: { type: string }
        op:
          type: string
          enum: [upsert, delete]
        seq: { type: integer }
        data:
          type: object
          additionalProperties: true
          description: L'entitat SENCERA. Absent als `delete`.

    SyncResponse:
      type: object
      additionalProperties: false
      required: [changes, next_cursor, has_more, server_time]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        next_cursor: { type: string }
        has_more: { type: boolean }
        server_time:
          type: string
          format: date-time
          description: |
            Perquè el client detecti desviació de rellotge. Un rellotge mal posat trenca
            els recordatoris i les comparacions de "avui" (docs/06 §3).

    SyncOperation:
      type: object
      additionalProperties: false
      required: [op_id, entity, op, id]
      properties:
        op_id:
          type: string
          description: Clau d'idempotència. Reenviar el lot no duplica res.
        entity: { type: string }
        op:
          type: string
          enum: [create, update, delete, move]
        id: { type: string }
        base_version:
          type: integer
          description: La versió sobre la qual s'edita.
        data:
          type: object
          additionalProperties: true

    SyncBatch:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'

    SyncBatchResult:
      type: object
      additionalProperties: false
      required: [op_id, status]
      properties:
        op_id: { type: string }
        status:
          type: string
          enum: [ok, conflict, rejected]
          description: Tres resultats i prou (docs/06 §4).
        entity:
          type: object
          additionalProperties: true
        server_entity:
          type: object
          additionalProperties: true
          description: L'estat actual, perquè el client pugui fusionar sense una altra petició.
        error:
          type: object
          additionalProperties: true

    SyncBatchResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncBatchResult'

    Checklist:
      type: object
      additionalProperties: false
      required: [id, task_id, name, pinned, show_completed_inline, position, items, version]
      properties:
        id: { type: string }
        task_id: { type: string }
        subtask_id:
          type: [string, 'null']
          description: Ancoratge opcional a una subtasca concreta (P1).
        name: { type: string }
        pinned:
          type: boolean
          description: Pinejat PER USUARI. El rail és de cada persona.
        show_completed_inline:
          type: boolean
          description: |
            Completats ratllats al seu lloc, o en una secció "Completats" al final,
            plegada amb el recompte (docs/02 §6).
        position: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        version: { type: integer }

    ChecklistInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1 }
        subtask_id: { type: string }
        show_completed_inline: { type: boolean }

    ChecklistItem:
      type: object
      additionalProperties: false
      required: [id, checklist_id, text, done, position]
      properties:
        id: { type: string }
        checklist_id: { type: string }
        text: { type: string }
        done: { type: boolean }
        done_at: { type: [string, 'null'], format: date-time }
        done_by: { type: [string, 'null'] }
        position: { type: string }

    ChecklistItemInput:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        text: { type: string, minLength: 1 }
        done: { type: boolean }
        position: { type: string }

    ChecklistItemResult:
      type: object
      additionalProperties: false
      required: [item, cascade]
      properties:
        item:
          $ref: '#/components/schemas/ChecklistItem'
        cascade:
          type: object
          additionalProperties: false
          required: [checklist_completed, subtask_completed, task_completed]
          description: Què ha tocat la cascada amunt, perquè la interfície ho pugui dir.
          properties:
            checklist_completed: { type: boolean }
            subtask_completed: { type: boolean }
            task_completed: { type: boolean }
            suggest_unpin:
              type: boolean
              description: |
                Cert quan una llista PINEJADA s'ha completat del tot: llavors es pregunta
                si es vol despinejar (P1).

    Calendar:
      type: object
      additionalProperties: false
      required: [id, scope_id, name, kind, origin, writable]
      properties:
        id: { type: string }
        scope_id: { type: string }
        project_id: { type: [string, 'null'] }
        name: { type: string }
        color: { type: [string, 'null'] }
        kind:
          type: string
          enum: [events, todos]
          description: Obligatori i únic per col·lecció (D9).
        origin:
          type: string
          enum: [local, subscription]
          description: Les subscripcions són de només lectura a la capa de repositori.
        source_kind:
          type: [string, 'null']
          enum: [caldav, ical, rss, null]
          description: |
            De quina mena és la font externa. `caldav` és una col·lecció; `ical`, un
            document publicat; `rss`, un canal on **cada element és un instant** —no una
            durada— i es converteix en un VEVENT sense hora de final.
        source_url: { type: [string, 'null'] }
        source_username: { type: [string, 'null'] }
        writable:
          type: boolean
          default: false
          description: |
            La font és **bidireccional**. Només un CalDAV pot ser-ho: un `.ics` publicat
            i un RSS són documents, no col·leccions on es pugui escriure. Amb `false`,
            el calendari és de només lectura a la capa de repositori.
        refresh_interval: { type: [integer, 'null'] }
        last_refreshed_at: { type: [string, 'null'], format: date-time }
        last_error:
          type: [string, 'null']
          description: |
            Per què va fallar l'últim refresc. Sense això, una font caiguda es veu
            exactament igual que una que no té esdeveniments.
        last_error_at: { type: [string, 'null'], format: date-time }

    Event:
      type: object
      additionalProperties: false
      required: [id, calendar_id, uid, summary, starts_at, all_day, version]
      properties:
        id: { type: string }
        calendar_id: { type: string }
        uid: { type: string, description: UID d'iCalendar. }
        recurrence_id:
          type: [string, 'null']
          description: Nul al mestre. Amb valor, és una instància modificada (D8).
        summary: { type: string }
        description: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        all_day:
          type: boolean
          description: |
            VALUE=DATE és tot el dia i NO té fus. Convertir-lo a mitjanit UTC és l'error
            que fa que els aniversaris apareguin el dia abans a mig món (docs/07 §8).
        timezone: { type: [string, 'null'] }
        status:
          type: string
          enum: [TENTATIVE, CONFIRMED, CANCELLED]
          description: Els de VEVENT. Els de VTODO són uns altres (D8).
        transparency:
          type: string
          enum: [OPAQUE, TRANSPARENT]
          description: Si ocupa temps. VTODO no en té equivalent.
        rrule: { type: [string, 'null'] }
        version: { type: integer }

    EventInput:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        calendar_id: { type: string }
        summary: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        all_day: { type: boolean }
        timezone: { type: string }
        status:
          type: string
          enum: [TENTATIVE, CONFIRMED, CANCELLED]
        transparency:
          type: string
          enum: [OPAQUE, TRANSPARENT]
        rrule: { type: string }

    EventOccurrence:
      type: object
      additionalProperties: false
      required: [event_id, uid, summary, starts_at, ends_at, all_day, scope_id]
      properties:
        event_id: { type: string }
        uid: { type: string }
        recurrence_id:
          type: [string, 'null']
          description: L'inici que li tocaria segons la regla, encara que s'hagi mogut.
        summary: { type: string }
        location: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        all_day: { type: boolean }
        scope_id: { type: string }
        calendar_id: { type: string }
        status:
          type: string
          enum: [TENTATIVE, CONFIRMED, CANCELLED]
        is_override:
          type: boolean
          description: Cert si aquesta ocurrència ve d'una instància modificada.

    Scope:
      type: object
      additionalProperties: false
      required: [id, name, kind, color, position, created_at, updated_at, version]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [individual, collective]
        color:
          type: string
          description: Token CSS o hex. Els tres inicials fan servir la tríada de Plou.
        icon: { type: [string, 'null'] }
        ai_instructions: { type: [string, 'null'] }
        ai_description: { type: [string, 'null'] }
        position: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    ScopeInput:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        id:
          type: string
          description: UUIDv7 nu. El pot posar el client (D4).
        name: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [individual, collective]
          default: individual
        color: { type: string }
        icon: { type: string }
        ai_instructions: { type: string }
        ai_description: { type: string }
        position: { type: string }

    Project:
      type: object
      additionalProperties: false
      required: [id, scope_id, name, position, created_at, updated_at, version]
      properties:
        id: { type: string }
        scope_id: { type: string }
        name: { type: string }
        ai_instructions: { type: [string, 'null'] }
        ai_description: { type: [string, 'null'] }
        position: { type: string }
        archived_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    ProjectInput:
      type: object
      additionalProperties: false
      required: [scope_id, name]
      properties:
        id: { type: string }
        scope_id: { type: string }
        name: { type: string, minLength: 1 }
        ai_instructions: { type: string }
        ai_description: { type: string }
        position: { type: string }

    Task:
      type: object
      additionalProperties: false
      required:
        [id, scope_id, title, status, position, ai_mode, view_mode, created_at, updated_at, version]
      properties:
        id: { type: string }
        scope_id: { type: string }
        project_id: { type: [string, 'null'] }
        title: { type: string }
        description: { type: [string, 'null'] }
        status:
          type: string
          enum: [inbox, todo, doing, done]
          description: La columna. Es diu `status`, no `column` (D2).
        position:
          type: string
          description: Índex fraccional. Ordenat amb collation binària (D3).
        due_date:
          type: [string, 'null']
          description: YYYY-MM-DD, sense fus. Una data de tot el dia no té instant.
        due_time: { type: [string, 'null'] }
        deadline: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        view_mode:
          type: string
          enum: [card, simple]
        ai_mode:
          type: string
          enum: [manual, assisted, delegated]
          description: Delegar no és assignar (D5).
        delegate_agent_id: { type: [string, 'null'] }
        rrule:
          type: [string, 'null']
          description: 'RFC 5545, o `null` si no es repeteix.'
        recurrence_mode:
          type: [string, 'null']
          enum: [schedule, completion, null]
          description: |
            `schedule` compta des del venciment; `completion`, des que es fa. És la
            distinció que Todoist escriu com a `every` contra `every!` i que RRULE no sap
            expressar (docs/01 §4).
        recurrence_parent_id:
          type: [string, 'null']
          description: La instància de la qual ve, si n'és una repetició.
        progress:
          type: object
          required: [done, total, lists]
          description: |
            Subtasques i ítems de llista **comptats junts**. La targeta els ensenya sota
            un sol commutador ("3/7 fets") perquè per a qui mira el tauler són el mateix:
            coses que falten dins d'aquesta tasca. La distinció importa en obrir-la.

            És un agregat i no la llista: portar tots els ítems de totes les targetes
            faria baixar milers de files per pintar unes quantes pastilles.
          properties:
            done: { type: integer }
            total: { type: integer }
            lists:
              type: integer
              description: |
                Quants blocs desplegables té la targeta: un per les subtasques, si en té,
                i un per cada llista. És el número del commutador "Llistes (2)", que
                compta blocs i no ítems.
        assignee_ids:
          type: array
          items: { type: string }
          description: Persones. El brief demana "persona o persones".
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    TaskInput:
      type: object
      additionalProperties: false
      required: [scope_id, title]
      properties:
        id: { type: string }
        scope_id:
          type: string
          description: Obligatori. Mai una tasca sense àmbit (docs/01 §4).
        project_id: { type: string }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status:
          type: string
          enum: [inbox, todo, doing, done]
          default: inbox
        position: { type: string }
        due_date: { type: string }
        due_time: { type: string }
        assignee_ids:
          type: array
          items: { type: string }

    MoveInput:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [inbox, todo, doing, done]
        position:
          type: string
          description: El camí normal. La calcula el client (D3).
        before_id:
          type: [string, 'null']
          description: Per a clients simples, perquè el servidor calculi la posició.
        after_id:
          type: [string, 'null']

    TaskPage:
      type: object
      additionalProperties: false
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }

    BoardColumn:
      type: object
      additionalProperties: false
      required: [status, groups]
      properties:
        status:
          type: string
          enum: [inbox, todo, doing, done]
        groups:
          type: array
          description: Agrupades per àmbit, com les pinta la interfície (docs/02 §4).
          items:
            $ref: '#/components/schemas/BoardGroup'

    BoardGroup:
      type: object
      additionalProperties: false
      required: [scope_id, tasks]
      properties:
        scope_id: { type: string }
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    Board:
      type: object
      additionalProperties: false
      required: [columns]
      properties:
        columns:
          type: array
          description: Sempre les QUATRE, encara que alguna sigui buida.
          items:
            $ref: '#/components/schemas/BoardColumn'

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, expires_at]
      properties:
        access_token:
          type: string
          description: Vida curta. A la web viatja en galeta HttpOnly; a Android com a Bearer.
        refresh_token:
          type: string
          description: Vida llarga i d'un sol ús. Cada refresc n'emet un de nou.
        expires_at:
          type: string
          format: date-time
          description: Caducitat del token de refresc.

    Me:
      type: object
      additionalProperties: false
      required: [id, name, kind, capabilities, scope_ids]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: [string, 'null']
        kind:
          type: string
          enum: [user, agent, guest]
          description: Quina mena de principal és aquesta credencial.
        role:
          type: string
          enum: [admin, member]
        timezone:
          type: string
          description: Les consultes de "avui" es resolen en el fus de qui mira (docs/01 §8).
        capabilities:
          type: array
          items:
            type: string
          description: Les capacitats EFECTIVES, ja intersecades amb el rol del propietari.
        scope_ids:
          type: [array, 'null']
          items:
            type: string
          description: |
            Els àmbits accessibles, o `null` per a tots els del propietari. Regla 9: això
            surt del registre del token, no de cap scope d'OAuth.
        agent_id:
          type: [string, 'null']
          description: Si la credencial és d'un agent, quin. Delegar no és assignar (D5).

    Info:
      type: object
      additionalProperties: false
      required: [name, version, registration]
      properties:
        name:
          type: string
          description: Nom de la instància, configurable per qui l'allotja.
          examples: ['Fem-ho']
        version:
          type: string
          description: Versió del servidor, en semàntica de versions.
          examples: ['0.1.0']
        registration:
          type: string
          enum: [disabled, invite, open]
          description: |
            Si la instància accepta altes. Surt de FEMHO_REGISTRATION i per defecte és
            `disabled`, que és el correcte per a una instància familiar exposada a
            internet (docs/12 §7).
        setup_required:
          type: boolean
          description: |
            Cert mentre no hi hagi cap administrador. Mentre ho sigui, /setup és
            accessible; un cop creat el primer administrador, es tanca per sempre.

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      additionalProperties: false
      required: [status, database, schema_version]
      properties:
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [sqlite, postgres]
          description: El motor amb què corre la instància (D11).
        schema_version:
          type: string
          description: L'última migració aplicada.
          examples: ['001-initial-schema']

    Problem:
      type: object
      description: |
        Error en application/problem+json (RFC 9457, docs/05 §3). `type` i `title` són
        estables i en anglès per poder-hi programar; `detail` va en l'idioma de
        l'Accept-Language.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ['https://femho.app/errors/scope-forbidden']
        title:
          type: string
          examples: ['Scope not accessible']
        status:
          type: integer
          examples: [403]
        detail:
          type: string
          examples: ["Aquest token només té accés a l'àmbit Feina."]
        instance:
          type: string

  responses:
    Unauthenticated:
      description: Cal autenticar-se.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Sense permís. El cos diu QUINS àmbits veu el token i ON és el que s'ha demanat:
        un 403 mut fa que un agent reintenti en bucle (docs/05 §2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No existeix, o no és visible per a qui pregunta.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: femho_session
      description: Sessió de navegador. Galeta HttpOnly, Secure, SameSite=Lax.
    bearer:
      type: http
      scheme: bearer
      description: |
        Token d'accés (Android) o token d'API `femho_pat_…` (integracions, MCP, IA).
        Les capacitats i els àmbits van al registre del token, no a scopes d'OAuth
        (regla 9).

security:
  - session: []
  - bearer: []
