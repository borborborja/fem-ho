      properties:
        id: { type: string }
        scope_id: { type: string }
        name: { type: string, minLength: 1 }
        ai_instructions: { type: string }
        ai_description: { type: string }
        position: { type: string }

    Task:
      type: object
      additionalProperties: false
      required:
        [id, scope_id, title, status, position, ai_mode, view_mode, created_at, updated_at, version]
      properties:
        id: { type: string }
        scope_id: { type: string }
        project_id: { type: [string, 'null'] }
        title: { type: string }
        description: { type: [string, 'null'] }
        status:
          type: string
          enum: [inbox, todo, doing, done]
          description: La columna. Es diu `status`, no `column` (D2).
        position:
          type: string
          description: Índex fraccional. Ordenat amb collation binària (D3).
        due_date:
          type: [string, 'null']
          description: YYYY-MM-DD, sense fus. Una data de tot el dia no té instant.
        due_time: { type: [string, 'null'] }
        deadline: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        view_mode:
          type: string
          enum: [card, simple]
        ai_mode:
          type: string
          enum: [manual, assisted, delegated]
          description: Delegar no és assignar (D5).
        delegate_agent_id: { type: [string, 'null'] }
        rrule:
          type: [string, 'null']
          description: 'RFC 5545, o `null` si no es repeteix.'
        recurrence_mode:
          type: [string, 'null']
          enum: [schedule, completion, null]
          description: |
            `schedule` compta des del venciment; `completion`, des que es fa. És la
            distinció que Todoist escriu com a `every` contra `every!` i que RRULE no sap
            expressar (docs/01 §4).
        recurrence_parent_id:
          type: [string, 'null']
          description: La instància de la qual ve, si n'és una repetició.
        source_kind:
          type: [string, 'null']
          enum: [caldav, ical, rss, null]
          description: |
            De quina **mena de font** ve aquesta tasca, o nul si l'ha escrita una persona.

            **No és `activity_log.source`**: aquell diu per quin canal ha entrat una
            escriptura —web, Android, MCP— i aquest diu d'on ve el contingut.

            És el que respon la pregunta que fa la icona de provinença, i el que fa que
            afegir una font nova sigui **un valor més i no una columna més**: les
            referències específiques de cada mena (`event_calendar_id`, `event_uid`…)
            diuen *quin* origen concret, i això diu *quina mena*.
        progress:
          type: object
          required: [done, total, lists]
          description: |
            Subtasques i ítems de llista **comptats junts**. La targeta els ensenya sota
            un sol commutador ("3/7 fets") perquè per a qui mira el tauler són el mateix:
            coses que falten dins d'aquesta tasca. La distinció importa en obrir-la.

            És un agregat i no la llista: portar tots els ítems de totes les targetes
            faria baixar milers de files per pintar unes quantes pastilles.
          properties:
            done: { type: integer }
            total: { type: integer }
            lists:
              type: integer
              description: |
                Quants blocs desplegables té la targeta: un per les subtasques, si en té,
                i un per cada llista. És el número del commutador "Llistes (2)", que
                compta blocs i no ítems.
        assignee_ids:
          type: array
          items: { type: string }
          description: Persones. El brief demana "persona o persones".
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    TaskInput:
      type: object
      additionalProperties: false
      required: [scope_id, title]
      properties:
        id: { type: string }
        scope_id:
          type: string
          description: Obligatori. Mai una tasca sense àmbit (docs/01 §4).
        project_id: { type: string }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status:
          type: string
          enum: [inbox, todo, doing, done]
          default: inbox
        position: { type: string }
        due_date: { type: string }
        due_time: { type: string }
        assignee_ids:
          type: array
          items: { type: string }
        source_event:
          type: object
          additionalProperties: false
          required: [calendar_id, uid]
          description: |
            De quin esdeveniment surt aquesta tasca.

            **És una referència morta, no un enllaç viu** (P6). Esborrar l'esdeveniment no
            toca la tasca, i esborrar la tasca no toca l'esdeveniment: l'alternativa
            voldria dir que treure una cita d'un calendari compartit esborrés en silenci
            la tasca que algú altre s'havia apuntat.

            S'identifica per `calendar_id` + `uid` + `recurrence_id` i **no per l'`id` de
            la fila**: el refresc d'una font la reescriu i la pot tornar a la vida.

            Mentre la tasca visqui, la cita **no surt a la bústia**: seria la mateixa
            obligació dues vegades. Què passa en esborrar-la ho decideix
            `UserSettings.event_task_deleted`.
          properties:
            calendar_id: { type: string, format: uuid }
            uid: { type: string }
            recurrence_id: { type: [string, 'null'] }

    MoveInput:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [inbox, todo, doing, done]
        position:
          type: string
          description: El camí normal. La calcula el client (D3).
        before_id:
          type: [string, 'null']
          description: Per a clients simples, perquè el servidor calculi la posició.
        after_id:
          type: [string, 'null']

    TaskPage:
      type: object
      additionalProperties: false
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }

    BoardColumn:
      type: object
      additionalProperties: false
      required: [status, groups]
      properties:
        status:
          type: string
          enum: [inbox, todo, doing, done]
        groups:
          type: array
          description: Agrupades per àmbit, com les pinta la interfície (docs/02 §4).
          items:
            $ref: '#/components/schemas/BoardGroup'

    BoardGroup:
      type: object
      additionalProperties: false
      required: [scope_id, tasks]
      properties:
        scope_id: { type: string }
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    Board:
      type: object
      additionalProperties: false
      required: [columns]
      properties:
        columns:
          type: array
          description: Sempre les QUATRE, encara que alguna sigui buida.
          items:
            $ref: '#/components/schemas/BoardColumn'

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, expires_at]
      properties:
        access_token:
          type: string
          description: Vida curta. A la web viatja en galeta HttpOnly; a Android com a Bearer.
        refresh_token:
          type: string
          description: Vida llarga i d'un sol ús. Cada refresc n'emet un de nou.
        expires_at:
          type: string
          format: date-time
          description: Caducitat del token de refresc.

    Me:
      type: object
      additionalProperties: false
      required: [id, name, kind, capabilities, scope_ids]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: [string, 'null']
        kind:
          type: string
          enum: [user, agent, guest]
          description: Quina mena de principal és aquesta credencial.
        role:
          type: string
          enum: [admin, member]
        timezone:
          type: string
          description: Les consultes de "avui" es resolen en el fus de qui mira (docs/01 §8).
        capabilities:
          type: array
          items:
            type: string
          description: Les capacitats EFECTIVES, ja intersecades amb el rol del propietari.
        scope_ids:
          type: [array, 'null']
          items:
            type: string
          description: |
            Els àmbits accessibles, o `null` per a tots els del propietari. Regla 9: això
            surt del registre del token, no de cap scope d'OAuth.
        agent_id:
          type: [string, 'null']
          description: Si la credencial és d'un agent, quin. Delegar no és assignar (D5).

    Info:
      type: object
      additionalProperties: false
      required: [name, version, registration]
      properties:
        name:
          type: string
          description: Nom de la instància, configurable per qui l'allotja.
          examples: ['Fem-ho']
        version:
          type: string
          description: Versió del servidor, en semàntica de versions.
          examples: ['0.1.0']
        registration:
          type: string
          enum: [disabled, invite, open]
          description: |
            Si la instància accepta altes. Surt de FEMHO_REGISTRATION i per defecte és
            `disabled`, que és el correcte per a una instància familiar exposada a
            internet (docs/12 §7).
        setup_required:
          type: boolean
          description: |
            Cert mentre no hi hagi cap administrador. Mentre ho sigui, /setup és
            accessible; un cop creat el primer administrador, es tanca per sempre.
        license:
          type: string
          examples: ['AGPL-3.0-or-later']
        source_url:
          type: string
          format: uri
          description: |
            On és el codi d'aquesta instància. **No és publicitat: és l'article 13 de
            l'AGPL.** Qui hi accedeix per xarxa té dret al codi de la versió que li està
            servint, i la manera d'oferir-lo és dir-li on és. Per això va a `/info`, que
            és públic i sense autenticar: el dret el té qualsevol que hi arribi, no
            només qui hi tingui compte.

            Qui publiqui una versió modificada hi ha de posar la seva, amb
            `FEMHO_SOURCE_URL`: amb aquesta apuntant a l'original, els seus usuaris no
            podrien arribar al codi que realment els està servint.

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      additionalProperties: false
      required: [status, database, schema_version]
      properties:
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [sqlite, postgres]
          description: El motor amb què corre la instància (D11).
        schema_version:
          type: string
          description: L'última migració aplicada.
          examples: ['001-initial-schema']

    Problem:
      type: object
      description: |
        Error en application/problem+json (RFC 9457, docs/05 §3).

        **Qui llegeix un error no és qui el pateix.** El reben tres públics molt
        diferents: una persona davant de l'app, un agent per MCP, i un client CalDAV com
        DAVx⁵ o Thunderbird. Els dos últims no tenen ni catàleg ni idioma. Per això
        l'error viatja en dues peces:

        - `type`, `title` i `detail` **en anglès**, estables, per programar-hi.
        - `params`, les **dades** de l'error. Les apps hi posen el text del seu catàleg
          amb la clau `error.<slug>`, on el `slug` és l'últim tram del `type`. Si no en
          tenen la clau, ensenyen el `detail`: així un error nou del servidor no deixa
          mai una pantalla muda ni obliga a desplegar les dues bandes alhora.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ['https://femho.app/errors/scope-forbidden']
        title:
          type: string
          examples: ['Scope not accessible']
        params:
          type: object
          additionalProperties: { type: [string, integer] }
          description: |
            Les dades de l'error, planes. Plans a posta: el client no ha de saber
            recórrer un JSON dins d'un JSON per pintar un missatge.
          examples: [{ name: 'Família', count: 3 }]
        status:
          type: integer
          examples: [403]
        detail:
          type: string
          examples: ["Aquest token només té accés a l'àmbit Feina."]
        instance:
          type: string

  responses:
    Unauthenticated:
      description: Cal autenticar-se.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Sense permís. El cos diu QUINS àmbits veu el token i ON és el que s'ha demanat:
        un 403 mut fa que un agent reintenti en bucle (docs/05 §2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No existeix, o no és visible per a qui pregunta.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: femho_session
      description: Sessió de navegador. Galeta HttpOnly, Secure, SameSite=Lax.
    bearer:
      type: http
      scheme: bearer
      description: |
        Token d'accés (Android) o token d'API `femho_pat_…` (integracions, MCP, IA).
        Les capacitats i els àmbits van al registre del token, no a scopes d'OAuth
        (regla 9).

security:
  - session: []
  - bearer: []
