        expires_at: { type: string, format: date-time }
    ShareSummary:
      type: object
      required: [id, permission, require_name, has_password, view_count, created_at]
      properties:
        id: { type: string }
        task_id: { type: [string, 'null'] }
        checklist_id: { type: [string, 'null'] }
        permission:
          type: string
          enum: [view, check, comment]
        require_name: { type: boolean }
        has_password:
          type: boolean
          description: Si en té, no quina. La contrasenya es guarda amb argon2id.
        expires_at: { type: [string, 'null'], format: date-time }
        max_views: { type: [integer, 'null'] }
        view_count: { type: integer }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }

    ApiTokenSummary:
      type: object
      required: [id, name, token_prefix, capabilities, scope_ids, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        token_prefix:
          type: string
          description: Els primers caràcters, per poder-lo reconèixer a la llista.
        capabilities:
          type: array
          items: { type: string }
        scope_ids:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }

    ActivityEntry:
      type: object
      required: [id, entity_type, entity_id, verb, actor_type, source, created_at]
      properties:
        id:
          type: string
          description: UUIDv7, que ordena per temps sense un comptador a part.
        entity_type: { type: string }
        entity_id: { type: string }
        verb: { type: string }
        actor_type:
          type: string
          enum: [user, ai_agent, guest, system, caldav]
        actor_user_id: { type: [string, 'null'] }
        actor_agent_id: { type: [string, 'null'] }
        actor_label:
          type: [string, 'null']
          description: '"Borja", "IA · Claude", "Extern · Marta".'
        source: { type: string }
        changes:
          type: [object, 'null']
          description: |
            `{camp: {from, to}}`. És el que fa possible el botó Desfés: sense el valor
            anterior no hi ha res a què tornar.

            La forma és fixa i el contracte ho diu, perquè `additionalProperties: true`
            generava un `unknown` per valor i obligava cada client a assumir-ne la forma
            pel seu compte, que és exactament el que la regla 5 evita.
          additionalProperties:
            type: object
            required: [from, to]
            properties:
              from: {}
              to: {}
        created_at: { type: string, format: date-time }
        undoable:
          type: boolean
          description: Un canvi autònom d'IA que encara es pot desfer.

    SyncChange:
      type: object
      additionalProperties: false
      required: [entity, id, op, seq]
      properties:
        entity: { type: string }
        id: { type: string }
        op:
          type: string
          enum: [upsert, delete]
        seq: { type: integer }
        data:
          type: object
          additionalProperties: true
          description: L'entitat SENCERA. Absent als `delete`.

    SyncResponse:
      type: object
      additionalProperties: false
      required: [changes, dropped_scopes, next_cursor, has_more, server_time]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        dropped_scopes:
          type: array
          items: { type: string }
          description: |
            Àmbits que aquest usuari ha deixat de veure des del seu cursor. El client hi
            ha d'esborrar tot el que en porti l'identificador.

            **No arriba per `changes`**: perdre accés a un àmbit no genera cap fila de
            canvi, i sense això les dades d'un àmbit del qual has sortit et queden al
            dispositiu per sempre.
        next_cursor: { type: string }
        has_more: { type: boolean }
        server_time:
          type: string
          format: date-time
          description: |
            Perquè el client detecti desviació de rellotge. Un rellotge mal posat trenca
            els recordatoris i les comparacions de "avui" (docs/06 §3).

    SyncOperation:
      type: object
      additionalProperties: false
      required: [op_id, entity, op, id]
      properties:
        op_id:
          type: string
          description: Clau d'idempotència. Reenviar el lot no duplica res.
        entity: { type: string }
        op:
          type: string
          enum: [create, update, delete, move]
        id: { type: string }
        base_version:
          type: integer
          description: La versió sobre la qual s'edita.
        data:
          type: object
          additionalProperties: true

    SyncBatch:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'

    SyncBatchResult:
      type: object
      additionalProperties: false
      required: [op_id, status]
      properties:
        op_id: { type: string }
        status:
          type: string
          enum: [ok, conflict, rejected]
          description: Tres resultats i prou (docs/06 §4).
        entity:
          type: object
          additionalProperties: true
        server_entity:
          type: object
          additionalProperties: true
          description: L'estat actual, perquè el client pugui fusionar sense una altra petició.
        error:
          type: object
          additionalProperties: true

    SyncBatchResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncBatchResult'

    Checklist:
      type: object
      additionalProperties: false
      required: [id, task_id, name, pinned, show_completed_inline, position, items, version]
      properties:
        id: { type: string }
        task_id: { type: string }
        subtask_id:
          type: [string, 'null']
          description: Ancoratge opcional a una subtasca concreta (P1).
        name: { type: string }
        pinned:
          type: boolean
          description: Pinejat PER USUARI. El rail és de cada persona.
        show_completed_inline:
          type: boolean
          description: |
            Completats ratllats al seu lloc, o en una secció "Completats" al final,
            plegada amb el recompte (docs/02 §6).
        position: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        version: { type: integer }

    ChecklistInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1 }
        subtask_id: { type: string }
        show_completed_inline: { type: boolean }

    ChecklistItem:
      type: object
      additionalProperties: false
      required: [id, checklist_id, text, done, position]
      properties:
        id: { type: string }
        checklist_id: { type: string }
        text: { type: string }
        done: { type: boolean }
        done_at: { type: [string, 'null'], format: date-time }
        done_by: { type: [string, 'null'] }
        position: { type: string }

    ChecklistItemInput:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        text: { type: string, minLength: 1 }
        done: { type: boolean }
        position: { type: string }

    ChecklistItemResult:
      type: object
      additionalProperties: false
      required: [item, cascade]
      properties:
        item:
          $ref: '#/components/schemas/ChecklistItem'
        cascade:
          type: object
          additionalProperties: false
          required: [checklist_completed, subtask_completed, task_completed]
          description: Què ha tocat la cascada amunt, perquè la interfície ho pugui dir.
          properties:
            checklist_completed: { type: boolean }
            subtask_completed: { type: boolean }
            task_completed: { type: boolean }
            suggest_unpin:
              type: boolean
              description: |
                Cert quan una llista PINEJADA s'ha completat del tot: llavors es pregunta
                si es vol despinejar (P1).

    Calendar:
      type: object
      additionalProperties: false
      # `inbox_visible` hi és encara que pugui ser nul: el client ha de poder distingir
      # "no s'hi ha dit res" d'un camp que el servidor no ha enviat.
      required: [id, scope_id, name, kind, origin, writable, inbox_visible, inbox_visible_default]
      properties:
        id: { type: string }
        scope_id: { type: string }
        project_id: { type: [string, 'null'] }
        name: { type: string }
        color: { type: [string, 'null'] }
        kind:
          type: string
          enum: [events, todos]
          description: Obligatori i únic per col·lecció (D9).
        origin:
          type: string
          enum: [local, subscription]
          description: Les subscripcions són de només lectura a la capa de repositori.
        source_kind:
          type: [string, 'null']
          enum: [caldav, ical, rss, null]
          description: |
            De quina mena és la font externa. `caldav` és una col·lecció; `ical`, un
            document publicat; `rss`, un canal on **cada element és un instant** —no una
            durada— i es converteix en un VEVENT sense hora de final.
        source_url: { type: [string, 'null'] }
        source_username: { type: [string, 'null'] }
        writable:
          type: boolean
          default: false
          description: |
            La font és **bidireccional**. Només un CalDAV pot ser-ho: un `.ics` publicat
            i un RSS són documents, no col·leccions on es pugui escriure. Amb `false`,
            el calendari és de només lectura a la capa de repositori.
        refresh_interval: { type: [integer, 'null'] }
        last_refreshed_at: { type: [string, 'null'], format: date-time }
        last_error:
          type: [string, 'null']
          description: |
            Per què va fallar l'últim refresc. Sense això, una font caiguda es veu
            exactament igual que una que no té esdeveniments.
        last_error_at: { type: [string, 'null'], format: date-time }
        shared_with_scope:
          type: boolean
          default: false
          description: |
            Si els membres de l'àmbit el veuen.

            **El defecte és `false`, i la polaritat és l'oposada a `hidden_calendar_ids`.**
            Allà es desa el que s'amaga perquè una font nova ha de sortir sola; aquí un
            calendari creat DESPRÉS de compartir l'àmbit no pot filtrar-se tot sol. El
            fracàs de l'un és una molèstia; el de l'altre és una divulgació.
        has_credentials:
          type: boolean
          description: |
            Si la font porta usuari i contrasenya guardats. **El secret no surt mai** del
            servei; això només diu que n'hi ha, perquè la interfície pugui avisar abans
            de compartir el calendari.
        inbox_visible:
          type: [boolean, 'null']
          description: |
            Si aquesta font entra a la bústia diària.

            **Tri-estat, i els tres valors diuen coses diferents.** `null` és "no s'hi ha
            dit res i val el defecte"; `false` és "aquesta no, encara que el defecte digui
            que sí". Es desa **l'excepció i no l'estat**, com `hidden_calendar_ids`: el dia
            que el defecte canviï, qui no hagi tocat res segueix el defecte nou sense que
            calgui migrar cap fila.

            Llegir-lo com un booleà trauria de la bústia tots els calendaris on ningú ha
            tocat res. Per ensenyar l'interruptor, `inbox_visible ?? inbox_visible_default`.
        inbox_visible_default:
          type: boolean
          description: |
            Què li tocaria si ningú digués res: **els calendaris sí i els canals RSS no**.
            Un RSS pot publicar desenes de titulars al dia i la bústia és l'entrada de tot.

            El calcula el servidor perquè la regla visqui en un sol lloc i cap client
            l'hagi de duplicar.

    Event:
      type: object
      additionalProperties: false
      required: [id, calendar_id, uid, summary, starts_at, all_day, version]
      properties:
        id: { type: string }
        calendar_id: { type: string }
        uid: { type: string, description: UID d'iCalendar. }
        recurrence_id:
          type: [string, 'null']
          description: Nul al mestre. Amb valor, és una instància modificada (D8).
        summary: { type: string }
        description: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        all_day:
          type: boolean
          description: |
            VALUE=DATE és tot el dia i NO té fus. Convertir-lo a mitjanit UTC és l'error
            que fa que els aniversaris apareguin el dia abans a mig món (docs/07 §8).
        timezone: { type: [string, 'null'] }
        status:
          type: string
          enum: [TENTATIVE, CONFIRMED, CANCELLED]
          description: Els de VEVENT. Els de VTODO són uns altres (D8).
        transparency:
          type: string
          enum: [OPAQUE, TRANSPARENT]
          description: Si ocupa temps. VTODO no en té equivalent.
        rrule: { type: [string, 'null'] }
        version: { type: integer }

    EventInput:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        calendar_id: { type: string }
        summary: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        all_day: { type: boolean }
        timezone: { type: string }
        status:
          type: string
          enum: [TENTATIVE, CONFIRMED, CANCELLED]
        transparency:
          type: string
          enum: [OPAQUE, TRANSPARENT]
        rrule: { type: string }

    EventOccurrence:
      type: object
      additionalProperties: false
      required: [event_id, uid, summary, starts_at, ends_at, all_day, scope_id, in_inbox]
      properties:
        event_id: { type: string }
        uid: { type: string }
        recurrence_id:
          type: [string, 'null']
          description: L'inici que li tocaria segons la regla, encara que s'hagi mogut.
        summary: { type: string }
        location: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        all_day: { type: boolean }
        scope_id: { type: string }
        calendar_id: { type: string }
        status:
          type: string
          enum: [TENTATIVE, CONFIRMED, CANCELLED]
        is_override:
          type: boolean
          description: Cert si aquesta ocurrència ve d'una instància modificada.
        in_inbox:
          type: boolean
          description: |
            Si aquesta ocurrència és a la bústia de qui pregunta.

            **El calcula el servidor i el client no ho recalcula mai.** És el que fa que
            "difuminat al calendari" i "no és a la meva bústia" siguin literalment la
            mateixa cosa en comptes de dues que un dia divergeixen. Hi entren els cinc
            nivells: si ja n'hi ha una tasca viva, la marca de l'ocurrència, la de la
            sèrie, l'ajust del calendari i el defecte de la mena de font.

    Scope:
      type: object
      additionalProperties: false
      required: [id, name, kind, color, owner_id, position, created_at, updated_at, version]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [individual, collective]
        owner_id:
          type: string
          description: |
            Qui el va crear. Mana sempre, sigui quin sigui el `kind` i hi hagi fila de
            membre o no. La interfície el necessita per saber si pot convidar i expulsar.
        color:
          type: string
          description: Token CSS o hex. Els tres inicials fan servir la tríada de Plou.
        icon: { type: [string, 'null'] }
        ai_instructions: { type: [string, 'null'] }
        ai_description: { type: [string, 'null'] }
        position: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    ScopeInput:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        id:
          type: string
          description: UUIDv7 nu. El pot posar el client (D4).
        name: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [individual, collective]
          default: individual
        color: { type: string }
        icon: { type: string }
        ai_instructions: { type: string }
        ai_description: { type: string }
        position: { type: string }

    Project:
      type: object
      additionalProperties: false
