        actor_user_id:
          type: string
          description: La fila d'usuari `kind='ai'`, que és qui signa l'historial i els comentaris.
        can_create_tasks: { type: boolean }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    AgentInput:
      type: object
