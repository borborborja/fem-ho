<!-- @dsCard group="Colors" viewport="700x130" name="Danger & status dots" subtitle="The only red in Plou; dots cycle the triad" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--card-bg);padding:18px;box-sizing:border-box}
a{color:var(--plou-blue-ink)}a:hover{color:var(--plou-orange-ink)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{height:52px;border-radius:14px;border:1px solid var(--card-border)}
.n{font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:500}
.v{font-size:9.5px;color:var(--ink-faint);font-family:ui-monospace,monospace}
code{font-family:ui-monospace,monospace;font-size:10px;background:var(--code-bg);padding:2px 5px;border-radius:5px}
</style></head><body><div class="r" style="gap:20px">
<span style="display:inline-flex;align-items:center;padding:12px 20px;border-radius:100px;background:var(--danger-bg);color:var(--danger-text);font-weight:700;font-size:13.5px">Eliminar</span>
<span class="v">--danger-bg / --danger-text</span>
<div class="r" style="gap:8px;margin-left:auto">
<span style="width:12px;height:12px;border-radius:50%;background:var(--dot-1);display:inline-block"></span>
<span style="width:12px;height:12px;border-radius:50%;background:var(--dot-2);display:inline-block"></span>
<span style="width:12px;height:12px;border-radius:50%;background:var(--dot-3);display:inline-block"></span>
<span class="v">--dot-1/2/3</span></div></div></body></html>
