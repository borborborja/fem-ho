<!-- @dsCard group="Elevation" viewport="700x160" name="Shadows" subtitle="Neutral for surfaces, warm glow for gradient elements" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--card-bg);padding:18px;box-sizing:border-box}
a{color:var(--plou-blue-ink)}a:hover{color:var(--plou-orange-ink)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{height:52px;border-radius:14px;border:1px solid var(--card-border)}
.n{font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:500}
.v{font-size:9.5px;color:var(--ink-faint);font-family:ui-monospace,monospace}
code{font-family:ui-monospace,monospace;font-size:10px;background:var(--code-bg);padding:2px 5px;border-radius:5px}
</style></head><body><div class="r" style="gap:16px;align-items:center">
<div style="width:120px;height:64px;border-radius:24px;background:var(--card-bg);border:1px solid var(--card-border);box-shadow:var(--card-shadow)"></div>
<div class="v" style="width:110px">--card-shadow</div>
<div style="width:120px;height:44px;border-radius:100px;background:var(--gradient-brand);box-shadow:var(--shadow-primary)"></div>
<div class="v" style="width:110px">--shadow-primary</div>
<div style="width:120px;height:64px;border-radius:24px;background:var(--card-bg);box-shadow:var(--shadow-dialog)"></div>
<div class="v">--shadow-dialog</div>
</div></body></html>
