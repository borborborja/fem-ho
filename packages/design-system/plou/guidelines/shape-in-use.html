<!-- @dsCard group="Shape" viewport="700x160" name="Shape in use" subtitle="Card + capsule + circle, the three shapes of every screen" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--card-bg);padding:18px;box-sizing:border-box}
a{color:var(--plou-blue-ink)}a:hover{color:var(--plou-orange-ink)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{height:52px;border-radius:14px;border:1px solid var(--card-border)}
.n{font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:500}
.v{font-size:9.5px;color:var(--ink-faint);font-family:ui-monospace,monospace}
code{font-family:ui-monospace,monospace;font-size:10px;background:var(--code-bg);padding:2px 5px;border-radius:5px}
</style></head><body><div class="r" style="gap:14px;align-items:center">
<div class="plou-card" style="width:200px"><div class="plou-kicker">KICKER</div><div style="font-weight:800;font-size:16px;margin-top:6px">Título</div><p style="font-size:12.5px;color:var(--ink-soft);margin:6px 0 0">Cuerpo secundario.</p></div>
<div style="display:flex;flex-direction:column;gap:10px">
<button class="plou-btn plou-btn-primary">Acción primaria</button>
<button class="plou-btn plou-btn-ghost">Acción secundaria</button>
<div class="plou-seg"><span class="plou-seg-opt" style="background:var(--gradient-brand-alt);color:#fff;font-weight:700">Uno</span><span class="plou-seg-opt">Dos</span><span class="plou-seg-opt">Tres</span></div>
</div>
<div style="display:flex;gap:10px"><span class="plou-fab" style="background:var(--gradient-brand);color:#fff"></span><span class="plou-fab"></span></div>
</div></body></html>
