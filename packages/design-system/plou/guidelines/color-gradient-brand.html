<!-- @dsCard group="Colors" viewport="700x150" name="Signature gradient" subtitle="One instance per view — primary action or active state" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--card-bg);padding:18px;box-sizing:border-box}
a{color:var(--plou-blue-ink)}a:hover{color:var(--plou-orange-ink)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{height:52px;border-radius:14px;border:1px solid var(--card-border)}
.n{font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:500}
.v{font-size:9.5px;color:var(--ink-faint);font-family:ui-monospace,monospace}
code{font-family:ui-monospace,monospace;font-size:10px;background:var(--code-bg);padding:2px 5px;border-radius:5px}
</style></head><body><div class="sw" style="height:60px;background:var(--gradient-brand);border:none"></div>
<div class="n"><code>--gradient-brand</code> · linear-gradient(135deg,#6EA8FF 0%,#FF9D4D 55%,#FF6FA0 100%)</div>
<div class="r" style="margin-top:12px">
<span style="font-weight:900;font-size:22px;background:var(--gradient-brand-text);-webkit-background-clip:text;background-clip:text;color:transparent">Plou</span>
<span class="v">--gradient-brand-text (clipped text)</span>
<div class="sw" style="width:70px;height:26px;border-radius:100px;background:var(--gradient-toggle);border:none"></div>
<span class="v">--gradient-toggle</span></div></body></html>
