<!-- @dsCard group="Spacing" viewport="700x160" name="Component padding" subtitle="Exact values from the source screens" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--card-bg);padding:18px;box-sizing:border-box}
a{color:var(--plou-blue-ink)}a:hover{color:var(--plou-orange-ink)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{height:52px;border-radius:14px;border:1px solid var(--card-border)}
.n{font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:500}
.v{font-size:9.5px;color:var(--ink-faint);font-family:ui-monospace,monospace}
code{font-family:ui-monospace,monospace;font-size:10px;background:var(--code-bg);padding:2px 5px;border-radius:5px}
</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
<div style="border:1px dashed var(--card-border);border-radius:24px;padding:22px"><div style="background:var(--gradient-wash-cool);border-radius:10px;height:34px"></div><div class="n">--pad-card · 22px</div></div>
<div style="border:1px dashed var(--card-border);border-radius:24px;padding:18px"><div style="background:var(--gradient-wash-cool);border-radius:10px;height:34px"></div><div class="n">--pad-card-mobile · 18px</div></div>
<div style="border:1px dashed var(--card-border);border-radius:22px;padding:16px"><div style="background:var(--gradient-wash-cool);border-radius:10px;height:34px"></div><div class="n">--pad-card-tight · 16px</div></div>
<div style="border:1px dashed var(--card-border);border-radius:18px;padding:12px"><div style="background:var(--gradient-wash-cool);border-radius:10px;height:34px"></div><div class="n">--pad-tile · 12px</div></div>
</div></body></html>
