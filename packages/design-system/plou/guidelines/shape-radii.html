<!-- @dsCard group="Shape" viewport="700x150" name="Corner radii" subtitle="Nothing in Plou has a square corner" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--card-bg);padding:18px;box-sizing:border-box}
a{color:var(--plou-blue-ink)}a:hover{color:var(--plou-orange-ink)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{height:52px;border-radius:14px;border:1px solid var(--card-border)}
.n{font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:500}
.v{font-size:9.5px;color:var(--ink-faint);font-family:ui-monospace,monospace}
code{font-family:ui-monospace,monospace;font-size:10px;background:var(--code-bg);padding:2px 5px;border-radius:5px}
</style></head><body><div class="r" style="gap:14px;align-items:flex-end">
<div><div style="width:86px;height:56px;border-radius:100px;background:var(--seg-bg)"></div><div class="n">pill · 100px</div></div>
<div><div style="width:56px;height:56px;border-radius:50%;background:var(--ghost-bg)"></div><div class="n">circle · 50%</div></div>
<div><div style="width:86px;height:56px;border-radius:28px;background:var(--ghost-bg)"></div><div class="n">dialog/panel · 28px</div></div>
<div><div style="width:86px;height:56px;border-radius:24px;background:var(--ghost-bg)"></div><div class="n">card · 24px</div></div>
<div><div style="width:86px;height:56px;border-radius:18px;background:var(--ghost-bg)"></div><div class="n">tile · 18px</div></div>
<div><div style="width:86px;height:56px;border-radius:14px;background:var(--ghost-bg)"></div><div class="n">input/nav · 14px</div></div>
</div></body></html>
