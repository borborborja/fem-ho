<!-- @dsCard group="Colors" viewport="700x130" name="Brand triad" subtitle="The three sunset stops — blue, orange, pink" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--card-bg);padding:18px;box-sizing:border-box}
a{color:var(--plou-blue-ink)}a:hover{color:var(--plou-orange-ink)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{height:52px;border-radius:14px;border:1px solid var(--card-border)}
.n{font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:500}
.v{font-size:9.5px;color:var(--ink-faint);font-family:ui-monospace,monospace}
code{font-family:ui-monospace,monospace;font-size:10px;background:var(--code-bg);padding:2px 5px;border-radius:5px}
</style></head><body><div class="g" style="grid-template-columns:repeat(3,1fr)">
<div><div class="sw" style="background:var(--plou-blue)"></div><div class="n">Azul <span class="v">#6EA8FF</span></div></div>
<div><div class="sw" style="background:var(--plou-orange)"></div><div class="n">Naranja <span class="v">#FF9D4D</span></div></div>
<div><div class="sw" style="background:var(--plou-pink)"></div><div class="n">Rosa <span class="v">#FF6FA0</span></div></div>
</div></body></html>
