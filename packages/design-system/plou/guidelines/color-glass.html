<!-- @dsCard group="Colors" viewport="700x150" name="Glass over the map" subtitle="Identical in both themes — dark fill, white text" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--card-bg);padding:18px;box-sizing:border-box}
a{color:var(--plou-blue-ink)}a:hover{color:var(--plou-orange-ink)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{height:52px;border-radius:14px;border:1px solid var(--card-border)}
.n{font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:500}
.v{font-size:9.5px;color:var(--ink-faint);font-family:ui-monospace,monospace}
code{font-family:ui-monospace,monospace;font-size:10px;background:var(--code-bg);padding:2px 5px;border-radius:5px}
</style></head><body><div style="position:relative;height:96px;border-radius:18px;overflow:hidden;background:var(--gradient-radar)">
<div style="position:absolute;left:14px;right:14px;top:16px;height:38px;border-radius:100px;background:var(--glass-bg);backdrop-filter:var(--blur-glass);border:1px solid var(--glass-border);display:flex;align-items:center;padding:0 16px;color:var(--glass-text);font-size:12px">Buscar lugar…</div>
<div style="position:absolute;left:14px;bottom:14px;font-size:9.5px;color:var(--glass-text-faint);font-family:ui-monospace,monospace">--glass-bg · --glass-border · --glass-text · --blur-glass</div>
</div></body></html>
