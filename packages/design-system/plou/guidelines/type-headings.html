<!-- @dsCard group="Type" viewport="700x160" name="Headings" subtitle="Section titles 900; card titles 800" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--card-bg);padding:18px;box-sizing:border-box}
a{color:var(--plou-blue-ink)}a:hover{color:var(--plou-orange-ink)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{height:52px;border-radius:14px;border:1px solid var(--card-border)}
.n{font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:500}
.v{font-size:9.5px;color:var(--ink-faint);font-family:ui-monospace,monospace}
code{font-family:ui-monospace,monospace;font-size:10px;background:var(--code-bg);padding:2px 5px;border-radius:5px}
</style></head><body><div style="display:flex;flex-direction:column;gap:8px">
<div><span style="font-weight:900;font-size:26px">Previsión</span> <span class="v">--text-section · 26px / 900</span></div>
<div><span style="font-weight:800;font-size:19px">Editar alarma</span> <span class="v">--text-h2 · 19px / 800</span></div>
<div><span style="font-weight:800;font-size:17px">Casa — Navata</span> <span class="v">--text-h3 · 17px / 800</span></div>
<div><span style="font-weight:800;font-size:16px">Título de tarjeta</span> <span class="v">--text-card-title · 16px / 800</span></div>
<div><span style="font-weight:700;font-size:15px">Precipitación prevista (6 h)</span> <span class="v">--text-subtitle · 15px / 700</span></div>
</div></body></html>
