# GENERAT de deploy/nginx.conf. Només canvien el TLS i els amfitrions.
# Fem-ho darrere de nginx (docs/12 §4).
#
# AQUEST ÉS EL CAS ON FALLA LA GENT, i el motiu és sempre el mateix: **nginx bloqueja
# els verbs de CalDAV per defecte**. Un `PROPFIND` rep un 405 i el client no diu res
# útil; l'usuari veu que "no funciona" i no hi ha manera de saber per què des de fora.
#
# Els tres blocs que la gent s'oblida són, per ordre de freqüència:
#   1. `dav_methods` / la llista de verbs permesos.
#   2. `proxy_buffering off` a l'SSE.
#   3. La redirecció de `/.well-known/caldav`.

upstream femho_app {
    server femho:8080;
    keepalive 32;
}

upstream femho_dav {
    # El CalDAV va al MATEIX procés però en un port propi (D1).
    server femho:8081;
    keepalive 8;
}

server {
    listen 80;
    server_name _;


    # Ha de coincidir amb FEMHO_MAX_UPLOAD_MB.
    client_max_body_size 25m;

    # ------------------------------------------------------------------ CalDAV
    #
    # **Els verbs, explícits.** Sense aquesta llista, nginx respon 405 a PROPFIND i el
    # calendari no apareix mai al client. És la causa número u de "no em funciona el
    # CalDAV".
    location /dav/ {
        # **Cap directiva `dav_methods` ni `dav_ext_methods` aquí, i és a posta.**
        #
        # Aquelles són del mòdul `ngx_http_dav_module`, i serveixen perquè nginx faci
        # de servidor WebDAV ell mateix. Aquí nginx és un PROXY: fent de proxy deixa
        # passar qualsevol verb tal com arriba, i posar-hi `dav_ext_methods` només
        # aconsegueix que nginx no arrenqui si la instal·lació no porta
        # `nginx-dav-ext-module` — que és el cas de la imatge oficial.
        #
        # Comprovat de veritat: amb un `proxy_pass` pelat, PROPFIND, PROPPATCH, REPORT,
        # MKCALENDAR, COPY i MOVE arriben tots al backend.
        #
        # El 405 que la gent es troba surt d'una altra banda: d'un `limit_except`, d'un
        # WAF al davant, o de tenir el mòdul dav mig configurat. Aquí no n'hi ha cap.
        proxy_pass http://femho_dav;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Apple envia `Expect: 100-continue` als PUT. Amb la memòria intermèdia de
        # peticions activada, nginx se'l menja i el client es queda esperant.
        proxy_request_buffering off;

        # Un PROPFIND sobre una col·lecció gran pot trigar.
        proxy_read_timeout 300s;
    }

    # El descobriment. Sense això, els clients no troben res encara que la resta
    # estigui perfecta.
    location = /.well-known/caldav {
        # `$http_host` i no `$host`: el segon **perd el port**, i en un desplegament que
        # no sigui al 443 la redirecció aniria a parar a un lloc que no existeix. Es va
        # veure a la matriu de proxies, on Caddy conservava el port i nginx no.
        return 301 http://$http_host/dav/;
    }

    # --------------------------------------------------------------------- SSE
    #
    # **Sense memòria intermèdia i amb temps d'espera llargs.** Amb el buffering per
    # defecte, els esdeveniments s'acumulen al proxy i arriben a bocins o no arriben, i
    # el temps d'espera de 60 s tallaria el flux cada minut.
    location = /api/v1/stream {
        proxy_pass http://femho_app;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        # Redundant amb `proxy_buffering off`, però el servidor també l'envia i deixar
        # els dos costats d'acord estalvia una hora de depuració a qui vingui després.
        proxy_set_header X-Accel-Buffering no;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        proxy_set_header Host              $host;
        proxy_set_header Connection        '';
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------- MCP
    #
    # El transport pot respondre com a flux d'esdeveniments: les mateixes regles.
    location = /mcp {
        proxy_pass http://femho_app;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------- La resta
    location / {
        proxy_pass http://femho_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

# Necessari per al bloc de dalt: nginx no porta `$connection_upgrade` de sèrie.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

